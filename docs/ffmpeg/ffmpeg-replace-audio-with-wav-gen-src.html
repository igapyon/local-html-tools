<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FFmpeg 音声差し替え（WAV）コマンドジェネレータ</title>
    <link rel="stylesheet" href="../../lht-cmn/css/components.css" />
  <link rel="stylesheet" href="src/ffmpeg-replace-audio-with-wav-gen/css/app.css" />

</head>
<body class="md-page">
  <svg aria-hidden="true" class="md-icon-sprite" width="0" height="0" viewBox="0 0 0 0" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <symbol id="md-icon-menu" viewBox="0 0 24 24">
        <path d="M4 6h16"/>
        <path d="M4 12h16"/>
        <path d="M4 18h16"/>
      </symbol>
      <symbol id="md-icon-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2"/>
        <rect x="4" y="4" width="11" height="11" rx="2"/>
      </symbol>
      <symbol id="md-icon-refresh" viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"/>
        <path d="M20 4v6h-6"/>
      </symbol>
    </defs>
  </svg>
  <div class="md-shell md-card">
    <lht-page-menu home-href="../index.html" home-label="トップへ戻る"></lht-page-menu>
<h1 class="md-headline"><span aria-hidden="true" class="md-headline__icon">🔁</span>FFmpeg 音声差し替え（WAV）コマンドジェネレータ</h1>

    <lht-help-text-field
      field-id="videoFile"
      label="元の動画ファイル*"
      required
      placeholder="例: input.mp4 / input.mkv / input.mov"
      field-class="md-field-block"
      help-text="例: input.mp4"
    ></lht-help-text-field>

    <lht-help-text-field
      field-id="audioFile"
      label="差し替える音声ファイル*"
      required
      placeholder="例: new_audio.wav"
      field-class="md-field-block"
      help-text="例: new_audio.wav"
    ></lht-help-text-field>

    <h2 class="md-section-title md-section-title--lg">1. WAV 解析（ffprobe）</h2>
    <button onclick="generateProbeCommand()" class="md-button md-button--primary md-field-block">
      ffprobe コマンド生成
    </button>
    <div class="md-field-block">
      <lht-command-block command-id="probeCmd"></lht-command-block>
    </div>

    <lht-help-text-field
      field-id="probeOutput"
      type="textarea"
      rows="6"
      label="ffprobe 出力（JSON/テキスト）"
      placeholder="ffprobe の出力を貼り付けてください"
      field-class="md-field-block"
      help-text="解析用 ffprobe コマンドの出力を貼り付けます。"
    ></lht-help-text-field>
    <button onclick="applyProbeResult()" class="md-button md-button--tonal md-field-block">
      解析結果を反映
    </button>
    <p id="probeSummary" class="md-muted md-field-block">解析結果: 未反映</p>

    <h2 class="md-section-title md-section-title--lg">2. 出力音声設定</h2>
    <div class="md-field-block">
      <div class="md-tooltip-group">
        <button type="button" onclick="applyYoutubePreset()" class="md-button md-button--tonal">
          YouTube用プリセット
        </button>
        <span class="md-tooltip-content md-tooltip md-tooltip--wide">
          MP4 / AAC / 48 kHz / 2ch / 320 kbps に一括設定します。
        </span>
      </div>
      <span class="md-tooltip-group">
        <span class="md-info-chip"><svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none"><circle cx="12" cy="12" r="9" fill="#cbbcf0"/><rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"/><circle cx="12" cy="7.5" r="1" fill="#ffffff"/></svg></span>
        <span class="md-tooltip-content md-tooltip md-tooltip--wide">
          MP4 / AAC / 48 kHz / 2ch / 320 kbps に一括設定します。最終アップロード向けの無難な設定です。編集/保存用途は別設定が向きます。プリセット後は解析結果の反映が不要なケースが多いです。
        </span>
      </span>
    </div>

    <lht-help-select
      field-id="container"
      label="出力コンテナ"
      field-class="md-field-block"
      help-text="生成する動画コンテナ形式を選択します。"
      onchange="handleContainerChange()"
    >
      <option value="mp4" selected>MP4</option>
      <option value="mkv">MKV</option>
      <option value="mov">MOV</option>
    </lht-help-select>

    <lht-switch-help class="md-field-block" switch-id="regenPts" label="PTS再生成" checked help-wide>
      YouTubeでの音ズレ対策に有効な場合があります。
    </lht-switch-help>

    <lht-help-select
      field-id="audioCodec"
      label="音声エンコード"
      field-class="md-field-block"
      help-text="音声コーデックを選択します。PCM は無圧縮です。"
      onchange="handleCodecChange()"
    >
      <option value="aac" selected>AAC（一般的）</option>
      <option value="libopus">Opus</option>
      <option value="ac3">AC-3</option>
      <option value="pcm_s16le">PCM 16-bit（無圧縮）</option>
      <option value="pcm_s24le">PCM 24-bit（無圧縮）</option>
    </lht-help-select>

    <lht-help-select
      field-id="sampleRate"
      label="サンプルレート"
      field-class="md-field-block"
      help-text="AAC を選ぶと 96 kHz までに制限されます。"
    >
      <option value="auto" selected>WAVに合わせる（自動）</option>
      <option value="44100">44.1 kHz</option>
      <option value="48000">48 kHz</option>
      <option value="96000">96 kHz</option>
      <option value="192000">192 kHz</option>
    </lht-help-select>
    <p id="sampleRateNote" class="md-muted md-field-block"></p>

    <lht-help-select
      field-id="channels"
      label="チャンネル数"
      field-class="md-field-block"
      help-text="自動または固定チャンネル数を選択します。"
    >
      <option value="auto" selected>WAVに合わせる（自動）</option>
      <option value="1">モノラル（1ch）</option>
      <option value="2">ステレオ（2ch）</option>
    </lht-help-select>

    <lht-help-select
      field-id="audioBitrate"
      label="音声ビットレート"
      field-class="md-field-block"
      help-text="PCM を選ぶとビットレート指定は無視されます。"
    >
      <option value="192k" selected>192 kbps（標準）</option>
      <option value="256k">256 kbps</option>
      <option value="320k">320 kbps</option>
    </lht-help-select>

    <lht-help-text-field
      field-id="outputFile"
      label="出力ファイル名"
      placeholder="例: output.mp4"
      field-class="md-field-block"
      help-text="任意。空欄なら自動生成します。"
    ></lht-help-text-field>

    <lht-help-text-field
      field-id="audioOffsetMs"
      type="number"
      label="音声タイミング調整（ms）"
      placeholder="例: 120（+で遅らせる / -で先行）"
      field-class="md-field-block"
      help-text="正の値は音声を遅らせます。負の値は音声を前に出します。"
    ></lht-help-text-field>

    <button onclick="generateReplaceAudioCmd()" class="md-button md-button--primary md-field-block">
      ffmpeg コマンド生成
    </button>

    <lht-command-block command-id="replaceCmd"></lht-command-block>

    <div id="toast" class="md-snackbar md-hidden">
      コピーしました
    </div>
  </div>

    <script src="../git/src/vendor/material-web-outlined-text-field.bundle.js"></script>
  <script src="../../lht-cmn/js/components.js"></script>
  <script src="src/ffmpeg-replace-audio-with-wav-gen/js/main.js"></script>

</body>
</html>
