<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FFmpeg ファイル結合コマンドジェネレータ</title>
    <link rel="stylesheet" href="../../lht-cmn/css/components.css" />
  <link rel="stylesheet" href="src/ffmpeg-concat-cmdline-gen/css/app.css" />

</head>
<body class="md-page">
  <svg aria-hidden="true" class="md-icon-sprite" width="0" height="0" viewBox="0 0 0 0" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <symbol id="md-icon-menu" viewBox="0 0 24 24">
        <path d="M4 6h16"/>
        <path d="M4 12h16"/>
        <path d="M4 18h16"/>
      </symbol>
      <symbol id="md-icon-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2"/>
        <rect x="4" y="4" width="11" height="11" rx="2"/>
      </symbol>
      <symbol id="md-icon-refresh" viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"/>
        <path d="M20 4v6h-6"/>
      </symbol>
    </defs>
  </svg>
  <div class="md-shell md-card">
    <lht-page-menu home-href="../index.html" home-label="トップへ戻る"></lht-page-menu>
<h1 class="md-headline"><span aria-hidden="true" class="md-headline__icon">🧩</span>FFmpeg ファイル結合コマンドジェネレータ</h1>

    <lht-text-field-help
      field-id="fileList"
      label="結合する .wav ファイル"
      type="textarea"
      rows="8"
      required
      placeholder="例:\nfile1.wav\nfile2.wav"
      field-class="md-field-block"
      help-text="例: file1.wav / file2.wav（1行に1ファイル）"
    ></lht-text-field-help>

    <button onclick="generateConcatCmd()" class="md-button md-button--primary md-field-block">
      filelist.txt + 結合コマンド生成
    </button>

    <lht-command-block command-id="concatCmd"></lht-command-block>

    <div id="toast" class="md-snackbar md-hidden">
      コピーしました
    </div>
  </div>

    <script src="../../lht-cmn/vendor/material-web-outlined-text-field.bundle.js"></script>
  <script src="../../lht-cmn/js/components.js" defer></script>
  <script src="src/ffmpeg-concat-cmdline-gen/js/main.js"></script>

</body>
</html>
