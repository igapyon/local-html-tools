<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FFmpeg 無音区間検出コマンドジェネレータ</title>
    <link rel="stylesheet" href="../../lht-cmn/css/components.css" />
  <link rel="stylesheet" href="src/ffmpeg-silence-detect-gen/css/app.css" />

</head>
<body class="md-page">
  <svg aria-hidden="true" class="md-icon-sprite" width="0" height="0" viewBox="0 0 0 0" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <symbol id="md-icon-menu" viewBox="0 0 24 24">
        <path d="M4 6h16"/>
        <path d="M4 12h16"/>
        <path d="M4 18h16"/>
      </symbol>
      <symbol id="md-icon-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2"/>
        <rect x="4" y="4" width="11" height="11" rx="2"/>
      </symbol>
      <symbol id="md-icon-refresh" viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"/>
        <path d="M20 4v6h-6"/>
      </symbol>
    </defs>
  </svg>
  <div class="md-shell md-card">
    <lht-page-menu home-href="../index.html" home-label="トップへ戻る"></lht-page-menu>
<h1 class="md-headline"><span aria-hidden="true" class="md-headline__icon">🔇</span>FFmpeg 無音区間検出コマンドジェネレータ</h1>

    <lht-text-field-help
      field-id="audioFile"
      label="音声ファイル名"
      required
      placeholder="例: input.wav"
      field-class="md-field-block"
      help-text="例: input.wav / input.flac / input.mp3"
    ></lht-text-field-help>

    <lht-text-field-help
      field-id="noiseDb"
      type="number"
      step="1"
      value="-50"
      label="無音判定しきい値 (dB)"
      field-class="md-field-block"
      help-text="この値より小さい音を無音として扱います。"
    ></lht-text-field-help>

    <lht-text-field-help
      field-id="minDuration"
      type="number"
      step="0.1"
      value="0.5"
      label="無音とみなす最小時間 (秒)"
      field-class="md-field-block"
      help-text="0.5 は「0.5秒以上続いたら無音」と判定します。"
    ></lht-text-field-help>
    <p class="md-muted md-field-block">例: 0.5 は「0.5秒以上続いたら無音」とみなします。</p>

    <button onclick="generateSilenceCmd()" class="md-button md-button--primary md-field-block">
      ffmpeg コマンド生成
    </button>

    <lht-command-block command-id="silenceCmd"></lht-command-block>

    <div id="toast" class="md-snackbar md-hidden">
      コピーしました
    </div>
  </div>

    <script src="../../lht-cmn/vendor/material-web-outlined-text-field.bundle.js"></script>
  <script src="../../lht-cmn/js/components.js" defer></script>
  <script src="src/ffmpeg-silence-detect-gen/js/main.js"></script>

</body>
</html>
