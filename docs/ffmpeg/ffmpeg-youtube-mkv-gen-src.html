<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FFmpeg YouTube動画生成コマンドジェネレータ</title>
    <link rel="stylesheet" href="../../lht-cmn/css/components.css" />
  <link rel="stylesheet" href="src/ffmpeg-youtube-mkv-gen/css/app.css" />

</head>
<body class="md-page">
  <svg aria-hidden="true" class="md-icon-sprite" width="0" height="0" viewBox="0 0 0 0" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <symbol id="md-icon-menu" viewBox="0 0 24 24">
        <path d="M4 6h16"/>
        <path d="M4 12h16"/>
        <path d="M4 18h16"/>
      </symbol>
      <symbol id="md-icon-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2"/>
        <rect x="4" y="4" width="11" height="11" rx="2"/>
      </symbol>
      <symbol id="md-icon-refresh" viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"/>
        <path d="M20 4v6h-6"/>
      </symbol>
    </defs>
  </svg>
  <div class="md-shell md-card">
    <lht-page-menu home-href="../index.html" home-label="トップへ戻る"></lht-page-menu>
<h1 class="md-headline"><span aria-hidden="true" class="md-headline__icon">📺</span>FFmpeg 動画生成コマンドジェネレータ</h1>
    <p id="modeLead" class="md-subtitle md-field-block">YouTube向けプリセットと一般動画向けプリセットを切り替えて、静止画 + 音声から動画を作る ffmpeg コマンドを生成します。</p>

    <fieldset class="md-mode-fieldset md-field-block">
      <legend class="md-mode-legend">出力モード</legend>
      <label class="md-mode-option">
        <input type="radio" name="videoMode" id="videoModeYoutube" value="youtube" checked />
        <span>YouTube向け</span>
      </label>
      <label class="md-mode-option">
        <input type="radio" name="videoMode" id="videoModeGeneral" value="general" />
        <span>一般動画</span>
      </label>
    </fieldset>

    <lht-text-field-help
      field-id="audioFile"
      label="音声ファイル（.wav）"
      required
      placeholder="例: 250503_TrMic-part1.wav"
      field-class="md-field-block"
      help-text="例: 250503_TrMic-part1.wav"
    ></lht-text-field-help>

    <lht-text-field-help
      field-id="imageFile"
      label="画像ファイル（.png, .jpg, .jpeg）"
      required
      placeholder="例: Borodin.png"
      field-class="md-field-block"
      help-text="例: Borodin.png"
    ></lht-text-field-help>

    <lht-command-block command-id="youtubeCmd"></lht-command-block>

    <div id="toast" class="md-snackbar md-hidden">
      コピーしました
    </div>
  </div>

    <script src="../../lht-cmn/vendor/material-web-outlined-text-field.bundle.js"></script>
  <script src="../../lht-cmn/js/components.js" defer></script>
  <script src="src/ffmpeg-youtube-mkv-gen/js/main.js"></script>

</body>
</html>
