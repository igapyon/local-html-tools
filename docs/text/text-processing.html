<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>テキスト加工</title>
<style>
    :root {
      --md-sys-color-primary: #6200ee;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-surface: #ffffff;
      --md-sys-color-surface-variant: #f4f1f7;
      --md-sys-color-background: #f6f4f8;
      --md-sys-color-on-surface: #1c1b1f;
      --md-sys-color-on-surface-variant: #49454f;
      --md-sys-color-outline: #c8c5d0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: "Roboto", "Segoe UI", "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 1rem; line-height: 1.5; }
    button { border: none; background: transparent; cursor: pointer; font: inherit; }
    textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    a { text-decoration: none; color: inherit; }

    .md-page { background-color: var(--md-sys-color-background); color: var(--md-sys-color-on-surface); padding: 24px; }
    .md-shell { max-width: 48rem; margin: 0 auto; }
    .md-card {
      background: var(--md-sys-color-surface);
      border-radius: 16px;
      border: 1px solid #ece7f3;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
      padding: 24px;
      position: relative;
    }

    .md-menu-button { position: absolute; top: 16px; right: 16px; }
    .md-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f0edf5;
      color: #3f3b46;
      transition: background 150ms ease, box-shadow 150ms ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }
    .md-icon-btn:hover { background: #e6e1ee; }
    .md-icon-20 { width: 20px; height: 20px; }

    .md-menu-panel {
      position: absolute;
      top: 56px;
      right: 16px;
      background: var(--md-sys-color-surface);
      border: 1px solid #e6e1ee;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 4px 0;
      min-width: 160px;
      z-index: 10;
    }
    .md-menu-link { display: block; padding: 8px 16px; color: var(--md-sys-color-on-surface); }
    .md-menu-link:hover { background: #f2edf8; }

    .md-headline {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .md-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      color: #3f3b46;
      margin-bottom: 0.5rem;
    }

    .md-textarea {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--md-sys-color-outline);
      background: var(--md-sys-color-surface);
      padding: 0.75rem;
      font-size: 0.95rem;
      color: var(--md-sys-color-on-surface);
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .md-textarea:focus {
      outline: none;
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 0 3px rgba(98, 0, 238, 0.2);
    }
    .md-input-block { margin-bottom: 1rem; }

    .md-section { margin-bottom: 1.5rem; }
    .md-section-title { font-weight: 600; color: #3f3b46; margin-bottom: 0.5rem; }
    .md-section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .md-text-button {
      background: rgba(98, 0, 238, 0.12);
      color: var(--md-sys-color-primary);
      border-radius: 999px;
      padding: 0.25rem 0.85rem;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 150ms ease, color 150ms ease;
    }
    .md-text-button:hover {
      background: rgba(98, 0, 238, 0.2);
    }
    .md-text-button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(98, 0, 238, 0.3);
    }

    .md-option-card {
      border: 1px solid #e5e0ec;
      border-radius: 14px;
      background: var(--md-sys-color-surface-variant);
      padding: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .md-check-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #3f3b46;
    }
    .md-checkbox { accent-color: var(--md-sys-color-primary); }
    .md-toggle {
      justify-content: space-between;
      gap: 0.75rem;
    }
    .md-toggle-text { flex: 1; }
    .md-toggle-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .md-toggle-track {
      width: 44px;
      height: 24px;
      background: #f0ebf7;
      border-radius: 9999px;
      position: relative;
      box-shadow: inset 0 0 0 1px #cfc7dc;
      transition: background 150ms ease, box-shadow 150ms ease;
      flex-shrink: 0;
    }
    .md-toggle-track::after {
      content: "";
      width: 20px;
      height: 20px;
      border-radius: 9999px;
      background: #ffffff;
      position: absolute;
      top: 2px;
      left: 2px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      transition: transform 150ms ease, background 150ms ease;
    }
    .md-toggle-input:checked + .md-toggle-track {
      background: rgba(98, 0, 238, 0.32);
      box-shadow: inset 0 0 0 1px rgba(98, 0, 238, 0.6);
    }
    .md-toggle-input:checked + .md-toggle-track::after {
      transform: translateX(20px);
      background: var(--md-sys-color-primary);
    }

    .md-subpanel {
      margin-top: 0.5rem;
      padding-left: 1rem;
      display: grid;
      gap: 0.5rem;
    }

    .md-accordion {
      border: 1px solid #e5e0ec;
      border-radius: 14px;
      background: var(--md-sys-color-surface);
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.75rem;
    }
    .md-accordion summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      color: #3f3b46;
      padding: 0.35rem 0;
    }
    .md-accordion summary::-webkit-details-marker { display: none; }
    .md-accordion summary::after {
      content: "▾";
      font-size: 0.9rem;
      color: #6a6675;
      transition: transform 150ms ease;
    }
    .md-accordion[open] summary::after { transform: rotate(180deg); }
    .md-sub-label { font-size: 0.85rem; color: #3f3b46; }
    .md-select {
      border-radius: 10px;
      border: 1px solid var(--md-sys-color-outline);
      padding: 0.35rem 0.5rem;
      background: var(--md-sys-color-surface);
      font-size: 0.85rem;
    }

    .md-output-wrap { position: relative; }
    .md-output { background: var(--md-sys-color-surface-variant); }
    .md-copy-button { position: absolute; top: 0.5rem; right: 0.5rem; }

    .md-muted { color: #6a6675; font-size: 0.85rem; margin-top: 0.5rem; }

    .md-snackbar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2b2831;
      color: #f7f4fb;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
    }
    .md-snackbar--visible { opacity: 1; pointer-events: auto; }

    .md-tooltip-group { position: relative; display: inline-flex; align-items: center; }
    .md-help-chip {
      width: 22px;
      height: 22px;
      border-radius: 9999px;
      background: #f0edf5;
      color: #4a4458;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .md-tooltip-content {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 0.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease;
      z-index: 50;
    }
    .md-tooltip-group:hover .md-tooltip-content { opacity: 1; }
    .md-tooltip {
      background: #2b2831;
      color: #f7f4fb;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.8125rem;
      line-height: 1.5;
      min-width: 12rem;
      width: min(24rem, 90vw);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hidden { display: none; }

    .mb-2 { margin-bottom: 0.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mt-2 { margin-top: 0.5rem; }
    .pl-4 { padding-left: 1rem; }
    .text-sm { font-size: 0.875rem; }
    .text-xs { font-size: 0.75rem; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }
  </style>
</head>
<body class="md-page">
<div class="md-shell md-card">
<button aria-label="メニュー" class="md-icon-btn md-menu-button" onclick="toggleMenu()" type="button">
<svg aria-hidden="true" class="md-icon-20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M4 6h16"></path>
<path d="M4 12h16"></path>
<path d="M4 18h16"></path>
</svg>
</button>
<div class="md-menu-panel hidden" id="menuPanel">
<a class="md-menu-link" href="../index.html">トップへ戻る</a>
</div>
<h1 class="md-headline">
<span aria-hidden="true">🧩</span>
<span>テキスト加工</span>
<span class="md-tooltip-group">
<span class="md-help-chip">?</span>
<span class="md-tooltip-content md-tooltip">
          テキストを即時に変換・整形するためのツールです。入力内容に対して選択した変換オプションが順番に適用され、結果が出力欄に反映されます。文字の変換・行の変換・空白の変換を組み合わせて使えます。
        </span>
</span>
</h1>
<label class="md-label">
      入力テキスト:
      <span class="md-tooltip-group">
<span class="md-help-chip">?</span>
<span class="md-tooltip-content md-tooltip">
          ここに入力したテキストが変換対象になります。
        </span>
</span>
</label>
<textarea class="md-textarea md-input-block" id="inputText" placeholder="加工したいテキストを入力してください" rows="8"></textarea>
<div class="md-section">
<div class="md-section-title md-section-title-row">
<div>
          変換オプション:
          <span class="md-tooltip-group">
<span class="md-help-chip">?</span>
<span class="md-tooltip-content md-tooltip">
            変換オプション: チェックや選択した内容が出力に反映されます。複数の変換を同時に適用できます。
            変換の順序: 行末 → 全角/半角 → 記号 → ひら/カタ → 大文字/小文字 → 行の並び → 空行除去 → 改行→空白 → トリム → 空白正規化
          </span>
</span>
</div>
<button class="md-text-button" onclick="applyCommonPreset()" type="button">よくある</button>
</div>
<details class="md-accordion">
<summary>文字の変換</summary>
<div class="md-subpanel" id="charConvertPanel">
<label class="md-sub-label">全角/半角:
          <select class="md-select" id="optWidth">
<option value="none">変換しない</option>
<option value="toHalf">半角に変換</option>
<option value="toFull">全角に変換</option>
</select>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">仮名を含める</span>
<input class="md-toggle-input" id="optIncludeKana" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-sub-label">ひらがな/カタカナ:
          <select class="md-select" id="optKana">
<option value="none">変換しない</option>
<option value="toKata">ひらがな → カタカナ</option>
<option value="toHira">カタカナ → ひらがな</option>
</select>
</label>
<label class="md-sub-label">大文字/小文字（英字）:
          <select class="md-select" id="optCase">
<option value="none">変換しない</option>
<option value="upper">大文字に変換</option>
<option value="lower">小文字に変換</option>
</select>
</label>
</div>
</details>
<details class="md-accordion">
<summary>記号を変換</summary>
<div class="md-subpanel" id="symbolConvertPanel">
<label class="md-check-row md-toggle">
<span class="md-toggle-text">すべて切り替え</span>
<input class="md-toggle-input" id="optSymbolAll" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">セミコロン（； → ;）</span>
<input class="md-toggle-input" id="optSymbolSemicolon" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">コロン（： → :）</span>
<input class="md-toggle-input" id="optSymbolColon" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">クオート（＇ → '）</span>
<input class="md-toggle-input" id="optSymbolSingleQuote" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">ダブルクオート（＂ → "）</span>
<input class="md-toggle-input" id="optSymbolDoubleQuote" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">バッククオート（｀ → `）</span>
<input class="md-toggle-input" id="optSymbolBackQuote" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">丸括弧（（ ） → ( )）</span>
<input class="md-toggle-input" id="optSymbolParentheses" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">感嘆符（！ → !）</span>
<input class="md-toggle-input" id="optSymbolExclamation" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">ドル（＄ → $）</span>
<input class="md-toggle-input" id="optSymbolDollar" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">クエスチョン（？ → ?）</span>
<input class="md-toggle-input" id="optSymbolQuestion" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">アンパサンド（＆ → &amp;）</span>
<input class="md-toggle-input" id="optSymbolAmpersand" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">アットマーク（＠ → @）</span>
<input class="md-toggle-input" id="optSymbolAt" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">シャープ（＃ → #）</span>
<input class="md-toggle-input" id="optSymbolHash" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">パーセント（％ → %）</span>
<input class="md-toggle-input" id="optSymbolPercent" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">プラス（＋ → +）</span>
<input class="md-toggle-input" id="optSymbolPlus" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">イコール（＝ → =）</span>
<input class="md-toggle-input" id="optSymbolEquals" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">スラッシュ（／ → /）</span>
<input class="md-toggle-input" id="optSymbolSlash" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">バックスラッシュ（＼ → \\）</span>
<input class="md-toggle-input" id="optSymbolBackslash" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">ハイフン（－ → -）</span>
<input class="md-toggle-input" id="optSymbolHyphen" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">アンダースコア（＿ → _）</span>
<input class="md-toggle-input" id="optSymbolUnderscore" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">カンマ（， → ,）</span>
<input class="md-toggle-input" id="optSymbolComma" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">ピリオド（． → .）</span>
<input class="md-toggle-input" id="optSymbolPeriod" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">キャレット（＾ → ^）</span>
<input class="md-toggle-input" id="optSymbolCaret" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">パイプ（｜ → |）</span>
<input class="md-toggle-input" id="optSymbolPipe" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">不等号（＜ ＞ → &lt; &gt;）</span>
<input class="md-toggle-input" id="optSymbolAngle" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">波括弧（｛ ｝ → { }）</span>
<input class="md-toggle-input" id="optSymbolBrace" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">角括弧（［ ］ → [ ]）</span>
<input class="md-toggle-input" id="optSymbolBracket" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">チルダ（～ → ~）</span>
<input class="md-toggle-input" id="optSymbolTilde" type="checkbox">
<span class="md-toggle-track"></span>
</label>
</div>
</details>
<details class="md-accordion">
<summary>行の変換</summary>
<div class="md-subpanel" id="lineConvertPanel">
<label class="md-sub-label">行末:
          <select class="md-select" id="optLineEnding">
<option value="keep">維持</option>
<option value="lf">LF に統一</option>
<option value="crlf">CRLF に統一</option>
</select>
</label>
<label class="md-sub-label">行の並び:
          <select class="md-select" id="optSortLines">
<option value="none">並び替えしない</option>
<option value="asc">昇順</option>
<option value="desc">降順</option>
</select>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">空行を除去</span>
<input class="md-toggle-input" id="optRemoveEmptyLines" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">連続する空行を1行に</span>
<input class="md-toggle-input" id="optCollapseEmptyLines" type="checkbox">
<span class="md-toggle-track"></span>
</label>
</div>
</details>
<details class="md-accordion">
<summary>空白の変換</summary>
<div class="md-subpanel" id="spaceConvertPanel">
<label class="md-check-row md-toggle">
<span class="md-toggle-text">全角/特殊空白を半角空白に変換</span>
<input class="md-toggle-input" id="optNormalizeUnicodeSpaces" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">サイズのない空白を除去</span>
<input class="md-toggle-input" id="optRemoveZeroWidthSpaces" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">句読点/記号（。、？！）の直前の半角空白を除去</span>
<input class="md-toggle-input" id="optRemoveSpaceBeforePunct" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">前後の空白をトリム</span>
<input class="md-toggle-input" id="optTrim" type="checkbox">
<span class="md-toggle-track"></span>
</label>
<label class="md-check-row md-toggle">
<span class="md-toggle-text">連続する空白・タブを1つにする</span>

<script>
    const halfToFullKanaMap = {
      '｡': '。', '｢': '「', '｣': '」', '､': '、', '･': '・',
      'ｧ': 'ァ', 'ｨ': 'ィ', 'ｩ': 'ゥ', 'ｪ': 'ェ', 'ｫ': 'ォ',
      'ｬ': 'ャ', 'ｭ': 'ュ', 'ｮ': 'ョ', 'ｯ': 'ッ', 'ｰ': 'ー',
      'ｱ': 'ア', 'ｲ': 'イ', 'ｳ': 'ウ', 'ｴ': 'エ', 'ｵ': 'オ',
      'ｶ': 'カ', 'ｷ': 'キ', 'ｸ': 'ク', 'ｹ': 'ケ', 'ｺ': 'コ',
      'ｻ': 'サ', 'ｼ': 'シ', 'ｽ': 'ス', 'ｾ': 'セ', 'ｿ': 'ソ',
      'ﾀ': 'タ', 'ﾁ': 'チ', 'ﾂ': 'ツ', 'ﾃ': 'テ', 'ﾄ': 'ト',
      'ﾅ': 'ナ', 'ﾆ': 'ニ', 'ﾇ': 'ヌ', 'ﾈ': 'ネ', 'ﾉ': 'ノ',
      'ﾊ': 'ハ', 'ﾋ': 'ヒ', 'ﾌ': 'フ', 'ﾍ': 'ヘ', 'ﾎ': 'ホ',
      'ﾏ': 'マ', 'ﾐ': 'ミ', 'ﾑ': 'ム', 'ﾒ': 'メ', 'ﾓ': 'モ',
      'ﾔ': 'ヤ', 'ﾕ': 'ユ', 'ﾖ': 'ヨ',
      'ﾗ': 'ラ', 'ﾘ': 'リ', 'ﾙ': 'ル', 'ﾚ': 'レ', 'ﾛ': 'ロ',
      'ﾜ': 'ワ', 'ｦ': 'ヲ', 'ﾝ': 'ン',
      'ﾞ': '゛', 'ﾟ': '゜'
    };
    const halfVoicedMap = {
      'ｶﾞ': 'ガ', 'ｷﾞ': 'ギ', 'ｸﾞ': 'グ', 'ｹﾞ': 'ゲ', 'ｺﾞ': 'ゴ',
      'ｻﾞ': 'ザ', 'ｼﾞ': 'ジ', 'ｽﾞ': 'ズ', 'ｾﾞ': 'ゼ', 'ｿﾞ': 'ゾ',
      'ﾀﾞ': 'ダ', 'ﾁﾞ': 'ヂ', 'ﾂﾞ': 'ヅ', 'ﾃﾞ': 'デ', 'ﾄﾞ': 'ド',
      'ﾊﾞ': 'バ', 'ﾋﾞ': 'ビ', 'ﾌﾞ': 'ブ', 'ﾍﾞ': 'ベ', 'ﾎﾞ': 'ボ',
      'ｳﾞ': 'ヴ'
    };
    const halfSemiVoicedMap = {
      'ﾊﾟ': 'パ', 'ﾋﾟ': 'ピ', 'ﾌﾟ': 'プ', 'ﾍﾟ': 'ペ', 'ﾎﾟ': 'ポ'
    };
    const fullToHalfKanaMap = {
      '。': '｡', '「': '｢', '」': '｣', '、': '､', '・': '･',
      'ァ': 'ｧ', 'ィ': 'ｨ', 'ゥ': 'ｩ', 'ェ': 'ｪ', 'ォ': 'ｫ',
      'ャ': 'ｬ', 'ュ': 'ｭ', 'ョ': 'ｮ', 'ッ': 'ｯ', 'ー': 'ｰ',
      'ア': 'ｱ', 'イ': 'ｲ', 'ウ': 'ｳ', 'エ': 'ｴ', 'オ': 'ｵ',
      'カ': 'ｶ', 'キ': 'ｷ', 'ク': 'ｸ', 'ケ': 'ｹ', 'コ': 'ｺ',
      'サ': 'ｻ', 'シ': 'ｼ', 'ス': 'ｽ', 'セ': 'ｾ', 'ソ': 'ｿ',
      'タ': 'ﾀ', 'チ': 'ﾁ', 'ツ': 'ﾂ', 'テ': 'ﾃ', 'ト': 'ﾄ',
      'ナ': 'ﾅ', 'ニ': 'ﾆ', 'ヌ': 'ﾇ', 'ネ': 'ﾈ', 'ノ': 'ﾉ',
      'ハ': 'ﾊ', 'ヒ': 'ﾋ', 'フ': 'ﾌ', 'ヘ': 'ﾍ', 'ホ': 'ﾎ',
      'マ': 'ﾏ', 'ミ': 'ﾐ', 'ム': 'ﾑ', 'メ': 'ﾒ', 'モ': 'ﾓ',
      'ヤ': 'ﾔ', 'ユ': 'ﾕ', 'ヨ': 'ﾖ',
      'ラ': 'ﾗ', 'リ': 'ﾘ', 'ル': 'ﾙ', 'レ': 'ﾚ', 'ロ': 'ﾛ',
      'ワ': 'ﾜ', 'ヲ': 'ｦ', 'ン': 'ﾝ',
      '゛': 'ﾞ', '゜': 'ﾟ'
    };
    const fullToHalfVoicedMap = {
      'ガ': 'ｶﾞ', 'ギ': 'ｷﾞ', 'グ': 'ｸﾞ', 'ゲ': 'ｹﾞ', 'ゴ': 'ｺﾞ',
      'ザ': 'ｻﾞ', 'ジ': 'ｼﾞ', 'ズ': 'ｽﾞ', 'ゼ': 'ｾﾞ', 'ゾ': 'ｿﾞ',
      'ダ': 'ﾀﾞ', 'ヂ': 'ﾁﾞ', 'ヅ': 'ﾂﾞ', 'デ': 'ﾃﾞ', 'ド': 'ﾄﾞ',
      'バ': 'ﾊﾞ', 'ビ': 'ﾋﾞ', 'ブ': 'ﾌﾞ', 'ベ': 'ﾍﾞ', 'ボ': 'ﾎﾞ',
      'ヴ': 'ｳﾞ'
    };
    const fullToHalfSemiVoicedMap = {
      'パ': 'ﾊﾟ', 'ピ': 'ﾋﾟ', 'プ': 'ﾌﾟ', 'ペ': 'ﾍﾟ', 'ポ': 'ﾎﾟ'
    };

    function detectPreferredNewline(text) {
      if (/\r\n/.test(text)) return "\r\n";
      if (/\r/.test(text)) return "\r";
      return "\n";
    }

    function normalizeLineEnding(text, mode) {
      if (mode === "keep") return text;
      const normalized = text.replace(/\r\n|\r/g, "\n");
      if (mode === "lf") return normalized;
      if (mode === "crlf") return normalized.replace(/\n/g, "\r\n");
      return text;
    }

    function convertHalfToFull(text, includeKana) {
      let result = "";
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];
        if (includeKana && next && (next === 'ﾞ' || next === 'ﾟ')) {
          const combined = char + next;
          if (halfVoicedMap[combined]) {
            result += halfVoicedMap[combined];
            i++;
            continue;
          }
          if (halfSemiVoicedMap[combined]) {
            result += halfSemiVoicedMap[combined];
            i++;
            continue;
          }
        }
        const code = char.charCodeAt(0);
        if (char === " ") {
          result += "　";
        } else if (code >= 0x21 && code <= 0x7e) {
          result += String.fromCharCode(code + 0xfee0);
        } else if (includeKana && halfToFullKanaMap[char]) {
          result += halfToFullKanaMap[char];
        } else {
          result += char;
        }
      }
      return result;
    }

    function convertFullToHalf(text, includeKana) {
      let result = "";
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const code = char.charCodeAt(0);
        if (char === "　") {
          result += " ";
        } else if (code >= 0xff01 && code <= 0xff5e) {
          result += String.fromCharCode(code - 0xfee0);
        } else if (includeKana && fullToHalfVoicedMap[char]) {
          result += fullToHalfVoicedMap[char];
        } else if (includeKana && fullToHalfSemiVoicedMap[char]) {
          result += fullToHalfSemiVoicedMap[char];
        } else if (includeKana && fullToHalfKanaMap[char]) {
          result += fullToHalfKanaMap[char];
        } else {
          result += char;
        }
      }
      return result;
    }

    function convertHiraganaToKatakana(text) {
      return text.replace(/[\u3041-\u3096]/g, (char) =>
        String.fromCharCode(char.charCodeAt(0) + 0x60)
      );
    }

    function convertKatakanaToHiragana(text) {
      return text.replace(/[\u30a1-\u30f6]/g, (char) =>
        String.fromCharCode(char.charCodeAt(0) - 0x60)
      );
    }

    function convertFullWidthSymbolsToHalf(text, options) {
      let result = text;
      if (options.semicolon) {
        result = result.replace(/；/g, ";");
      }
      if (options.colon) {
        result = result.replace(/：/g, ":");
      }
      if (options.singleQuote) {
        result = result.replace(/＇/g, "'");
      }
      if (options.doubleQuote) {
        result = result.replace(/＂/g, "\"");
      }
      if (options.backQuote) {
        result = result.replace(/｀/g, "`");
      }
      if (options.parentheses) {
        result = result.replace(/（/g, "(").replace(/）/g, ")");
      }
      if (options.exclamation) {
        result = result.replace(/！/g, "!");
      }
      if (options.dollar) {
        result = result.replace(/＄/g, "$");
      }
      if (options.question) {
        result = result.replace(/？/g, "?");
      }
      if (options.ampersand) {
        result = result.replace(/＆/g, "&");
      }
      if (options.at) {
        result = result.replace(/＠/g, "@");
      }
      if (options.hash) {
        result = result.replace(/＃/g, "#");
      }
      if (options.percent) {
        result = result.replace(/％/g, "%");
      }
      if (options.plus) {
        result = result.replace(/＋/g, "+");
      }
      if (options.equals) {
        result = result.replace(/＝/g, "=");
      }
      if (options.slash) {
        result = result.replace(/／/g, "/");
      }
      if (options.backslash) {
        result = result.replace(/＼/g, "\\");
      }
      if (options.hyphen) {
        result = result.replace(/－/g, "-");
      }
      if (options.underscore) {
        result = result.replace(/＿/g, "_");
      }
      if (options.comma) {
        result = result.replace(/，/g, ",");
      }
      if (options.period) {
        result = result.replace(/．/g, ".");
      }
      if (options.caret) {
        result = result.replace(/＾/g, "^");
      }
      if (options.pipe) {
        result = result.replace(/｜/g, "|");
      }
      if (options.angle) {
        result = result.replace(/＜/g, "<").replace(/＞/g, ">");
      }
      if (options.brace) {
        result = result.replace(/｛/g, "{").replace(/｝/g, "}");
      }
      if (options.bracket) {
        result = result.replace(/［/g, "[").replace(/］/g, "]");
      }
      if (options.tilde) {
        result = result.replace(/～/g, "~");
      }
      return result;
    }

    function normalizeUnicodeSpacesToHalf(text) {
      return text.replace(/[\u3000\u00A0\u1680\u180E\u2000-\u200A\u202F\u205F]/g, " ");
    }

    function removeZeroWidthSpaces(text) {
      return text.replace(/[\u200B\u200C\u200D\u2060\uFEFF]/g, "");
    }

    function removeHalfSpaceBeforeJapanesePunctuation(text) {
      return text.replace(/ ([\u3002\u3001！？\?！])/g, "$1");
    }

    function sortLines(text, direction, preferredNewline) {
      if (direction === "none") return text;
      const lines = text.split(/\r\n|\r|\n/);
      const sorted = lines.sort((a, b) => a.localeCompare(b, "ja"));
      if (direction === "desc") sorted.reverse();
      return sorted.join(preferredNewline);
    }

    function autoResizeOutput() {
      const textarea = document.getElementById('outputText');
      if (!textarea) return;
      const maxLines = 100;
      const lineHeight = parseFloat(getComputedStyle(textarea).lineHeight) || 18;
      const maxHeight = lineHeight * maxLines + 24;
      textarea.style.height = 'auto';
      const nextHeight = Math.min(textarea.scrollHeight, maxHeight);
      textarea.style.height = `${nextHeight}px`;
    }

    function updateOutput() {
      const input = document.getElementById('inputText').value;
      const optWidth = document.getElementById('optWidth').value;
      const optIncludeKana = document.getElementById('optIncludeKana').checked;
      const optKana = document.getElementById('optKana').value;
      const optCase = document.getElementById('optCase').value;
      const optSymbolSemicolon = document.getElementById('optSymbolSemicolon').checked;
      const optSymbolColon = document.getElementById('optSymbolColon').checked;
      const optSymbolSingleQuote = document.getElementById('optSymbolSingleQuote').checked;
      const optSymbolDoubleQuote = document.getElementById('optSymbolDoubleQuote').checked;
      const optSymbolBackQuote = document.getElementById('optSymbolBackQuote').checked;
      const optSymbolParentheses = document.getElementById('optSymbolParentheses').checked;
      const optSymbolExclamation = document.getElementById('optSymbolExclamation').checked;
      const optSymbolDollar = document.getElementById('optSymbolDollar').checked;
      const optSymbolQuestion = document.getElementById('optSymbolQuestion').checked;
      const optSymbolAmpersand = document.getElementById('optSymbolAmpersand').checked;
      const optSymbolAt = document.getElementById('optSymbolAt').checked;
      const optSymbolHash = document.getElementById('optSymbolHash').checked;
      const optSymbolPercent = document.getElementById('optSymbolPercent').checked;
      const optSymbolPlus = document.getElementById('optSymbolPlus').checked;
      const optSymbolEquals = document.getElementById('optSymbolEquals').checked;
      const optSymbolSlash = document.getElementById('optSymbolSlash').checked;
      const optSymbolBackslash = document.getElementById('optSymbolBackslash').checked;
      const optSymbolHyphen = document.getElementById('optSymbolHyphen').checked;
      const optSymbolUnderscore = document.getElementById('optSymbolUnderscore').checked;
      const optSymbolComma = document.getElementById('optSymbolComma').checked;
      const optSymbolPeriod = document.getElementById('optSymbolPeriod').checked;
      const optSymbolCaret = document.getElementById('optSymbolCaret').checked;
      const optSymbolPipe = document.getElementById('optSymbolPipe').checked;
      const optSymbolAngle = document.getElementById('optSymbolAngle').checked;
      const optSymbolBrace = document.getElementById('optSymbolBrace').checked;
      const optSymbolBracket = document.getElementById('optSymbolBracket').checked;
      const optSymbolTilde = document.getElementById('optSymbolTilde').checked;
      const optSymbolConvert = [
        optSymbolSemicolon, optSymbolColon, optSymbolSingleQuote, optSymbolDoubleQuote,
        optSymbolBackQuote, optSymbolParentheses, optSymbolExclamation, optSymbolDollar,
        optSymbolQuestion, optSymbolAmpersand, optSymbolAt, optSymbolHash,
        optSymbolPercent, optSymbolPlus, optSymbolEquals, optSymbolSlash,
        optSymbolBackslash, optSymbolHyphen, optSymbolUnderscore, optSymbolComma,
        optSymbolPeriod, optSymbolCaret, optSymbolPipe, optSymbolAngle,
        optSymbolBrace, optSymbolBracket, optSymbolTilde
      ].some(Boolean);
      const optLineEnding = document.getElementById('optLineEnding').value;
      const optSortLines = document.getElementById('optSortLines').value;
      const optRemoveEmptyLines = document.getElementById('optRemoveEmptyLines').checked;
      const optCollapseEmptyLines = document.getElementById('optCollapseEmptyLines').checked;
      const optNewlineToSpace = document.getElementById('optNewlineToSpace').checked;
      const optNormalizeUnicodeSpaces = document.getElementById('optNormalizeUnicodeSpaces').checked;
      const optRemoveZeroWidthSpaces = document.getElementById('optRemoveZeroWidthSpaces').checked;
      const optRemoveSpaceBeforePunct = document.getElementById('optRemoveSpaceBeforePunct').checked;
      const optTrim = document.getElementById('optTrim').checked;
      const optNormalizeSpaces = document.getElementById('optNormalizeSpaces').checked;

      let text = input;
      const preferredNewline = optLineEnding === "keep" ? detectPreferredNewline(text) : (optLineEnding === "crlf" ? "\r\n" : "\n");
      text = normalizeLineEnding(text, optLineEnding);

      if (optWidth === "toHalf") {
        text = convertFullToHalf(text, optIncludeKana);
      } else if (optWidth === "toFull") {
        text = convertHalfToFull(text, optIncludeKana);
      }

      if (optSymbolConvert) {
        text = convertFullWidthSymbolsToHalf(text, {
          semicolon: optSymbolSemicolon,
          colon: optSymbolColon,
          singleQuote: optSymbolSingleQuote,
          doubleQuote: optSymbolDoubleQuote,
          backQuote: optSymbolBackQuote,
          parentheses: optSymbolParentheses,
          exclamation: optSymbolExclamation,
          dollar: optSymbolDollar,
          question: optSymbolQuestion,
          ampersand: optSymbolAmpersand,
          at: optSymbolAt,
          hash: optSymbolHash,
          percent: optSymbolPercent,
          plus: optSymbolPlus,
          equals: optSymbolEquals,
          slash: optSymbolSlash,
          backslash: optSymbolBackslash,
          hyphen: optSymbolHyphen,
          underscore: optSymbolUnderscore,
          comma: optSymbolComma,
          period: optSymbolPeriod,
          caret: optSymbolCaret,
          pipe: optSymbolPipe,
          angle: optSymbolAngle,
          brace: optSymbolBrace,
          bracket: optSymbolBracket,
          tilde: optSymbolTilde
        });
      }

      if (optKana === "toKata") {
        text = convertHiraganaToKatakana(text);
      } else if (optKana === "toHira") {
        text = convertKatakanaToHiragana(text);
      }

      if (optCase === "upper") {
        text = text.toUpperCase();
      } else if (optCase === "lower") {
        text = text.toLowerCase();
      }

      text = sortLines(text, optSortLines, preferredNewline);

      if (optCollapseEmptyLines) {
        const lines = text.split(/\r\n|\r|\n/);
        const collapsed = [];
        let prevEmpty = false;
        lines.forEach((line) => {
          const isEmpty = line.trim() === "";
          if (isEmpty) {
            if (!prevEmpty) collapsed.push("");
            prevEmpty = true;
          } else {
            collapsed.push(line);
            prevEmpty = false;
          }
        });
        text = collapsed.join(preferredNewline);
      }

      if (optRemoveEmptyLines) {
        const lineSep = optNewlineToSpace ? "\n" : preferredNewline;
        const lines = text.split(/\r\n|\r|\n/).filter((line) => line.trim() !== "");
        text = lines.join(lineSep);
      }

      if (optNewlineToSpace) {
        text = text.replace(/\r\n|\r|\n/g, " ");
      }

      if (optNormalizeUnicodeSpaces) {
        text = normalizeUnicodeSpacesToHalf(text);
      }

      if (optRemoveZeroWidthSpaces) {
        text = removeZeroWidthSpaces(text);
      }

      if (optRemoveSpaceBeforePunct) {
        text = removeHalfSpaceBeforeJapanesePunctuation(text);
      }

      if (optTrim) {
        text = text.trim();
      }

      if (optNormalizeSpaces) {
        text = text.replace(/[ \t]+/g, " ");
      }

      document.getElementById('outputText').value = text;
      autoResizeOutput();
      const lineCount = text ? text.split(/\r\n|\r|\n/).length : 0;
      document.getElementById('outputStats').textContent = `文字数: ${text.length} / 行数: ${lineCount}`;
    }

    function copyToClipboard(id) {
      const text = document.getElementById(id).value;
      if (!text) return;
      const temp = document.createElement('textarea');
      temp.value = text;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);
      showToast('コピーしました');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('md-snackbar--visible');
      setTimeout(() => {
        toast.classList.remove('md-snackbar--visible');
      }, 2000);
    }

    function toggleMenu() {
      const panel = document.getElementById('menuPanel');
      if (!panel) return;
      panel.classList.toggle('hidden');
    }

    function applyCommonPreset() {
      const setChecked = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.checked = value;
      };
      const setSelect = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.value = value;
      };

      setSelect('optWidth', 'toHalf');

      const symbolIds = [
        'optSymbolSemicolon', 'optSymbolColon', 'optSymbolSingleQuote',
        'optSymbolDoubleQuote', 'optSymbolBackQuote', 'optSymbolParentheses',
        'optSymbolExclamation', 'optSymbolDollar', 'optSymbolQuestion',
        'optSymbolAmpersand', 'optSymbolAt', 'optSymbolHash',
        'optSymbolPercent', 'optSymbolPlus', 'optSymbolEquals',
        'optSymbolSlash', 'optSymbolBackslash', 'optSymbolUnderscore',
        'optSymbolComma', 'optSymbolPeriod', 'optSymbolCaret',
        'optSymbolPipe', 'optSymbolAngle', 'optSymbolBrace',
        'optSymbolBracket', 'optSymbolTilde'
      ];
      symbolIds.forEach((id) => setChecked(id, true));
      setChecked('optSymbolHyphen', false);
      setChecked('optSymbolTilde', false);

      setChecked('optNormalizeUnicodeSpaces', true);
      setChecked('optRemoveZeroWidthSpaces', true);
      setChecked('optNewlineToSpace', false);
      setChecked('optRemoveSpaceBeforePunct', false);
      setChecked('optRemoveEmptyLines', false);
      setChecked('optCollapseEmptyLines', false);
      setChecked('optTrim', false);
      setChecked('optNormalizeSpaces', false);

      updateSymbolAllState();
      updateOutput();
    }

    function getSymbolOptionIds() {
      return [
        'optSymbolSemicolon', 'optSymbolColon', 'optSymbolSingleQuote',
        'optSymbolDoubleQuote', 'optSymbolBackQuote', 'optSymbolParentheses',
        'optSymbolExclamation', 'optSymbolDollar', 'optSymbolQuestion',
        'optSymbolAmpersand', 'optSymbolAt', 'optSymbolHash',
        'optSymbolPercent', 'optSymbolPlus', 'optSymbolEquals',
        'optSymbolSlash', 'optSymbolBackslash', 'optSymbolHyphen',
        'optSymbolUnderscore', 'optSymbolComma', 'optSymbolPeriod',
        'optSymbolCaret', 'optSymbolPipe', 'optSymbolAngle',
        'optSymbolBrace', 'optSymbolBracket', 'optSymbolTilde'
      ];
    }

    function updateSymbolAllState() {
      const allToggle = document.getElementById('optSymbolAll');
      if (!allToggle) return;
      const ids = getSymbolOptionIds();
      const elements = ids.map((id) => document.getElementById(id)).filter(Boolean);
      if (elements.length === 0) return;
      const allChecked = elements.every((el) => el.checked);
      allToggle.checked = allChecked;
      allToggle.indeterminate = !allChecked && elements.some((el) => el.checked);
    }

    function toggleAllSymbols(checked) {
      getSymbolOptionIds().forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.checked = checked;
      });
    }

    function setupAutoUpdate() {
      const ids = [
        'inputText', 'optWidth', 'optIncludeKana', 'optKana', 'optCase',
        'optSymbolAll', 'optSymbolSemicolon', 'optSymbolColon', 'optSymbolSingleQuote',
        'optSymbolDoubleQuote', 'optSymbolBackQuote', 'optSymbolParentheses',
        'optSymbolExclamation', 'optSymbolDollar', 'optSymbolQuestion', 'optSymbolAmpersand',
        'optSymbolAt', 'optSymbolHash', 'optSymbolPercent', 'optSymbolPlus',
        'optSymbolEquals', 'optSymbolSlash', 'optSymbolBackslash', 'optSymbolHyphen',
        'optSymbolUnderscore', 'optSymbolComma', 'optSymbolPeriod', 'optSymbolCaret',
        'optSymbolPipe', 'optSymbolAngle', 'optSymbolBrace', 'optSymbolBracket',
        'optSymbolTilde', 'optLineEnding', 'optSortLines', 'optNewlineToSpace',
        'optRemoveEmptyLines', 'optCollapseEmptyLines', 'optNormalizeUnicodeSpaces',
        'optRemoveZeroWidthSpaces', 'optRemoveSpaceBeforePunct', 'optTrim', 'optNormalizeSpaces'
      ];
      ids.forEach((id) => {
        const element = document.getElementById(id);
        if (!element) return;
        const eventName = element.tagName === 'SELECT' || element.type === 'checkbox' ? 'change' : 'input';
        element.addEventListener(eventName, updateOutput);
        if (element.tagName === 'SELECT' || element.type === 'checkbox') {
          element.addEventListener('input', updateOutput);
        }
      });
      updateOutput();
    }

    setupAutoUpdate();
    const optSymbolAll = document.getElementById('optSymbolAll');
    if (optSymbolAll) {
      optSymbolAll.addEventListener('change', () => {
        toggleAllSymbols(optSymbolAll.checked);
        updateSymbolAllState();
        updateOutput();
      });
    }
    getSymbolOptionIds().forEach((id) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('change', () => {
        updateSymbolAllState();
        updateOutput();
      });
    });
    updateSymbolAllState();
  </script>
</body>
</html>
