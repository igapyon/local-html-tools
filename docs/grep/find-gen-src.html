<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>find 検索コマンドジェネレータ</title>
  <link rel="stylesheet" href="../../lht-cmn/css/components.css" />
  <link rel="stylesheet" href="src/find-gen/css/app.css" />
  <script src="../git/src/vendor/material-web-outlined-text-field.bundle.js"></script>
  <script src="../../lht-cmn/js/components.js" defer></script>
</head>
<body class="md-page">
  <svg aria-hidden="true" class="md-icon-sprite" width="0" height="0" viewBox="0 0 0 0" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <symbol id="md-icon-menu" viewBox="0 0 24 24">
        <path d="M4 6h16"/>
        <path d="M4 12h16"/>
        <path d="M4 18h16"/>
      </symbol>
      <symbol id="md-icon-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2"/>
        <rect x="4" y="4" width="11" height="11" rx="2"/>
      </symbol>
      <symbol id="md-icon-refresh" viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"/>
        <path d="M20 4v6h-6"/>
      </symbol>
    </defs>
  </svg>

  <div class="md-surface-card md-card">
    <lht-page-menu home-href="../index.html" home-label="トップへ戻る"></lht-page-menu>

    <h1 class="md-headline">
      <span aria-hidden="true" class="md-headline__icon">🔎</span>
      <span>find 検索コマンドジェネレータ</span>
      <lht-help-tooltip label="find 検索コマンドジェネレータの説明" wide>
        findでファイル/ディレクトリを検索するコマンドを生成します。条件（名前/拡張子/サイズ/更新日時/内容検索）を組み合わせて作れます。
      </lht-help-tooltip>
    </h1>

    <div class="md-section md-stack-md">
      <div class="md-form-row md-form-row--nowrap">
        <lht-help-text-field field-id="basePath" label="検索開始パス" required placeholder="例: . / ~/projects" value="."></lht-help-text-field>
      </div>
      <div class="md-form-row md-form-row--nowrap">
        <md-outlined-select id="targetType" label="対象の種類" class="md-outlined-field" value="file">
          <md-select-option value="any"><div slot="headline">指定なし（ファイル/ディレクトリ）</div></md-select-option>
          <md-select-option value="file" selected><div slot="headline">ファイルのみ (-type f)</div></md-select-option>
          <md-select-option value="dir"><div slot="headline">ディレクトリのみ (-type d)</div></md-select-option>
        </md-outlined-select>
      </div>
    </div>

    <div class="md-section md-stack-md">
      <div class="md-form-row md-form-row--nowrap">
        <lht-help-text-field field-id="extension" label="拡張子" placeholder="例: txt / wav / jpg / java"></lht-help-text-field>
      </div>
      <div class="md-field">
        <div class="md-form-row md-form-row--nowrap">
          <lht-help-text-field field-id="namePattern" label="名前パターン（ワイルドカード可）" placeholder="例: report / *.log / data??.csv"></lht-help-text-field>
        </div>
        <lht-switch-help switch-id="caseInsensitive" label="大文字・小文字を区別しない (-iname)"></lht-switch-help>
      </div>
    </div>

    <details class="md-details md-section">
      <summary class="md-summary">詳細条件</summary>
      <div class="md-details-body md-stack-md">
        <label class="md-label">サイズ条件:</label>
        <div class="md-grid md-grid-3">
          <md-outlined-select id="sizeComparator" label="比較" class="md-outlined-field" value="min">
            <md-select-option value="min" selected><div slot="headline">以上 (&gt;=)</div></md-select-option>
            <md-select-option value="max"><div slot="headline">以下 (&lt;=)</div></md-select-option>
          </md-outlined-select>
          <lht-help-text-field field-id="sizeValue" type="number" label="サイズ" placeholder="例: 10"></lht-help-text-field>
          <md-outlined-select id="sizeUnit" label="単位" class="md-outlined-field" value="M">
            <md-select-option value="K"><div slot="headline">KB</div></md-select-option>
            <md-select-option value="M" selected><div slot="headline">MB</div></md-select-option>
            <md-select-option value="G"><div slot="headline">GB</div></md-select-option>
          </md-outlined-select>
        </div>

        <label class="md-label">更新日時条件:</label>
        <div class="md-grid md-grid-3">
          <md-outlined-select id="mtimeComparator" label="期間" class="md-outlined-field" value="within">
            <md-select-option value="within" selected><div slot="headline">直近N日以内</div></md-select-option>
            <md-select-option value="older"><div slot="headline">N日より前</div></md-select-option>
          </md-outlined-select>
          <lht-help-text-field field-id="mtimeValue" type="number" label="日数" placeholder="例: 7"></lht-help-text-field>
          <div class="md-label md-label--muted">日</div>
        </div>

        <label class="md-label">深さ条件:</label>
        <div class="md-grid md-grid-2">
          <lht-help-text-field field-id="minDepth" type="number" label="最小深さ" placeholder="mindepth"></lht-help-text-field>
          <lht-help-text-field field-id="maxDepth" type="number" label="最大深さ" placeholder="maxdepth"></lht-help-text-field>
        </div>
      </div>
    </details>

    <div class="md-section md-stack-sm">
      <div class="md-form-row md-form-row--nowrap">
        <lht-help-text-field field-id="contentPattern" label="内容検索" placeholder="例: ERROR / TODO / 404"></lht-help-text-field>
      </div>
      <lht-switch-help switch-id="useRipgrep" label="rg で検索（未チェックなら grep -E を使用）" checked></lht-switch-help>
    </div>

    <button type="button" onclick="generateFindCommand()" class="md-button md-button--primary">find コマンド生成</button>
    <lht-command-block command-id="findCmd"></lht-command-block>

    <div id="toast" class="md-snackbar-host md-snackbar">コピーしました</div>
  </div>

  <script src="src/find-gen/js/main.js"></script>
</body>
</html>
