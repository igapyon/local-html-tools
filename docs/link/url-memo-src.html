<body class="md-page">
  <div class="md-surface-card md-card">
    <lht-page-hero
      title="URLメモ"
      icon="🔗"
      help-label="URLメモの説明"
      help-wide
      menu-home-href="../index.html"
      menu-home-label="トップへ戻る">
      URL とメモをローカルで一覧管理し、検索起点で再利用しやすくするためのツールです。<br><br>
      タイトル、URL、メモ、キーワード、作成日、最終アクセス日を保持し、一覧から詳細を開いて編集や Import / Export を行えます。
    </lht-page-hero>

    <section class="md-section md-stack-md">
      <div class="md-panel-header">
        <lht-text-field-help
          field-id="searchInput"
          label="探したいもの"
          clearable
          placeholder="例: OpenAI / 仕様 / 記事"
          help-text="タイトル、キーワード、メモ、URL を対象に検索します。検索順位は prompt-gen に近い考え方で、タイトル一致を強く扱います。">
        </lht-text-field-help>
        <div class="md-panel-actions">
          <button id="openCreateDialogBtn" type="button" class="md-button md-button--primary">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="md-button__icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14"></path>
              <path d="M5 12h14"></path>
            </svg>
            <span>追加</span>
          </button>
          <button id="exportEntriesBtn" type="button" class="md-button md-button--surface">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="md-button__icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              <path d="m7 10 5 5 5-5"></path>
              <path d="M5 21h14"></path>
            </svg>
            <span>Export</span>

          <button id="importEntriesBtn" type="button" class="md-button md-button--surface">

              <path d="m7 14 5-5 5 5"></path>
              <path d="M5 3h14"></path>
            </svg>
            <span>Import</span>
          </button>
          <button id="clearEntriesBtn" type="button" class="md-button md-button--danger">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="md-button__icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        </div>

      <div id="entriesList" class="md-chip-row" aria-live="polite"></div>
    </section>

    <dialog id="entryDialog" class="md-dialog">
      <form method="dialog" class="md-dialog__surface" id="entryForm">
        <div class="md-dialog__header">
          <div>
            <h2 id="entryDialogTitle" class="md-dialog__title">URLメモを追加</h2>
            <p class="md-dialog__subtitle">タイトル、URL、メモ、キーワードを入力します。</p>
          </div>
          <button id="closeEntryDialogBtn" type="button" class="md-button md-button--surface md-button--compact">閉じる</button>
        </div>

        <div class="md-dialog__body md-stack-md">
          <div class="md-form-grid md-form-grid-1">
            <lht-text-field-help field-id="urlInput" label="URL" required placeholder="例: https://example.com" help-text="保存対象の URL を入力します。"></lht-text-field-help>
          </div>
          <div class="md-form-grid md-form-grid-1">
            <lht-text-field-help field-id="titleInput" label="タイトル" required placeholder="例: OpenAI ドキュメント" help-text="一覧に表示するタイトルです。"></lht-text-field-help>
          </div>
          <div class="md-form-grid md-form-grid-1">
            <lht-text-field-help field-id="keywordsInput" label="キーワード" placeholder="例: OpenAI, API, docs" help-text="カンマ区切りで入力します。保存時は配列に変換します。"></lht-text-field-help>
          </div>
          <div class="md-form-grid md-form-grid-1">
            <lht-text-field-help field-id="memoInput" label="メモ" rows="6" placeholder="必要なメモを入力" help-text="URL にひもづく補足メモを入力します。"></lht-text-field-help>
          </div>
        </div>

        <div class="md-dialog__footer">
          <button id="saveEntryBtn" type="button" class="md-button md-button--primary">保存</button>
        </div>
      </form>
    </dialog>

        <div class="md-dialog__header">
          <div>

            <div class="md-detail-row md-detail-row--field">

            <div class="md-detail-row md-detail-row--keywords">

            </div>
            <div class="md-detail-row md-detail-row--field">
              <lht-text-field-help field-id="detailMemo" label="メモ" rows="6" readonly></lht-text-field-help>
            </div>
          </div>
        </div>

        <div class="md-dialog__footer">
          <div class="md-panel-actions">
            <button id="openUrlBtn" type="button" class="md-button md-button--primary">URLを開く</button>
            <button id="editEntryBtn" type="button" class="md-button md-button--surface">編集</button>
            <button id="deleteEntryBtn" type="button" class="md-button md-button--danger">削除</button>
          </div>
        </div>
      </div>
    </dialog>

    <lht-toast id="toast"></lht-toast>

      let entries = [];
      let editingId = "";
      let selectedId = "";

      function showToast(message) {
        const toast = document.getElementById("toast");
        if (toast && typeof toast.show === "function") {
          toast.show(message, 2200);
        }
      }

      function createId() {
        return `urlmemo-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      }

      function normalizeUrl(url) {
        return String(url || "").trim();
      }

      function parseKeywords(value) {
        if (Array.isArray(value)) {
          return value.map((item) => String(item || "").trim()).filter(Boolean);
        }
        return String(value || "")
          .split(/[,\n]/)
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function formatDateTime(value) {
        const numberValue = Number(value || 0);
        if (!numberValue) {
          return "未記録";
        }
        const date = new Date(numberValue);
        if (Number.isNaN(date.getTime())) {
          return "未記録";
        }
        return new Intl.DateTimeFormat("ja-JP", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      }

      function escapeHtml(text) {
        return String(text || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function normalizeEntry(raw) {
        const now = Date.now();
        return {
          id: raw && raw.id ? String(raw.id) : createId(),
          title: String(raw?.title || "").trim(),
          url: normalizeUrl(raw?.url),
          memo: String(raw?.memo || "").trim(),
          keywords: parseKeywords(raw?.keywords),
          createdAt: Number(raw?.createdAt || now),
          lastAccessedAt: Number(raw?.lastAccessedAt || 0)
        };
      }

      function createDefaultEntries() {
        const seenUrls = new Set();
        return DEFAULT_ENTRIES_PAYLOAD.entries
          .map(normalizeEntry)
          .filter(isValidEntry)
          .filter((entry) => {
            const normalizedUrl = normalizeUrl(entry.url);
            if (seenUrls.has(normalizedUrl)) {
              return false;
            }
            seenUrls.add(normalizedUrl);
            return true;
          });
      }

      function isValidEntry(entry) {
        return !!(entry && entry.title && entry.url);
      }

      function loadEntries() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return createDefaultEntries();
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return createDefaultEntries();
          const loadedEntries = parsed.map(normalizeEntry).filter(isValidEntry);
          return loadedEntries.length > 0 ? loadedEntries : createDefaultEntries();
        } catch (_) {
          return createDefaultEntries();
        }
      }

      function saveEntries() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      }

      function normalizeToken(value) {
        return String(value || "").trim().toLowerCase();
      }

      function buildSearchIndex(entry) {
        const titleTokens = [entry.title].map(normalizeToken).filter(Boolean);
        const keywordTokens = entry.keywords.map(normalizeToken).filter(Boolean);
        const memoTokens = entry.memo.split(/\s+/).map(normalizeToken).filter(Boolean);
        const urlTokens = [entry.url].map(normalizeToken).filter(Boolean);
        return {
          entry,
          titleTokens,
          keywordTokens,
          memoTokens,
          urlTokens,
          expandedTokens: [...new Set([...memoTokens, ...urlTokens])]
        };
      }

      function matchesAllTerms(tokens, terms) {
        if (terms.length === 0) {
          return true;
        }
        return terms.every((term) => tokens.some((token) => token.includes(term)));
      }

      function calculateMatchScore(tokens, terms) {
        if (terms.length === 0) {
          return 0;
        }
        let score = 0;
        for (const term of terms) {
          let bestScoreForTerm = 0;
          for (const token of tokens) {
            if (!token.includes(term) || token.length === 0) {
              continue;
            }
            const currentScore = term.length / token.length;
            if (currentScore > bestScoreForTerm) {
              bestScoreForTerm = currentScore;
            }
          }
          score += bestScoreForTerm;
        }
        return score;
      }

      function sortByLastAccessedDesc(items) {
        return [...items].sort((left, right) => {
          const rightLast = Number(right.lastAccessedAt || 0);
          const leftLast = Number(left.lastAccessedAt || 0);
          if (rightLast !== leftLast) {
            return rightLast - leftLast;
          }
          return Number(right.createdAt || 0) - Number(left.createdAt || 0);
        });
      }

      function sortByScore(items, terms, tokenBuilder) {
        return [...items].sort((left, right) => {
          const rightScore = calculateMatchScore(tokenBuilder(right), terms);
          const leftScore = calculateMatchScore(tokenBuilder(left), terms);
          if (rightScore !== leftScore) {
            return rightScore - leftScore;
          }
          const rightLast = Number(right.lastAccessedAt || 0);
          const leftLast = Number(left.lastAccessedAt || 0);
          if (rightLast !== leftLast) {
            return rightLast - leftLast;
          }
          return String(left.title).localeCompare(String(right.title), "ja");
        });
      }

      function mergeEntryGroups(groups) {
        const merged = [];
        const seenIds = new Set();
        for (const group of groups) {
          for (const entry of group) {
            if (seenIds.has(entry.id)) {
              continue;
            }
            seenIds.add(entry.id);
            merged.push(entry);
          }
        }
        return merged;
      }

      function searchEntries(query) {
        const searchIndexes = entries.map(buildSearchIndex);
        const terms = String(query || "").trim().toLowerCase().split(/\s+/).filter(Boolean);
        if (terms.length === 0) {
          const sorted = sortByLastAccessedDesc(entries);
          return {
            matchedEntries: sorted,
            matchGrades: new Map(sorted.map((entry) => [entry.id, "medium"])),
            terms
          };
        }
        const titleMatches = sortByScore(
          searchIndexes.filter((index) => matchesAllTerms(index.titleTokens, terms)).map((index) => index.entry),
          terms,
          (entry) => buildSearchIndex(entry).titleTokens
        );
        const keywordMatches = sortByScore(
          searchIndexes.filter((index) => matchesAllTerms(index.keywordTokens, terms)).map((index) => index.entry),
          terms,
          (entry) => buildSearchIndex(entry).keywordTokens
        );
        const weakMatches = sortByScore(
          searchIndexes.filter((index) => matchesAllTerms(index.expandedTokens, terms)).map((index) => index.entry),
          terms,
          (entry) => buildSearchIndex(entry).expandedTokens
        );
        const matchedEntries = mergeEntryGroups([titleMatches, keywordMatches, weakMatches]);
        const matchGrades = new Map();
        for (const entry of weakMatches) {
          matchGrades.set(entry.id, "weak");
        }
        for (const entry of keywordMatches) {
          matchGrades.set(entry.id, "medium");
        }
        for (const entry of titleMatches) {
          matchGrades.set(entry.id, "strong");
        }
        return { matchedEntries, matchGrades, terms };
      }

      function renderEntries() {
        const list = document.getElementById("entriesList");
        const emptyGuide = document.getElementById("emptyGuide");
        const resultsMeta = document.getElementById("resultsMeta");
        const query = document.getElementById("searchInput").value || "";
        const { matchedEntries, matchGrades, terms } = searchEntries(query);

        if (resultsMeta) {
          resultsMeta.textContent = terms.length > 0
            ? `${matchedEntries.length} 件ヒット`
            : `${entries.length} 件登録`;
        }

        if (!list) return;
        list.innerHTML = "";

        if (entries.length === 0) {
          emptyGuide.hidden = false;
          emptyGuide.textContent = "まだ登録がありません。追加ボタンから登録してください。";
          return;
        }

        if (matchedEntries.length === 0) {
          emptyGuide.hidden = false;
          emptyGuide.textContent = "一致する項目がありません。検索語を調整してください。";
          return;
        }

        emptyGuide.hidden = true;

        matchedEntries.forEach((entry) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `md-chip-button md-chip-button--${matchGrades.get(entry.id) || "weak"}`;
          button.dataset.entryId = entry.id;
          button.innerHTML = `<span class="md-chip-label">${escapeHtml(entry.title)}</span>`;
          button.addEventListener("click", () => openDetailDialog(entry.id));
          list.appendChild(button);
        });
      }

      function openDialog(dialog) {
        if (dialog && typeof dialog.showModal === "function") {
          dialog.showModal();
        }
      }

      function closeDialog(dialog) {
        if (dialog && dialog.open && typeof dialog.close === "function") {
          dialog.close();
        }
      }

      function resetEntryForm() {
        editingId = "";
        document.getElementById("entryDialogTitle").textContent = "URLメモを追加";
        document.getElementById("titleInput").value = "";
        document.getElementById("urlInput").value = "";
        document.getElementById("keywordsInput").value = "";
        document.getElementById("memoInput").value = "";
      }

      function openCreateDialog() {
        resetEntryForm();
        openDialog(document.getElementById("entryDialog"));
      }

      function openEditDialog(entryId) {
        const entry = entries.find((item) => item.id === entryId);
        if (!entry) return;
        editingId = entry.id;
        document.getElementById("entryDialogTitle").textContent = "URLメモを更新";
        document.getElementById("titleInput").value = entry.title;
        document.getElementById("urlInput").value = entry.url;
        document.getElementById("keywordsInput").value = entry.keywords.join(", ");
        document.getElementById("memoInput").value = entry.memo;
        openDialog(document.getElementById("entryDialog"));
      }

      function saveCurrentEntry() {
        const title = String(document.getElementById("titleInput").value || "").trim();
        const url = normalizeUrl(document.getElementById("urlInput").value || "");
        const keywords = parseKeywords(document.getElementById("keywordsInput").value || "");
        const memo = String(document.getElementById("memoInput").value || "").trim();
        if (!title) {
          alert("タイトルを入力してください。");
          return;
        }
        if (!url) {
          alert("URL を入力してください。");
          return;
        }
        if (editingId) {
          entries = entries.map((entry) => (
            entry.id === editingId
              ? { ...entry, title, url, keywords, memo }
              : entry
          ));
          showToast("URLメモを更新しました");
        } else {
          entries.unshift({
            id: createId(),
            title,
            url,
            keywords,
            memo,
            createdAt: Date.now(),
            lastAccessedAt: 0
          });
          showToast("URLメモを追加しました");
        }
        saveEntries();
        renderEntries();
        closeDialog(document.getElementById("entryDialog"));
      }

      function openDetailDialog(entryId) {
        const entry = entries.find((item) => item.id === entryId);
        if (!entry) return;
        selectedId = entry.id;
        document.getElementById("detailDialogTitle").textContent = entry.title;
        document.getElementById("detailTitle").value = entry.title;
        document.getElementById("detailUrl").value = entry.url;
        document.getElementById("detailMemo").value = entry.memo || "未記入";
        const keywordsNode = document.getElementById("detailKeywords");
        keywordsNode.innerHTML = "";
        if (entry.keywords.length === 0) {
          keywordsNode.textContent = "未設定";
        } else {
          entry.keywords.forEach((keyword) => {
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = "md-keyword-chip";
            chip.textContent = keyword;
            chip.addEventListener("click", () => applyKeywordSearch(keyword));
            keywordsNode.appendChild(chip);
          });
        }
        openDialog(document.getElementById("detailDialog"));
      }

      function applyKeywordSearch(keyword) {
        const searchInput = document.getElementById("searchInput");
        searchInput.value = String(keyword || "").trim();
        closeDialog(document.getElementById("detailDialog"));
        renderEntries();
        searchInput.focus();
      }

      function markAccessed(entryId) {
        entries = entries.map((entry) => (
          entry.id === entryId
            ? { ...entry, lastAccessedAt: Date.now() }
            : entry
        ));
        saveEntries();
      }

      function openSelectedUrl() {
        const entry = entries.find((item) => item.id === selectedId);
        if (!entry) return;
        markAccessed(entry.id);
        renderEntries();
        window.open(entry.url, "_blank", "noopener,noreferrer");
        openDetailDialog(entry.id);
      }

      function deleteSelectedEntry() {
        const entry = entries.find((item) => item.id === selectedId);
        if (!entry) return;
        if (!window.confirm(`「${entry.title}」を削除しますか？`)) {
          return;
        }
        entries = entries.filter((item) => item.id !== entry.id);
        saveEntries();
        renderEntries();
        closeDialog(document.getElementById("detailDialog"));
        showToast("URLメモを削除しました");
      }

      function exportEntries() {
        const payload = {
          version: EXPORT_VERSION,
          exportedAt: new Date().toISOString(),
          entries
        };
        const blob = new Blob([`${JSON.stringify(payload, null, 2)}\n`], { type: "application/json;charset=utf-8" });
        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const now = new Date();
        const stamp = [
          now.getFullYear(),
          String(now.getMonth() + 1).padStart(2, "0"),
          String(now.getDate()).padStart(2, "0"),
          "-",
          String(now.getHours()).padStart(2, "0"),
          String(now.getMinutes()).padStart(2, "0"),
          String(now.getSeconds()).padStart(2, "0")
        ].join("");
        link.href = objectUrl;
        link.download = `url-memo-export-${stamp}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.setTimeout(() => URL.revokeObjectURL(objectUrl), 0);
        showToast("一覧を JSON でエクスポートしました");
      }

      async function importEntriesFromFile(file) {
        if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          if (!parsed || Number(parsed.version) !== EXPORT_VERSION || !Array.isArray(parsed.entries)) {
            showToast("JSON の読み込みに失敗しました");
            return;
          }
          const importedEntries = parsed.entries.map(normalizeEntry).filter(isValidEntry);
          entries = importedEntries.length > 0 ? importedEntries : createDefaultEntries();
          saveEntries();
          renderEntries();
          showToast("一覧を JSON から取り込みました");
        } catch (_) {
          showToast("JSON の読み込みに失敗しました");
        }
      }

      function clearAllEntries() {
        if (!window.confirm("URLメモをすべて削除しますか？")) {
          return;
        }
        entries = [];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        selectedId = "";
        renderEntries();
        showToast("URLメモをすべて削除しました");
      }

      function bindEvents() {
        document.getElementById("searchInput").addEventListener("input", renderEntries);
        document.getElementById("openCreateDialogBtn").addEventListener("click", openCreateDialog);
        document.getElementById("saveEntryBtn").addEventListener("click", saveCurrentEntry);
        document.getElementById("closeEntryDialogBtn").addEventListener("click", () => closeDialog(document.getElementById("entryDialog")));
        document.getElementById("closeDetailDialogBtn").addEventListener("click", () => closeDialog(document.getElementById("detailDialog")));
        document.getElementById("editEntryBtn").addEventListener("click", () => {
          closeDialog(document.getElementById("detailDialog"));
          openEditDialog(selectedId);
        });
        document.getElementById("deleteEntryBtn").addEventListener("click", deleteSelectedEntry);
        document.getElementById("openUrlBtn").addEventListener("click", openSelectedUrl);
        document.getElementById("openUrlInlineBtn").addEventListener("click", openSelectedUrl);
        document.getElementById("exportEntriesBtn").addEventListener("click", exportEntries);
        document.getElementById("importEntriesBtn").addEventListener("click", () => document.getElementById("importEntriesInput").click());
        document.getElementById("clearEntriesBtn").addEventListener("click", clearAllEntries);
        document.getElementById("importEntriesInput").addEventListener("change", async (event) => {
          const file = event.target.files && event.target.files[0];
          await importEntriesFromFile(file);
          event.target.value = "";
        });
        const entryDialog = document.getElementById("entryDialog");
        const detailDialog = document.getElementById("detailDialog");
        [entryDialog, detailDialog].forEach((dialog) => {
          dialog.addEventListener("click", (event) => {
            if (event.target === dialog) {
              closeDialog(dialog);
            }
          });
        });
      }

      function initialize() {
        entries = loadEntries();
        bindEvents();
        renderEntries();
      }

      document.addEventListener("DOMContentLoaded", initialize);
    })();
