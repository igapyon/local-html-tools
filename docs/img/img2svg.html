<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>画像 → SVG 変換</title>
  <style>
    /*
      ベンダリング（Vendoring）: このHTMLファイルは、かつてTailwind CSSをCDNから動的に読み込んでいましたが、
      完全なオフライン化のため、Tailwind CSS の CSS クラス定義を自前で実装しました。
      Tailwind CSS のライセンス情報は THIRD_PARTY_NOTICES.md を参照してください。
      外部CDNに依存せず、単一のHTMLファイルで完結して動作する設計が、このプロジェクトのコア機能です。
    */
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 1rem; line-height: 1.5; }
    button { border: none; cursor: pointer; }

    /* Colors */
    body { background-color: #f9fafb; color: #1f2937; }
    .bg-white { background-color: #ffffff; }
    .bg-gray-50 { background-color: #f9fafb; }
    .bg-gray-200 { background-color: #e5e7eb; }
    .bg-gray-900 { background-color: #111827; }
    .bg-green-600 { background-color: #16a34a; }
    .bg-blue-600 { background-color: #2563eb; }
    .bg-black\/50 { background-color: rgba(0, 0, 0, 0.5); }
    .text-white { color: #ffffff; }
    .text-gray-400 { color: #9ca3af; }
    .text-gray-500 { color: #6b7280; }
    .text-gray-600 { color: #4b5563; }
    .text-gray-700 { color: #374151; }
    .text-gray-800 { color: #1f2937; }
    .text-red-500 { color: #ef4444; }
    .border-gray-200 { border-color: #e5e7eb; }
    .border-gray-300 { border-color: #d1d5db; }
    .border-blue-600 { border-color: #2563eb; }

    /* Layout */
    .flex { display: flex; }
    .inline-flex { display: inline-flex; }
    .flex-col { flex-direction: column; }
    .flex-1 { flex: 1 1 0%; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .flex-wrap { flex-wrap: wrap; }
    .grid { display: grid; }
    .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }
    .gap-6 { gap: 1.5rem; }
    .w-5 { width: 1.25rem; }
    .w-10 { width: 2.5rem; }
    .w-64 { width: 16rem; }
    .w-full { width: 100%; }
    .h-5 { height: 1.25rem; }
    .h-10 { height: 2.5rem; }
    .h-80 { height: 20rem; }
    .max-w-2xl { max-width: 42rem; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .p-2 { padding: 0.5rem; }
    .p-6 { padding: 1.5rem; }
    .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .px-8 { padding-left: 2rem; padding-right: 2rem; }
    .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mb-8 { margin-bottom: 2rem; }
    .mt-6 { margin-top: 1.5rem; }
    .mr-2 { margin-right: 0.5rem; }

    /* Typography */
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-2xl { font-size: 1.5rem; line-height: 2rem; }
    .leading-5 { line-height: 1.25rem; }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }
    .font-normal { font-weight: 400; }

    /* Box model */
    .block { display: block; }
    .hidden { display: none; }
    .rounded { border-radius: 0.375rem; }
    .rounded-lg { border-radius: 0.5rem; }
    .rounded-full { border-radius: 9999px; }
    .rounded-xl { border-radius: 0.75rem; }
    .border { border-width: 1px; border-style: solid; }
    .border-2 { border-width: 2px; border-style: solid; }
    .border-b-2 { border-bottom-width: 2px; }
    .border-dashed { border-style: dashed; }
    .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
    .shadow-md { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
    .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
    .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
    .overflow-hidden { overflow: hidden; }

    /* Position */
    .relative { position: relative; }
    .absolute { position: absolute; }
    .fixed { position: fixed; }
    .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
    .top-4 { top: 1rem; }
    .top-12 { top: 3rem; }
    .right-4 { right: 1rem; }
    .left-1\/2 { left: 50%; }
    .bottom-full { bottom: 100%; }
    .-translate-x-1\/2 { transform: translateX(-50%); }

    /* Visibility */
    .opacity-0 { opacity: 0; }
    .pointer-events-none { pointer-events: none; }
    .z-10 { z-index: 10; }
    .z-20 { z-index: 20; }
    .z-50 { z-index: 50; }

    /* Transitions */
    .transition { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
    .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
    .transition-colors { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }

    /* Hover effects */
    .hover\:bg-gray-300:hover { background-color: #d1d5db; }
    .hover\:bg-gray-100:hover { background-color: #f3f4f6; }
    .hover\:bg-green-700:hover { background-color: #15803d; }
    .hover\:bg-blue-700:hover { background-color: #1d4ed8; }
    button.hover\:bg-gray-300:hover { background-color: #d1d5db; }

    /* Disabled state */
    .disabled\:bg-gray-300:disabled { background-color: #d1d5db; }
    .disabled\:cursor-not-allowed:disabled { cursor: not-allowed; }

    /* Group hover */
    .group:hover .group-hover\:opacity-100 { opacity: 1; }
    .group {}

    /* Interactions */
    .cursor-pointer { cursor: pointer; }
    .cursor-help { cursor: help; }

    /* Effects */
    .backdrop-blur-sm { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }

    /* Animation */
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }

    /* Links */
    a { text-decoration: none !important; }

    /* Responsive */
    @media (min-width: 640px) {
      .sm\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
  <style>
    #preview svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 p-6">
  <div class="max-w-2xl mx-auto bg-white shadow-md rounded-lg p-6 relative">
    <button type="button" class="absolute top-4 right-4 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-1 px-2 rounded" aria-label="メニュー" onclick="toggleMenu()">
      <svg aria-hidden="true" viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
      </svg>
    </button>
    <div id="menuPanel" class="absolute top-12 right-4 bg-white border border-gray-200 rounded shadow-md hidden z-20">
      <a href="../index.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">トップへ戻る</a>
    </div>

    <h1 class="text-2xl font-bold mb-6 flex items-center">
      <span aria-hidden="true" class="mr-2">🖼️</span>画像 → SVG 変換
    </h1>

    <div class="mb-6">
      <label class="flex items-center gap-2 mb-2 font-semibold">
        <span>画像ファイル（PNG/JPEG/WebP/GIF）</span>
        <span class="text-red-500 font-bold">*</span>
      </label>
      <input id="file" type="file" accept="image/*" class="border border-gray-300 rounded w-full p-2 bg-gray-50" />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
      <div>
        <label class="flex items-center gap-2 mb-2 font-semibold">
          <span>プリセット</span>
          <span class="relative inline-flex items-center group">
            <span class="inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-gray-600 bg-gray-200 rounded-full cursor-help">?</span>
            <span id="presetDescription" class="absolute left-1/2 bottom-full mb-2 w-64 -translate-x-1/2 rounded-lg shadow-lg bg-gray-900 text-white text-xs leading-5 font-normal px-3 py-2 opacity-0 group-hover:opacity-100 transition pointer-events-none z-10 shadow-xl">
              用途に合わせた最適な数値をセットします。
            </span>
          </span>
        </label>
        <select id="preset" class="border border-gray-300 rounded w-full p-2 bg-white cursor-pointer">
          <option value="icon">アイコン・ロゴ（軽量・鋭利）</option>
          <option value="illustration" selected>イラスト（なめらか・曲線）</option>
          <option value="photo">写真（芸術的・油絵風）</option>
          <option value="pixelart">ドット絵（ピクセル完全再現）</option>
        </select>
      </div>

      <div>
        <label class="flex items-center gap-2 mb-2 font-semibold">
          <span>色数</span>
          <span class="relative inline-flex items-center group">
            <span class="inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-gray-600 bg-gray-200 rounded-full cursor-help">?</span>
            <span class="absolute left-1/2 bottom-full mb-2 w-64 -translate-x-1/2 rounded-lg shadow-lg bg-gray-900 text-white text-xs leading-5 font-normal px-3 py-2 opacity-0 group-hover:opacity-100 transition pointer-events-none z-10 shadow-xl">
              使用する色の数（2〜64）。多いほど詳細ですが重くなります。
            </span>
          </span>
        </label>
        <input id="colors" type="number" min="2" max="64" value="12" class="border border-gray-300 rounded w-full p-2" />
      </div>

      <div>
        <label class="flex items-center gap-2 mb-2 font-semibold">
          <span>輪郭の精度 (ltres)</span>
          <span class="relative inline-flex items-center group">
            <span class="inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-gray-600 bg-gray-200 rounded-full cursor-help">?</span>
            <span class="absolute left-1/2 bottom-full mb-2 w-64 -translate-x-1/2 rounded-lg shadow-lg bg-gray-900 text-white text-xs leading-5 font-normal px-3 py-2 opacity-0 group-hover:opacity-100 transition pointer-events-none z-10 shadow-xl">
              低いほど元の形に忠実、高いほどノイズを無視します。
            </span>
          </span>
        </label>
        <input id="ltres" type="number" min="0" max="10" step="0.1" value="1.0" class="border border-gray-300 rounded w-full p-2" />
      </div>

      <div>
        <label class="flex items-center gap-2 mb-2 font-semibold">
          <span>曲線の精度 (qtres)</span>
          <span class="relative inline-flex items-center group">
            <span class="inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-gray-600 bg-gray-200 rounded-full cursor-help">?</span>
            <span class="absolute left-1/2 bottom-full mb-2 w-64 -translate-x-1/2 rounded-lg shadow-lg bg-gray-900 text-white text-xs leading-5 font-normal px-3 py-2 opacity-0 group-hover:opacity-100 transition pointer-events-none z-10 shadow-xl">
              低いほど滑らかな曲線、高いほど直線的な描画になります。
            </span>
          </span>
        </label>
        <input id="qtres" type="number" min="0.1" max="10" step="0.1" value="0.1" class="border border-gray-300 rounded w-full p-2" />
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
      <div>
        <label class="flex items-center gap-2 mb-2 font-semibold">
          <span>縮小率（前処理）</span>
          <span class="relative inline-flex items-center group">
            <span class="inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-gray-600 bg-gray-200 rounded-full cursor-help">?</span>
            <span class="absolute left-1/2 bottom-full mb-2 w-64 -translate-x-1/2 rounded-lg shadow-lg bg-gray-900 text-white text-xs leading-5 font-normal px-3 py-2 opacity-0 group-hover:opacity-100 transition pointer-events-none z-10 shadow-xl">
              小さくしてからトレースすることで、パスの数を減らします（10〜100%）。
            </span>
          </span>
        </label>
        <input id="scalePercent" type="number" min="10" max="100" value="100" class="border border-gray-300 rounded w-full p-2" />
      </div>
      <div>
        <label class="flex items-center gap-2 mb-2 font-semibold">
          <span>ぼかし（前処理）</span>
          <span class="relative inline-flex items-center group">
            <span class="inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-gray-600 bg-gray-200 rounded-full cursor-help">?</span>
            <span class="absolute left-1/2 bottom-full mb-2 w-64 -translate-x-1/2 rounded-lg shadow-lg bg-gray-900 text-white text-xs leading-5 font-normal px-3 py-2 opacity-0 group-hover:opacity-100 transition pointer-events-none z-10 shadow-xl">
              0以上の値で細かいノイズをならします（0〜5px）。
            </span>
          </span>
        </label>
        <input id="blurPx" type="number" min="0" max="5" step="0.5" value="0" class="border border-gray-300 rounded w-full p-2" />
      </div>
    </div>

    <div class="flex gap-3 mb-8">
      <button id="convert" disabled class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded shadow-sm disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors">
        SVGに変換する
      </button>
    </div>

    <div class="mb-2 font-semibold flex items-center justify-between">
      <span>プレビュー</span>
      <span id="fileInfo" class="text-xs text-gray-500 font-normal"></span>
    </div>
    <div id="preview" class="border-2 border-dashed border-gray-200 rounded bg-gray-50 h-80 flex items-center justify-center overflow-hidden transition-all">
      <p class="text-gray-400 text-sm">ここに変換後の画像が表示されます</p>
    </div>

    <div class="flex gap-3 mt-6">
      <button id="download" disabled class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow-sm disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors">
        SVGをダウンロード
      </button>
    </div>
  </div>

  <div id="loading" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 backdrop-blur-sm">
    <div class="bg-white px-8 py-6 rounded-xl shadow-2xl flex flex-col items-center">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-4"></div>
      <p class="font-bold text-gray-700">ベクター変換中...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>

  <script>
    const fileInput = document.getElementById("file");
    const convertBtn = document.getElementById("convert");
    const downloadBtn = document.getElementById("download");
    const preview = document.getElementById("preview");
    const loading = document.getElementById("loading");
    const colorsInput = document.getElementById("colors");
    const ltresInput = document.getElementById("ltres");
    const qtresInput = document.getElementById("qtres");
    const presetSelect = document.getElementById("preset");
    const presetDesc = document.getElementById("presetDescription");
    const scaleInput = document.getElementById("scalePercent");
    const blurInput = document.getElementById("blurPx");

    let selectedFile = null;
    let lastSvgText = "";

    // Gemini究極のプリセット定義
    const presetMap = {
      icon: { 
        numberofcolors: 4, ltres: 0.1, qtres: 5.0, 
        desc: "ロゴやアイコン用。輪郭を極限まで鋭く保ち、パスの数を減らしてデータ量を最小限にします。" 
      },
      illustration: { 
        numberofcolors: 12, ltres: 1.0, qtres: 0.1, 
        desc: "手書きイラストや漫画用。線のガタつきを抑え、美しいベジェ曲線で滑らかに表現します。" 
      },
      photo: { 
        numberofcolors: 32, ltres: 1.0, qtres: 1.0, 
        desc: "写真や複雑な絵画用。多めの色数でトレースし、アーティスティックな階調を生み出します。" 
      },
      pixelart: { 
        numberofcolors: 16, ltres: 0.0, qtres: 10.0, 
        desc: "ドット絵専用。1ピクセルも崩さず、元のマス目を正確な四角形としてベクター化します。" 
      }
    };

    // プリセット適用関数（説明文も動的に更新）
    function applyPreset(key) {
      const preset = presetMap[key] || presetMap.illustration;
      colorsInput.value = preset.numberofcolors;
      ltresInput.value = preset.ltres;
      qtresInput.value = preset.qtres;
      if (presetDesc) presetDesc.textContent = preset.desc;
    }

    // 初期化
    applyPreset(presetSelect.value);

    presetSelect.addEventListener("change", () => applyPreset(presetSelect.value));

    fileInput.addEventListener("change", () => {
      selectedFile = fileInput.files && fileInput.files[0];
      convertBtn.disabled = !selectedFile;
      downloadBtn.disabled = true;
      lastSvgText = "";
      preview.innerHTML = '<p class="text-gray-400 text-sm">「変換する」ボタンを押してください</p>';
      document.getElementById("fileInfo").textContent = selectedFile ? `${selectedFile.name}` : "";
    });

    convertBtn.addEventListener("click", async () => {
      if (!selectedFile) return;

      showLoading(true);
      downloadBtn.disabled = true;
      convertBtn.disabled = true;

      try {
        await nextFrame();

        if (!window.ImageTracer) throw new Error("ImageTracer not loaded.");

        const img = await fileToImage(selectedFile);
        const scalePercent = readNumber(scaleInput, 100, 10, 100);
        const blurPx = readNumber(blurInput, 0, 0, 5);
        const scale = scalePercent / 100;
        const scaledWidth = Math.max(1, Math.round(img.naturalWidth * scale));
        const scaledHeight = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement("canvas");
        canvas.width = scaledWidth;
        canvas.height = scaledHeight;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        if (blurPx > 0) {
          ctx.filter = `blur(${blurPx}px)`;
        }
        ctx.drawImage(img, 0, 0, scaledWidth, scaledHeight);
        ctx.filter = "none";

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const options = readOptions();
        
        // 変換実行
        lastSvgText = window.ImageTracer.imagedataToSVG(imageData, options);
        if (scale !== 1) {
          lastSvgText = adjustSvgDimensions(
            lastSvgText,
            img.naturalWidth,
            img.naturalHeight,
            scaledWidth,
            scaledHeight
          );
        }

        preview.innerHTML = preparePreviewSvg(lastSvgText);
        downloadBtn.disabled = false;
      } catch (e) {
        console.error(e);
        alert("変換に失敗しました。ファイル形式を確認してください。");
      } finally {
        showLoading(false);
        convertBtn.disabled = !selectedFile;
      }
    });

    downloadBtn.addEventListener("click", () => {
      if (!lastSvgText) return;
      downloadText(lastSvgText, "converted_vector.svg", "image/svg+xml");
    });

    // ユーティリティ
    function showLoading(on) {
      loading.classList.toggle("hidden", !on);
      loading.classList.toggle("flex", on);
    }

    function nextFrame() { return new Promise(requestAnimationFrame); }

    function fileToImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = reject;
        img.src = url;
      });
    }

    function downloadText(text, filename, mime) {
      const blob = new Blob([text], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function readOptions() {
      return {
        numberofcolors: readNumber(colorsInput, 12, 2, 64),
        ltres: readNumber(ltresInput, 1, 0, 10),
        qtres: readNumber(qtresInput, 1, 0.1, 10),
      };
    }

    function readNumber(input, fallback, min, max) {
      const value = parseFloat(input.value);
      if (isNaN(value)) return fallback;
      return Math.min(Math.max(value, min), max);
    }

    function preparePreviewSvg(svgText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(svgText, "image/svg+xml");
      const svg = doc.querySelector("svg");
      if (!svg) return svgText;

      const w = svg.getAttribute("width");
      const h = svg.getAttribute("height");
      if (!svg.hasAttribute("viewBox") && w && h) {
        svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      }
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", "100%");
      svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

      return new XMLSerializer().serializeToString(svg);
    }

    function adjustSvgDimensions(svgText, width, height, tracedWidth, tracedHeight) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(svgText, "image/svg+xml");
      const svg = doc.querySelector("svg");
      if (!svg) return svgText;

      if (!svg.hasAttribute("viewBox")) {
        svg.setAttribute("viewBox", `0 0 ${tracedWidth} ${tracedHeight}`);
      }
      svg.setAttribute("width", String(width));
      svg.setAttribute("height", String(height));

      return new XMLSerializer().serializeToString(svg);
    }

    function toggleMenu() {
      const panel = document.getElementById("menuPanel");
      if (panel) panel.classList.toggle("hidden");
    }
  </script>
