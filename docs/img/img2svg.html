<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>画像 → SVG 変換</title>
  <style>
    :root {
      --md-sys-color-primary: #6200ee;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-surface: #ffffff;
      --md-sys-color-surface-variant: #f4f1f7;
      --md-sys-color-background: #f6f4f8;
      --md-sys-color-on-surface: #1c1b1f;
      --md-sys-color-on-surface-variant: #49454f;
      --md-sys-color-outline: #c8c5d0;
      --md-sys-color-shadow: rgba(0, 0, 0, 0.2);
      --md-state-layer: rgba(98, 0, 238, 0.12);
      --md-danger: #b3261e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: "Roboto", "Segoe UI", "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 1rem; line-height: 1.5; }
    a { text-decoration: none; color: inherit; }
    button { border: none; background: transparent; cursor: pointer; font: inherit; }

    .md-page { background-color: var(--md-sys-color-background); color: var(--md-sys-color-on-surface); padding: 24px; }
    .md-surface-card { max-width: 48rem; margin: 0 auto; padding: 24px; position: relative; }
    .md-card {
      background: var(--md-sys-color-surface);
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid #ece7f3;
    }

    .md-menu-button { position: absolute; top: 16px; right: 16px; }
    .md-menu-panel {
      position: absolute;
      top: 56px;
      right: 16px;
      background: var(--md-sys-color-surface);
      border: 1px solid #e6e1ee;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 4px 0;
      min-width: 160px;
      z-index: 20;
    }
    .md-menu-link { display: block; padding: 8px 16px; color: var(--md-sys-color-on-surface); }
    .md-menu-link:hover { background: #f2edf8; }

    .md-headline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding-right: 2.5rem;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
      font-weight: 700;
    }
    .md-headline__icon { margin-right: 0.5rem; }

    .md-section { margin-bottom: 1.25rem; }
    .md-grid { display: grid; gap: 1rem; }
    @media (min-width: 768px) {
      .md-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .md-label {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 0.5rem;
    }
    .md-required { color: var(--md-danger); font-weight: 700; }

    .md-input,
    .md-select {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 12px;
      border: 1px solid var(--md-sys-color-outline);
      background: var(--md-sys-color-surface);
      font-size: 1rem;
      color: var(--md-sys-color-on-surface);
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .md-input:focus,
    .md-select:focus {
      outline: none;
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 0 3px rgba(98, 0, 238, 0.2);
    }

    .md-actions { display: flex; gap: 0.75rem; }
    .md-button {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 9999px;
      font-weight: 600;
      transition: box-shadow 150ms ease, transform 150ms ease, background 150ms ease;
    }
    .md-button--primary {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      box-shadow: 0 2px 6px rgba(98, 0, 238, 0.3);
    }
    .md-button--primary:hover { box-shadow: 0 4px 10px rgba(98, 0, 238, 0.35); }
    .md-button--secondary {
      background: var(--md-sys-color-surface-variant);
      color: var(--md-sys-color-primary);
      border: 1px solid #ded7e6;
    }
    .md-button:disabled {
      background: #e6e1ee;
      color: #9a94a7;
      cursor: not-allowed;
      box-shadow: none;
    }

    .md-row-between { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .md-muted { color: #6a6675; font-size: 0.75rem; }

    .md-preview {
      border: 2px dashed #ddd6e8;
      border-radius: 16px;
      background: var(--md-sys-color-surface-variant);
      height: 20rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .md-preview__empty { color: #8f8a98; font-size: 0.875rem; }

    .md-tooltip-group { position: relative; display: inline-flex; align-items: center; }
    .md-tooltip-content {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 0.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease;
      z-index: 50;
      width: min(24rem, 90vw);
    }
    .md-tooltip-group:hover .md-tooltip-content { opacity: 1; }
    .md-tooltip {
      display: block;
      min-width: 12rem;
      background: #2b2831;
      color: #f7f4fb;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.8125rem;
      font-weight: 400;
      line-height: 1.5;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      white-space: normal;
      word-break: break-word;
    }
    .md-help-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 9999px;
      background: #f0edf5;
      color: #4a4458;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .md-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f0edf5;
      color: #3f3b46;
      transition: background 150ms ease, box-shadow 150ms ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }
    .md-icon-btn:hover { background: #e6e1ee; }
    .md-icon-20 { width: 20px; height: 20px; }

    .md-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      backdrop-filter: blur(4px);
    }
    .md-dialog {
      background: var(--md-sys-color-surface);
      padding: 1.5rem 2rem;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }
    .md-spinner {
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      border: 3px solid #d7cfee;
      border-top-color: var(--md-sys-color-primary);
      animation: spin 1s linear infinite;
    }

    .hidden { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <style>
    #preview svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body class="md-page">
  <div class="md-surface-card md-card">
    <button type="button" class="md-icon-btn md-menu-button" aria-label="メニュー" onclick="toggleMenu()">
      <svg aria-hidden="true" viewBox="0 0 24 24" class="md-icon-20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
      </svg>
    </button>
    <div id="menuPanel" class="md-menu-panel hidden">
      <a href="../index.html" class="md-menu-link">トップへ戻る</a>
    </div>

    <h1 class="md-headline">
      <span aria-hidden="true" class="md-headline__icon">🖼️</span>
      <span>画像 → SVG 変換</span>
      <span class="md-tooltip-group">
        <span class="md-help-chip">?</span>
        <span class="md-tooltip-content">
          <span class="md-tooltip">
            画像ファイルをSVGに変換します。これは困難なことを実現するツールです。アイコン・ロゴのようなものはよく再現できますが、イラスト・写真などは技術的な理由から再現度が高くないことをあらかじめご承知ください。
          </span>
        </span>
      </span>
    </h1>

    <div class="md-section">
      <label class="md-label">
        <span>画像ファイル（PNG/JPEG/WebP/GIF）</span>
        <span class="md-required">*</span>
      </label>
      <input id="file" type="file" accept="image/*" class="md-input" />
    </div>

    <div class="md-grid md-grid-2 md-section">
      <div>
        <label class="md-label">
          <span>プリセット</span>
          <span class="md-tooltip-group">
            <span class="md-help-chip">?</span>
            <span class="md-tooltip-content">
              <span id="presetDescription" class="md-tooltip">用途に合わせた最適な数値をセットします。</span>
            </span>
          </span>
        </label>
        <select id="preset" class="md-select">
          <option value="icon">アイコン・ロゴ（軽量・鋭利）</option>
          <option value="illustration" selected>イラスト（なめらか・曲線）</option>
          <option value="photo">写真（芸術的・油絵風）</option>
          <option value="pixelart">ドット絵（ピクセル完全再現）</option>
        </select>
      </div>

      <div>
        <label class="md-label">
          <span>色数</span>
          <span class="md-tooltip-group">
            <span class="md-help-chip">?</span>
            <span class="md-tooltip-content">
              <span class="md-tooltip">使用する色の数（2〜64）。多いほど詳細ですが重くなります。</span>
            </span>
          </span>
        </label>
        <input id="colors" type="number" min="2" max="64" value="12" class="md-input" />
      </div>

      <div>
        <label class="md-label">
          <span>輪郭の精度 (ltres)</span>
          <span class="md-tooltip-group">
            <span class="md-help-chip">?</span>
            <span class="md-tooltip-content">
              <span class="md-tooltip">低いほど元の形に忠実、高いほどノイズを無視します。</span>
            </span>
          </span>
        </label>
        <input id="ltres" type="number" min="0" max="10" step="0.1" value="1.0" class="md-input" />
      </div>

      <div>
        <label class="md-label">
          <span>曲線の精度 (qtres)</span>
          <span class="md-tooltip-group">
            <span class="md-help-chip">?</span>
            <span class="md-tooltip-content">
              <span class="md-tooltip">低いほど滑らかな曲線、高いほど直線的な描画になります。</span>
            </span>
          </span>
        </label>
        <input id="qtres" type="number" min="0.1" max="10" step="0.1" value="0.1" class="md-input" />
      </div>
    </div>

    <div class="md-grid md-grid-2 md-section">
      <div>
        <label class="md-label">
          <span>縮小率（前処理）</span>
          <span class="md-tooltip-group">
            <span class="md-help-chip">?</span>
            <span class="md-tooltip-content">
              <span class="md-tooltip">小さくしてからトレースすることで、パスの数を減らします（10〜100%）。</span>
            </span>
          </span>
        </label>
        <input id="scalePercent" type="number" min="10" max="100" value="100" class="md-input" />
      </div>
      <div>
        <label class="md-label">
          <span>ぼかし（前処理）</span>
          <span class="md-tooltip-group">
            <span class="md-help-chip">?</span>
            <span class="md-tooltip-content">
              <span class="md-tooltip">0以上の値で細かいノイズをならします（0〜5px）。</span>
            </span>
          </span>
        </label>
        <input id="blurPx" type="number" min="0" max="5" step="0.5" value="0" class="md-input" />
      </div>
    </div>

    <div class="md-actions md-section">
      <button id="convert" disabled class="md-button md-button--primary">
        SVGに変換する
      </button>
    </div>

    <div class="md-row-between md-section">
      <span>プレビュー</span>
      <span id="fileInfo" class="md-muted"></span>
    </div>
    <div id="preview" class="md-preview">
      <p class="md-preview__empty">ここに変換後の画像が表示されます</p>
    </div>

    <div class="md-actions md-section" style="margin-top: 1.5rem;">
      <button id="download" disabled class="md-button md-button--secondary">
        SVGをダウンロード
      </button>
    </div>
  </div>

  <div id="loading" class="md-overlay hidden">
    <div class="md-dialog md-card">
      <div class="md-spinner"></div>
      <p>ベクター変換中...</p>
    </div>
  </div>

  <script>
/*
	imagetracer.js version 1.2.6
	Simple raster image tracer and vectorizer written in JavaScript.

(function(){ 'use strict';

function ImageTracer(){
	var _this = this;

	this.versionnumber = '1.2.6',
	
	////////////////////////////////////////////////////////////
	//
	//  API
	//
	////////////////////////////////////////////////////////////
	
	// Loading an image from a URL, tracing when loaded,
	// then executing callback with the scaled svg string as argument
	this.imageToSVG = function( url, callback, options ){
		options = _this.checkoptions(options);
		// loading image, tracing and callback
		_this.loadImage(
			url,
			function(canvas){
				callback(
					_this.imagedataToSVG( _this.getImgdata(canvas), options )
				);
			},
			options
		);
	},// End of imageToSVG()
	
	// Tracing imagedata, then returning the scaled svg string
	this.imagedataToSVG = function( imgd, options ){
		options = _this.checkoptions(options);
		// tracing imagedata
		var td = _this.imagedataToTracedata( imgd, options );
		// returning SVG string
		return _this.getsvgstring(td, options);
	},// End of imagedataToSVG()
	
	// Loading an image from a URL, tracing when loaded,
	// then executing callback with tracedata as argument
	this.imageToTracedata = function( url, callback, options ){
		options = _this.checkoptions(options);
		// loading image, tracing and callback
		_this.loadImage(
				url,
				function(canvas){
					callback(
						_this.imagedataToTracedata( _this.getImgdata(canvas), options )
					);
				},
				options
		);
	},// End of imageToTracedata()
	
	// Tracing imagedata, then returning tracedata (layers with paths, palette, image size)
	this.imagedataToTracedata = function( imgd, options ){
		options = _this.checkoptions(options);
		
		// 1. Color quantization
		var ii = _this.colorquantization( imgd, options );
		
		if(options.layering === 0){// Sequential layering
			
			// create tracedata object
			var tracedata = {
				layers : [],
				palette : ii.palette,
				width : ii.array[0].length-2,
				height : ii.array.length-2
			};
			
			// Loop to trace each color layer
			for(var colornum=0; colornum<ii.palette.length; colornum++){
				
				// layeringstep -> pathscan -> internodes -> batchtracepaths
				var tracedlayer =
					_this.batchtracepaths(
							
						_this.internodes(
								
							_this.pathscan(
								_this.layeringstep( ii, colornum ),
								options.pathomit
							),
							
							options
							
						),
						
						options.ltres,
						options.qtres
						
					);
				
				// adding traced layer
				tracedata.layers.push(tracedlayer);
				
			}// End of color loop
			
		}else{// Parallel layering
			// 2. Layer separation and edge detection
			var ls = _this.layering( ii );
			
			// Optional edge node visualization
			if(options.layercontainerid){ _this.drawLayers( ls, _this.specpalette, options.scale, options.layercontainerid ); }
			
			// 3. Batch pathscan
			var bps = _this.batchpathscan( ls, options.pathomit );
			
			// 4. Batch interpollation
			var bis = _this.batchinternodes( bps, options );
			
			// 5. Batch tracing and creating tracedata object
			var tracedata = {
				layers : _this.batchtracelayers( bis, options.ltres, options.qtres ),
				palette : ii.palette,
				width : imgd.width,
				height : imgd.height
			};
			
		}// End of parallel layering
		
		// return tracedata
		return tracedata;
		
	},// End of imagedataToTracedata()
	
	this.optionpresets = {
		'default': {
			
			// Tracing
			corsenabled : false,
			ltres : 1,
			qtres : 1,
			pathomit : 8,
			rightangleenhance : true,
			
			// Color quantization
			colorsampling : 2,
			numberofcolors : 16,
			mincolorratio : 0,
			colorquantcycles : 3,
			
			// Layering method
			layering : 0,
			
			// SVG rendering
			strokewidth : 1,
			linefilter : false,
			scale : 1,
			roundcoords : 1,
			viewbox : false,
			desc : false,
			lcpr : 0,
			qcpr : 0,
			
			// Blur
			blurradius : 0,
			blurdelta : 20
			
		},
		'posterized1': { colorsampling:0, numberofcolors:2 },
		'posterized2': { numberofcolors:4, blurradius:5 },
		'curvy': { ltres:0.01, linefilter:true, rightangleenhance:false },
		'sharp': { qtres:0.01, linefilter:false },
		'detailed': { pathomit:0, roundcoords:2, ltres:0.5, qtres:0.5, numberofcolors:64 },
		'smoothed': { blurradius:5, blurdelta: 64 },
		'grayscale': { colorsampling:0, colorquantcycles:1, numberofcolors:7 },
		'fixedpalette': { colorsampling:0, colorquantcycles:1, numberofcolors:27 },
		'randomsampling1': { colorsampling:1, numberofcolors:8 },
		'randomsampling2': { colorsampling:1, numberofcolors:64 },
		'artistic1': { colorsampling:0, colorquantcycles:1, pathomit:0, blurradius:5, blurdelta: 64, ltres:0.01, linefilter:true, numberofcolors:16, strokewidth:2 },
		'artistic2': { qtres:0.01, colorsampling:0, colorquantcycles:1, numberofcolors:4, strokewidth:0 },
		'artistic3': { qtres:10, ltres:10, numberofcolors:8 },
		'artistic4': { qtres:10, ltres:10, numberofcolors:64, blurradius:5, blurdelta: 256, strokewidth:2 },
		'posterized3': { ltres: 1, qtres: 1, pathomit: 20, rightangleenhance: true, colorsampling: 0, numberofcolors: 3,
			mincolorratio: 0, colorquantcycles: 3, blurradius: 3, blurdelta: 20, strokewidth: 0, linefilter: false,
			roundcoords: 1, pal: [ { r: 0, g: 0, b: 100, a: 255 }, { r: 255, g: 255, b: 255, a: 255 } ] }
	},// End of optionpresets
	
	// creating options object, setting defaults for missing values
	this.checkoptions = function(options){
		options = options || {};
		// Option preset
		if(typeof options === 'string'){
			options = options.toLowerCase();
			if( _this.optionpresets[options] ){ options = _this.optionpresets[options]; }else{ options = {}; }
		}
		// Defaults
		var ok = Object.keys(_this.optionpresets['default']);
		for(var k=0; k<ok.length; k++){
			if(!options.hasOwnProperty(ok[k])){ options[ok[k]] = _this.optionpresets['default'][ok[k]]; }
		}
		// options.pal is not defined here, the custom palette should be added externally: options.pal = [ { 'r':0, 'g':0, 'b':0, 'a':255 }, {...}, ... ];
		// options.layercontainerid is not defined here, can be added externally: options.layercontainerid = 'mydiv'; ... <div id="mydiv"></div>
		return options;
	},// End of checkoptions()
	
	////////////////////////////////////////////////////////////
	//
	//  Vectorizing functions
	//
	////////////////////////////////////////////////////////////
	
	// 1. Color quantization
	// Using a form of k-means clustering repeatead options.colorquantcycles times. http://en.wikipedia.org/wiki/Color_quantization
	this.colorquantization = function( imgd, options ){
		var arr = [], idx=0, cd,cdl,ci, paletteacc = [], pixelnum = imgd.width * imgd.height, i, j, k, cnt, palette;
		
		// imgd.data must be RGBA, not just RGB
		if( imgd.data.length < pixelnum * 4 ){
			var newimgddata = new Uint8ClampedArray(pixelnum * 4);
			for(var pxcnt = 0; pxcnt < pixelnum ; pxcnt++){
				newimgddata[pxcnt*4  ] = imgd.data[pxcnt*3  ];
				newimgddata[pxcnt*4+1] = imgd.data[pxcnt*3+1];
				newimgddata[pxcnt*4+2] = imgd.data[pxcnt*3+2];
				newimgddata[pxcnt*4+3] = 255;
			}
			imgd.data = newimgddata;
		}// End of RGBA imgd.data check
		
		// Filling arr (color index array) with -1
		for( j=0; j<imgd.height+2; j++ ){ arr[j]=[]; for(i=0; i<imgd.width+2 ; i++){ arr[j][i] = -1; } }
		
		// Use custom palette if pal is defined or sample / generate custom length palette
		if(options.pal){
			palette = options.pal;
		}else if(options.colorsampling === 0){
			palette = _this.generatepalette(options.numberofcolors);
		}else if(options.colorsampling === 1){

    const loading = document.getElementById("loading");
    const colorsInput = document.getElementById("colors");
    const ltresInput = document.getElementById("ltres");
    const qtresInput = document.getElementById("qtres");
    const presetSelect = document.getElementById("preset");
    const presetDesc = document.getElementById("presetDescription");
    const scaleInput = document.getElementById("scalePercent");
    const blurInput = document.getElementById("blurPx");

    let selectedFile = null;
    let lastSvgText = "";

    // Gemini究極のプリセット定義
    const presetMap = {
      icon: { 
        numberofcolors: 4, ltres: 0.1, qtres: 5.0, 
        desc: "ロゴやアイコン用。輪郭を極限まで鋭く保ち、パスの数を減らしてデータ量を最小限にします。" 
      },
      illustration: { 
        numberofcolors: 12, ltres: 1.0, qtres: 0.1, 
        desc: "手書きイラストや漫画用。線のガタつきを抑え、美しいベジェ曲線で滑らかに表現します。" 
      },
      photo: { 
        numberofcolors: 32, ltres: 1.0, qtres: 1.0, 
        desc: "写真や複雑な絵画用。多めの色数でトレースし、アーティスティックな階調を生み出します。" 
      },
      pixelart: { 
        numberofcolors: 16, ltres: 0.0, qtres: 10.0, 
        desc: "ドット絵専用。1ピクセルも崩さず、元のマス目を正確な四角形としてベクター化します。" 
      }
    };

    // プリセット適用関数（説明文も動的に更新）
    function applyPreset(key) {
      const preset = presetMap[key] || presetMap.illustration;
      colorsInput.value = preset.numberofcolors;
      ltresInput.value = preset.ltres;
      qtresInput.value = preset.qtres;
      if (presetDesc) presetDesc.textContent = preset.desc;
    }

    // 初期化
    applyPreset(presetSelect.value);

    presetSelect.addEventListener("change", () => applyPreset(presetSelect.value));

    fileInput.addEventListener("change", () => {
      selectedFile = fileInput.files && fileInput.files[0];
      convertBtn.disabled = !selectedFile;
      downloadBtn.disabled = true;
      lastSvgText = "";
      preview.innerHTML = '<p class="md-preview__empty">「変換する」ボタンを押してください</p>';
      document.getElementById("fileInfo").textContent = selectedFile ? `${selectedFile.name}` : "";
    });

    convertBtn.addEventListener("click", async () => {
      if (!selectedFile) return;

      showLoading(true);
      downloadBtn.disabled = true;
      convertBtn.disabled = true;

      try {
        await nextFrame();

        if (!window.ImageTracer) throw new Error("ImageTracer not loaded.");

        const img = await fileToImage(selectedFile);
        const scalePercent = readNumber(scaleInput, 100, 10, 100);
        const blurPx = readNumber(blurInput, 0, 0, 5);
        const scale = scalePercent / 100;
        const scaledWidth = Math.max(1, Math.round(img.naturalWidth * scale));
        const scaledHeight = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement("canvas");
        canvas.width = scaledWidth;
        canvas.height = scaledHeight;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        if (blurPx > 0) {
          ctx.filter = `blur(${blurPx}px)`;
        }
        ctx.drawImage(img, 0, 0, scaledWidth, scaledHeight);
        ctx.filter = "none";

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const options = readOptions();
        
        // 変換実行
        lastSvgText = window.ImageTracer.imagedataToSVG(imageData, options);
        if (scale !== 1) {
          lastSvgText = adjustSvgDimensions(
            lastSvgText,
            img.naturalWidth,
            img.naturalHeight,
            scaledWidth,
            scaledHeight
          );
        }

        preview.innerHTML = preparePreviewSvg(lastSvgText);
        downloadBtn.disabled = false;
      } catch (e) {
        console.error(e);
        alert("変換に失敗しました。ファイル形式を確認してください。");
      } finally {
        showLoading(false);
        convertBtn.disabled = !selectedFile;
      }
    });

    downloadBtn.addEventListener("click", () => {
      if (!lastSvgText) return;
      downloadText(lastSvgText, "converted_vector.svg", "image/svg+xml");
    });

    // ユーティリティ
    function showLoading(on) {
      loading.classList.toggle("hidden", !on);
    }

    function nextFrame() { return new Promise(requestAnimationFrame); }

    function fileToImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = reject;
        img.src = url;
      });
    }

    function downloadText(text, filename, mime) {
      const blob = new Blob([text], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function readOptions() {
      return {
        numberofcolors: readNumber(colorsInput, 12, 2, 64),
        ltres: readNumber(ltresInput, 1, 0, 10),
        qtres: readNumber(qtresInput, 1, 0.1, 10),
      };
    }

    function readNumber(input, fallback, min, max) {
      const value = parseFloat(input.value);
      if (isNaN(value)) return fallback;
      return Math.min(Math.max(value, min), max);
    }

    function preparePreviewSvg(svgText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(svgText, "image/svg+xml");
      const svg = doc.querySelector("svg");
      if (!svg) return svgText;

      const w = svg.getAttribute("width");
      const h = svg.getAttribute("height");
      if (!svg.hasAttribute("viewBox") && w && h) {
        svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      }
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", "100%");
      svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

      return new XMLSerializer().serializeToString(svg);
    }

    function adjustSvgDimensions(svgText, width, height, tracedWidth, tracedHeight) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(svgText, "image/svg+xml");
      const svg = doc.querySelector("svg");
      if (!svg) return svgText;

      if (!svg.hasAttribute("viewBox")) {
        svg.setAttribute("viewBox", `0 0 ${tracedWidth} ${tracedHeight}`);
      }
      svg.setAttribute("width", String(width));
      svg.setAttribute("height", String(height));

      return new XMLSerializer().serializeToString(svg);
    }

    function toggleMenu() {
      const panel = document.getElementById("menuPanel");
      if (panel) panel.classList.toggle("hidden");
    }
  </script>
</body>
</html>
