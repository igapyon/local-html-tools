<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Git ユーザー設定コマンドジェネレータ</title>
  <link rel="stylesheet" href="../../lht-cmn/css/components.css" />
  <link rel="stylesheet" href="src/git-config-setup/css/app.css" />
  <script src="src/vendor/material-web-outlined-text-field.bundle.js"></script>
  <script src="../../lht-cmn/js/components.js" defer></script>
</head>
<body class="md-page">
  <svg aria-hidden="true" class="md-icon-sprite" width="0" height="0" viewBox="0 0 0 0" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <symbol id="md-icon-menu" viewBox="0 0 24 24">
        <path d="M4 6h16"/>
        <path d="M4 12h16"/>
        <path d="M4 18h16"/>
      </symbol>
      <symbol id="md-icon-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2"/>
        <rect x="4" y="4" width="11" height="11" rx="2"/>
      </symbol>
    </defs>
  </svg>

  <div class="md-surface-card md-card">
    <lht-page-hero
      title="Git ユーザー設定コマンドジェネレータ"
      subtitle="Gitユーザー名とメールアドレスを設定するコマンドを生成します。"
      icon="⚙️"
      help-label="Git ユーザー設定コマンドジェネレータの説明"
      help-wide
      menu-home-href="../index.html"
      menu-home-label="トップへ戻る">
      グローバル設定でGitユーザー名とメールアドレスを設定するためのコマンドを生成します。
    </lht-page-hero>

    <section id="checkSection" class="md-section md-stack-md">
      <div class="md-flow-row">
        <svg aria-hidden="true" viewBox="0 0 64 64" class="md-step-icon" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="56" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
          <circle cx="20" cy="32" r="4" fill="#93C5FD"/>
          <path d="M24 32H34" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
          <path d="M34 32H44" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
          <circle cx="48" cy="32" r="4" fill="#93C5FD"/>
        </svg>
        <span class="md-title-info-row">
          <p class="md-section-title">現在の設定を確認</p>
          <lht-help-tooltip label="現在の設定を確認の説明" wide>
            設定前に現在のユーザー名とメールアドレスを確認できます。
          </lht-help-tooltip>
        </span>
      </div>

      <button type="button" onclick="generateCheckCommand()" class="md-button md-button--primary">確認コマンド生成</button>
      <lht-command-block command-id="checkCmd"></lht-command-block>
    </section>

    <hr class="md-divider" />

    <section id="setupSection" class="md-section md-stack-md">
      <div class="md-flow-row">
        <svg aria-hidden="true" viewBox="0 0 64 64" class="md-step-icon" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="56" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
          <circle cx="20" cy="20" r="4" fill="#A78BFA"/>
          <path d="M24 20H34" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"/>
          <path d="M34 20H44" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"/>
          <circle cx="48" cy="20" r="4" fill="#A78BFA"/>
          <path d="M20 44L32 32L44 44" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="md-title-info-row">
          <p class="md-section-title">ユーザー情報を設定</p>
          <lht-help-tooltip label="ユーザー情報を設定の説明" wide>
            グローバル設定でユーザー名とメールアドレスを設定するコマンドを生成します。
          </lht-help-tooltip>
        </span>
      </div>

      <div class="md-stack-md">
        <lht-text-field-help field-id="userName" label="ユーザー名" required placeholder="例: Taro Yamada" help-text="Gitコミットに記録される名前です。本名またはニックネームを入力してください。"></lht-text-field-help>
        <lht-text-field-help field-id="userEmail" label="メールアドレス" required placeholder="例: taro@example.com" help-text="Gitコミットに記録されるメールアドレスです。連絡可能なメールアドレスを入力してください。"></lht-text-field-help>
      </div>
    </section>

    <button type="button" onclick="generateSetupCommand()" class="md-button md-button--primary">設定コマンド生成</button>
    <lht-command-block command-id="setupCmd"></lht-command-block>

    <div id="toast" class="md-snackbar-host md-snackbar">コピーしました</div>
  </div>

  <script src="src/git-config-setup/js/main.js"></script>
</body>
</html>
