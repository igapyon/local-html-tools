<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mermaid → SVG 変換</title>
    <link rel="stylesheet" href="../../lht-cmn/css/components.css" />
  <link rel="stylesheet" href="src/mermaid-to-svg/css/app.css" />
  <script src="mermaid.min.js"></script>
  <script src="../git/src/vendor/material-web-outlined-text-field.bundle.js"></script>
  <script src="../../lht-cmn/js/components.js" defer></script>
</head>
<body class="md-page">
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;left:-9999px;overflow:hidden">
    <defs>
      <symbol id="md-icon-menu" viewBox="0 0 24 24">
        <path d="M4 7h16"/>
        <path d="M4 12h16"/>
        <path d="M4 17h16"/>
      </symbol>
      <symbol id="md-icon-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2"/>
        <rect x="4" y="4" width="11" height="11" rx="2"/>
      </symbol>
    </defs>
  </svg>
  <main class="md-shell">
    <section class="md-surface-card md-card">
      <lht-page-menu home-href="../index.html" home-label="トップへ戻る"></lht-page-menu>

<h1 class="md-headline">
        <span aria-hidden="true" class="md-headline__icon">📊</span>
        <span>Mermaid → SVG 変換</span>
        <span class="md-tooltip-group">
          <span class="md-info-chip" tabindex="0" aria-label="このツールの説明">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
              <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
              <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
              <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
            </svg>
          </span>
          <span class="md-tooltip-content md-tooltip">Mermaidは、UML関連図（クラス図・シーケンス図など）やフローチャートをテキスト記法で記述し、図として可視化できる仕組みです。このツールはその記法からSVGを生成して保存できます。</span>
        </span>
      </h1>

      <section class="md-section">
        <div class="md-title-info-row">
          <h2 class="md-section-title">Mermaid入力</h2>
          <span class="md-tooltip-group">
            <span class="md-info-chip" tabindex="0" aria-label="入力説明">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
                <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
                <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
                <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
              </svg>
            </span>
            <span class="md-tooltip-content md-tooltip">`flowchart`, `sequenceDiagram`, `classDiagram` など Mermaid記法を入力し、[レンダリング] を押してください。</span>
          </span>
        </div>
        <div class="md-field-block">
          <lht-help-text-field
            field-id="mermaidInput"
            label="ソース"
            type="textarea"
            rows="12"
            required
            help-text="Mermaid記法を入力します。未完成の記法はレンダリングでエラーになります。"
          ></lht-help-text-field>
        </div>

        <div class="md-row">
          <lht-help-select
            field-id="themeSelect"
            label="テーマ"
            help-text="配色テーマを選択します。変更後は再レンダリングで反映されます。"
          >
            <script type="application/json" slot="options">
            [
              {
                "value": "default",
                "label": "default",
                "selected": true
              },
              {
                "value": "neutral",
                "label": "neutral"
              },
              {
                "value": "forest",
                "label": "forest"
              },
              {
                "value": "dark",
                "label": "dark"
              }
            ]
            </script>
</lht-help-select>
          <button id="renderBtn" class="md-button md-button--primary" type="button">レンダリング</button>
          <button id="downloadSvgBtn" class="md-button md-button--secondary" type="button" disabled>SVG保存</button>
        </div>
        <p id="errorText" class="md-error md-hidden" role="alert"></p>
      </section>

      <section class="md-section">
        <div class="md-title-info-row">
          <h2 class="md-section-title">プレビュー</h2>
          <span class="md-tooltip-group">
            <span class="md-info-chip" tabindex="0" aria-label="プレビュー説明">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
                <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
                <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
                <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
              </svg>
            </span>
            <span class="md-tooltip-content md-tooltip">生成されたSVGをその場で確認できます。</span>
          </span>
        </div>
        <div class="md-preview-wrap">
          <div id="svgPreview" class="md-preview-stage"></div>
        </div>
      </section>

      <section class="md-section">
        <div class="md-title-info-row">
          <h2 class="md-section-title">SVGテキスト</h2>
          <span class="md-tooltip-group">
            <span class="md-info-chip" tabindex="0" aria-label="SVGテキスト説明">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
                <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
                <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
                <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
              </svg>
            </span>
            <span class="md-tooltip-content md-tooltip">生成されたSVGの生テキストです。コピーして再利用できます。</span>
          </span>
        </div>
        <div class="md-code-block">
          <code id="svgText" class="md-code"></code>
          <button class="md-copy-button md-icon-btn md-icon-btn--small md-icon-btn--surface" aria-label="SVGをコピー" type="button" id="copySvgBtn">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="md-icon-20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <use href="#md-icon-copy" xlink:href="#md-icon-copy"></use>
            </svg>
          </button>
        </div>
      </section>
    </section>
  </main>

  <div id="toast" class="md-snackbar md-snackbar-host md-hidden" role="status" aria-live="polite"></div>

  <script src="src/mermaid-to-svg/js/main.js"></script>

</body>
</html>
