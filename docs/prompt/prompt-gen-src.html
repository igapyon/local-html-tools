<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロンプト作成支援</title>
  <link rel="stylesheet" href="../../lht-cmn/css/components.css">
  <link rel="stylesheet" href="src/prompt-gen/css/app.css">
  <script src="../../lht-cmn/vendor/material-web-outlined-text-field.bundle.js"></script>
  <script src="../../lht-cmn/js/components.js" defer></script>
</head>
<body class="md-page">
  <svg aria-hidden="true" class="md-icon-sprite" width="0" height="0" viewBox="0 0 0 0" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <symbol id="md-icon-menu" viewBox="0 0 24 24">
        <path d="M4 6h16"/>
        <path d="M4 12h16"/>
        <path d="M4 18h16"/>
      </symbol>
      <symbol id="md-icon-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2"/>
        <rect x="4" y="4" width="11" height="11" rx="2"/>
      </symbol>
    </defs>
  </svg>
  <div class="md-surface-card md-card">
    <lht-page-hero
      title="プロンプト作成支援"
      subtitle="定型的な生成AIプロンプトを作成支援します。"
      icon="📝"
      help-label="プロンプト作成支援の説明"
      help-wide
      menu-home-href="../index.html"
      menu-home-label="トップへ戻る">
      このツールは、生成AIに引き渡すためのプロンプト作成を支援します。<br><br>
      初版では、PR 文面、GitHub Release 文面、Markdown 出力指示、GitHub 操作禁止指示、ディレクトリ内容確認指示、会話引き継ぎ指示、仕様検討指示、軽量テスト追加指示、違和感や誤りの指摘優先指示、TODO 整理指示、実施状況確認指示、批判的レビュー指示、markdown 更新漏れ確認指示を作成依頼するための文面を生成します。
    </lht-page-hero>

    <section class="md-section md-stack-md">
      <div class="md-search-row">
        <lht-text-field-help
          field-id="promptSearch"
          label="やりたいこと"
          required
          placeholder="例: pr / release"
          help-text="やりたいことを短く入力します。初版では入力文字列が候補キーワードに部分一致したら各種プロンプト候補を表示します。">
        </lht-text-field-help>
      </div>

      <div id="promptCandidateArea" class="md-chip-row" aria-live="polite"></div>
    </section>

    <section id="commitInputSection" class="md-section md-stack-md md-hidden">
      <div class="md-form-grid md-form-grid-2">
        <lht-text-field-help
          field-id="commitId"
          label="コミットID"
          required
          placeholder="例: abc1234"
          help-text="PR 文面の作成対象にしたいコミット ID を入力します。短縮 SHA でも構いません。">
        </lht-text-field-help>
      </div>
    </section>

    <section id="promptOutputSection" class="md-section md-stack-md md-hidden">
      <p class="md-output-title">生成結果</p>
      <lht-command-block command-id="promptOutput"></lht-command-block>
      <lht-switch-help
        switch-id="includeLabelPrefix"
        label="ラベル名を先頭に含める"
        help-label="ラベル名を先頭に含める説明">
        ON の場合は `[ボタンラベル] 本文` の形式で出力します。OFF の場合は本文のみを出力します。
      </lht-switch-help>
    </section>

    <lht-toast id="toast"></lht-toast>
  </div>
  <script src="src/prompt-gen/js/prompt-definitions.js"></script>
  <script src="src/prompt-gen/js/main.js"></script>
</body>
</html>
