<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>パスワードジェネレーター</title>
  <style>
    :root {
      --md-sys-color-primary: #6200ee;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-surface: #ffffff;
      --md-sys-color-surface-variant: #f4f1f7;
      --md-sys-color-background: #f6f4f8;
      --md-sys-color-on-surface: #1c1b1f;
      --md-sys-color-on-surface-variant: #49454f;
      --md-sys-color-outline: #c8c5d0;
      --md-sys-color-shadow: rgba(0, 0, 0, 0.2);
      --md-state-layer: rgba(98, 0, 238, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: "Roboto", "Segoe UI", "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 1rem; line-height: 1.5; }
    a { text-decoration: none; color: inherit; }
    button { border: none; background: transparent; cursor: pointer; font: inherit; }

    .md-page { background-color: var(--md-sys-color-background); color: var(--md-sys-color-on-surface); padding: 24px; }
    .md-surface-card { max-width: 48rem; margin: 0 auto; padding: 24px; position: relative; }
    .md-card {
      background: var(--md-sys-color-surface);
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid #ece7f3;
    }

    .md-menu-button { position: absolute; top: 16px; right: 16px; }
    .md-menu-panel {
      position: absolute;
      top: 56px;
      right: 16px;
      background: var(--md-sys-color-surface);
      border: 1px solid #e6e1ee;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 4px 0;
      min-width: 160px;
      z-index: 20;
    }
    .md-menu-link { display: block; padding: 8px 16px; color: var(--md-sys-color-on-surface); }
    .md-menu-link:hover { background: #f2edf8; }

    .md-headline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding-right: 2.5rem;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
      font-weight: 700;
    }
    .md-headline__icon { margin-right: 0.5rem; }

    .md-section-title { font-size: 1rem; font-weight: 600; color: #3f3b46; margin-bottom: 0.75rem; }
    .md-grid { display: grid; gap: 0.75rem; }
    @media (min-width: 640px) {
      .md-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .md-label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--md-sys-color-on-surface); }

    .md-choice {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.25rem 0;
    }
    .md-switch-label {
      justify-content: flex-start;
      gap: 0.75rem;
    }
    .md-switch-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .md-switch {
      width: 44px;
      height: 24px;
      background: #f0ebf7;
      border-radius: 9999px;
      position: relative;
      box-shadow: inset 0 0 0 1px #cfc7dc;
      transition: background 150ms ease, box-shadow 150ms ease;
      flex-shrink: 0;
    }
    .md-switch::after {
      content: "";
      width: 20px;
      height: 20px;
      border-radius: 9999px;
      background: #ffffff;
      position: absolute;
      top: 2px;
      left: 2px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      transition: transform 150ms ease, background 150ms ease;
    }
    .md-switch-input:checked + .md-switch {
      background: rgba(98, 0, 238, 0.32);
      box-shadow: inset 0 0 0 1px rgba(98, 0, 238, 0.6);
    }
    .md-switch-input:checked + .md-switch::after {
      transform: translateX(20px);
      background: var(--md-sys-color-primary);
    }

    .md-input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 12px;
      border: 1px solid var(--md-sys-color-outline);
      background: var(--md-sys-color-surface);
      font-size: 1rem;
      color: var(--md-sys-color-on-surface);
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .md-input:focus {
      outline: none;
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 0 3px rgba(98, 0, 238, 0.2);
    }

    .md-button {
      padding: 0.65rem 1.25rem;
      border-radius: 9999px;
      font-weight: 600;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      box-shadow: 0 2px 6px rgba(98, 0, 238, 0.3);
      transition: box-shadow 150ms ease, transform 150ms ease;
    }
    .md-button:hover { box-shadow: 0 4px 10px rgba(98, 0, 238, 0.35); }

    .md-code-block { position: relative; margin-top: 0.5rem; }
    .md-code {
      display: block;
      padding: 0.75rem 2.75rem 0.75rem 0.75rem;
      border-radius: 12px;
      overflow-x: auto;
      white-space: pre;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background: var(--md-sys-color-surface-variant);
      border: 1px solid #e5e0ec;
      color: #1f1b2d;
      min-height: 2.75rem;
    }
    .md-copy-button { position: absolute; top: 0.5rem; right: 0.5rem; }

    .md-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f0edf5;
      color: #3f3b46;
      transition: background 150ms ease, box-shadow 150ms ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }
    .md-icon-btn:hover { background: #e6e1ee; }
    .md-icon-20 { width: 20px; height: 20px; }

    .md-tooltip-group { position: relative; display: inline-flex; align-items: center; }
    .md-tooltip-content {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 0.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease;
      z-index: 50;
      width: min(24rem, 90vw);
    }
    .md-tooltip-group:hover .md-tooltip-content { opacity: 1; }
    .md-tooltip {
      display: block;
      min-width: 12rem;
      background: #2b2831;
      color: #f7f4fb;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.8125rem;
      font-weight: 400;
      line-height: 1.5;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      white-space: normal;
      word-break: break-word;
    }
    .md-help-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 9999px;
      background: #f0edf5;
      color: #4a4458;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 0.25rem;
      cursor: help;
    }

    .md-note { display: flex; align-items: center; gap: 0.5rem; color: #6a6675; font-size: 0.875rem; margin-bottom: 1rem; }

    .md-snackbar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2b2831;
      color: #f7f4fb;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
      z-index: 80;
    }
    .md-snackbar.md-visible { opacity: 1; pointer-events: auto; }

    .hidden { display: none; }
  </style>
</head>
<body class="md-page">
  <div class="md-surface-card md-card">

    <button type="button" class="md-icon-btn md-menu-button" aria-label="メニュー" onclick="toggleMenu()">
      <svg aria-hidden="true" viewBox="0 0 24 24" class="md-icon-20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16"/>
        <path d="M4 12h16"/>
        <path d="M4 18h16"/>
      </svg>
    </button>
    <div id="menuPanel" class="md-menu-panel hidden">
      <a href="../index.html" class="md-menu-link">トップへ戻る</a>
    </div>

    <h1 class="md-headline">
      <span aria-hidden="true" class="md-headline__icon">🛡️</span>
      <span>パスワードジェネレーター</span>
      <span class="md-tooltip-group">
        <span class="md-help-chip">?</span>
        <span class="md-tooltip-content">
          <span class="md-tooltip">選択した文字種と文字数でパスワードを生成します。英大文字または英小文字は必須で、生成結果は英字から始まります。目視で認識しづらい文字は除外した設計になっています。</span>
        </span>
      </span>
    </h1>

    <h2 class="md-section-title">
      文字種選択
      <span class="md-tooltip-group">
        <span class="md-help-chip">?</span>
        <span class="md-tooltip-content">
          <span class="md-tooltip">英大文字または英小文字のいずれかがチェックされている必要があります。生成結果は英字から始まります。</span>
        </span>
      </span>
    </h2>
    <div class="md-grid md-grid-2" style="margin-bottom: 1rem;">
      <label class="md-choice md-switch-label">
        <input type="checkbox" id="useUpper" class="md-switch-input" checked>
        <span class="md-switch" aria-hidden="true"></span>
        <span class="md-switch-text">英大文字（A D E F H M N R T Y）</span>
      </label>
      <label class="md-choice md-switch-label">
        <input type="checkbox" id="useLower" class="md-switch-input" checked>
        <span class="md-switch" aria-hidden="true"></span>
        <span class="md-switch-text">英小文字（a d e f h m n r t y）</span>
      </label>
      <label class="md-choice md-switch-label">
        <input type="checkbox" id="useDigits" class="md-switch-input" checked>
        <span class="md-switch" aria-hidden="true"></span>
        <span class="md-switch-text">数字（0-9）</span>
      </label>
      <label class="md-choice md-switch-label">
        <input type="checkbox" id="useSymbols" class="md-switch-input" checked>
        <span class="md-switch" aria-hidden="true"></span>
        <span class="md-switch-text">記号（@ # $）</span>
      </label>
    </div>

    <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem;">
      <label class="md-label" for="lengthInput" style="margin-bottom: 0;">文字数</label>
      <input type="number" id="lengthInput" min="1" value="8" class="md-input" style="max-width: 10rem;">
    </div>

    <button onclick="generatePassword()" class="md-button" style="margin-bottom: 1rem;">
      パスワード生成
    </button>

    <div class="md-code-block">
      <code id="passwordOutput" class="md-code"></code>
      <button class="md-icon-btn md-copy-button" onclick="copyToClipboard('passwordOutput')" aria-label="コピー">📋</button>
    </div>

    <div id="toast" class="md-snackbar">
      コピーしました
    </div>
  </div>

  <script>
    const CHARSET = {
      upper: "ADEFHMNRTY",
      lower: "adefhmnrty",
      digits: "0123456789",
      symbols: "@#$"
    };

    function secureRandomInt(max) {
      const maxUint = 0xffffffff;
      const limit = Math.floor(maxUint / max) * max;
      const buffer = new Uint32Array(1);
      let value = 0;
      do {
        crypto.getRandomValues(buffer);
        value = buffer[0];
      } while (value >= limit);
      return value % max;
    }

    function pickAndRemove(arr) {
      const index = secureRandomInt(arr.length);
      return arr.splice(index, 1)[0];
    }

    function removeChar(arr, char) {
      const index = arr.indexOf(char);
      if (index !== -1) arr.splice(index, 1);
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = secureRandomInt(i + 1);
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function buildGroups() {
      return [
        { key: "upper", label: "英大文字", enabled: document.getElementById("useUpper").checked, chars: CHARSET.upper.split("") },
        { key: "lower", label: "英小文字", enabled: document.getElementById("useLower").checked, chars: CHARSET.lower.split("") },
        { key: "digits", label: "数字", enabled: document.getElementById("useDigits").checked, chars: CHARSET.digits.split("") },
        { key: "symbols", label: "記号", enabled: document.getElementById("useSymbols").checked, chars: CHARSET.symbols.split("") }
      ];
    }

    function generatePassword() {
      const length = Number(document.getElementById("lengthInput").value);
      if (!Number.isInteger(length) || length <= 0) {
        alert("文字数は1以上の整数で入力してください。");
        return;
      }

      const groups = buildGroups().filter(group => group.enabled);
      if (groups.length === 0) {
        alert("文字種を1つ以上選択してください。");
        return;
      }

      const letterGroups = groups.filter(group => group.key === "upper" || group.key === "lower");
      if (letterGroups.length === 0) {
        alert("英大文字または英小文字を選択してください。");
        return;
      }

      if (length < groups.length) {
        alert("選択した文字種の数より文字数が少ないため生成できません。");
        return;
      }

      const totalUnique = groups.reduce((sum, group) => sum + group.chars.length, 0);
      const allowDuplicates = length > totalUnique;

      const remainingByGroup = new Map();
      groups.forEach(group => {
        remainingByGroup.set(group.key, group.chars.slice());
      });
      const remainingAll = groups.flatMap(group => group.chars.slice());
      const allChars = groups.flatMap(group => group.chars.slice());

      const satisfied = new Set();
      const firstGroup = letterGroups[secureRandomInt(letterGroups.length)];
      const firstRemaining = remainingByGroup.get(firstGroup.key);
      let firstChar = "";
      if (firstRemaining.length > 0) {
        firstChar = pickAndRemove(firstRemaining);
        removeChar(remainingAll, firstChar);
      } else if (allowDuplicates) {
        firstChar = firstGroup.chars[secureRandomInt(firstGroup.chars.length)];
      } else {
        alert("英字の選択肢が不足しています。");
        return;
      }
      satisfied.add(firstGroup.key);

      const restChars = [];
      groups.forEach(group => {
        if (satisfied.has(group.key)) return;
        const remaining = remainingByGroup.get(group.key);
        if (remaining.length > 0) {
          const picked = pickAndRemove(remaining);
          removeChar(remainingAll, picked);
          restChars.push(picked);
        } else if (allowDuplicates) {
          restChars.push(group.chars[secureRandomInt(group.chars.length)]);
        } else {
          alert("選択した文字種の文字数が不足しています。");
          return;
        }
      });

      let remainingCount = length - 1 - restChars.length;
      while (remainingCount > 0) {
        if (remainingAll.length > 0) {
          restChars.push(pickAndRemove(remainingAll));
        } else if (allowDuplicates) {
          restChars.push(allChars[secureRandomInt(allChars.length)]);
        } else {
          break;
        }
        remainingCount--;
      }

      shuffleArray(restChars);
      document.getElementById("passwordOutput").textContent = firstChar + restChars.join("");
    }

    function copyToClipboard(id) {
      const text = document.getElementById(id).textContent;
      if (!text) return;
      const temp = document.createElement("textarea");
      temp.value = text;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
      showToast("コピーしました");
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("md-visible");
      setTimeout(() => {
        toast.classList.remove("md-visible");
      }, 2000);
    }

    function toggleMenu() {
      const panel = document.getElementById("menuPanel");
      if (!panel) return;
      panel.classList.toggle("hidden");
    }
  </script>
</body>
</html>
