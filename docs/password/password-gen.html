<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>パスワードジェネレーター</title>
  <style>
    /*
      ベンダリング（Vendoring）: このHTMLファイルは、かつてTailwind CSSをCDNから動的に読み込んでいましたが、
      完全なオフライン化のため、Tailwind CSS の CSS クラス定義を自前で実装しました。
      Tailwind CSS のライセンス情報は THIRD_PARTY_NOTICES.md を参照してください。
      外部CDNに依存せず、単一のHTMLファイルで完結して動作する設計が、このプロジェクトのコア機能です。
    */
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 1rem; line-height: 1.5; }
    button { border: none; cursor: pointer; }

    /* Colors */
    body { background-color: #f9fafb; color: #1f2937; }
    .bg-white { background-color: #ffffff; }
    .bg-gray-50 { background-color: #f9fafb; }
    .bg-gray-100 { background-color: #f3f4f6; }
    .bg-gray-200 { background-color: #e5e7eb; }
    .bg-gray-800 { background-color: #1f2937; }
    .bg-gray-900 { background-color: #111827; }
    .bg-green-600 { background-color: #16a34a; }
    .text-white { color: #ffffff; }
    .text-gray-600 { color: #4b5563; }
    .text-gray-700 { color: #374151; }
    .text-gray-800 { color: #1f2937; }
    .border-gray-200 { border-color: #e5e7eb; }
    .border-gray-300 { border-color: #d1d5db; }

    /* Layout */
    .flex { display: flex; }
    .inline-flex { display: inline-flex; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .flex-wrap { flex-wrap: wrap; }
    .grid { display: grid; }
    .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }
    .w-5 { width: 1.25rem; }
    .w-72 { width: 18rem; }
    .w-full { width: 100%; }
    .h-5 { height: 1.25rem; }
    .max-w-2xl { max-width: 42rem; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .p-2 { padding: 0.5rem; }
    .p-3 { padding: 0.75rem; }
    .p-6 { padding: 1.5rem; }
    .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .pr-10 { padding-right: 2.5rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mr-2 { margin-right: 0.5rem; }

    /* Typography */
    .text-base { font-size: 1rem; line-height: 1.5rem; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-2xl { font-size: 1.5rem; line-height: 2rem; }
    .leading-5 { line-height: 1.25rem; }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }
    .font-normal { font-weight: 400; }

    /* Box model */
    .block { display: block; }
    .hidden { display: none; }
    .rounded { border-radius: 0.375rem; }
    .rounded-lg { border-radius: 0.5rem; }
    .rounded-full { border-radius: 9999px; }
    .border { border-width: 1px; border-style: solid; }
    .shadow-md { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
    .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
    .overflow-x-auto { overflow-x: auto; }
    .whitespace-pre { white-space: pre; }

    /* Position */
    .relative { position: relative; }
    .absolute { position: absolute; }
    .fixed { position: fixed; }
    .top-2 { top: 0.5rem; }
    .top-4 { top: 1rem; }
    .top-12 { top: 3rem; }
    .top-full { top: 100%; }
    .right-2 { right: 0.5rem; }
    .right-4 { right: 1rem; }
    .right-5 { right: 1.25rem; }
    .bottom-5 { bottom: 1.25rem; }
    .left-1\/2 { left: 50%; }
    .-translate-x-1\/2 { transform: translateX(-50%); }

    /* Visibility */
    .opacity-0 { opacity: 0; }
    .pointer-events-none { pointer-events: none; }

    /* Transitions */
    .transition { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
    .transition-opacity { transition-property: opacity; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
    .duration-300 { transition-duration: 300ms; }

    /* Hover effects */
    .hover\:bg-gray-300:hover { background-color: #d1d5db; }
    .hover\:bg-green-700:hover { background-color: #15803d; }
    .hover\:bg-gray-100:hover { background-color: #f3f4f6; }
    button.hover\:bg-gray-300:hover { background-color: #d1d5db; }

    /* Group hover */
    .group:hover .group-hover\:opacity-100 { opacity: 1; }
    .group {}

    /* Input elements */
    input[type="checkbox"],
    input[type="radio"] {
      flex-shrink: 0;
      margin-top: 0;
      margin-left: 0;
      cursor: pointer;
      accent-color: #2563eb;
      align-self: center;
      vertical-align: middle;
    }

    /* Flex container with checkboxes */
    .flex > input[type="checkbox"],
    .flex > input[type="radio"] {
      margin-left: 0.75rem;
    }

    /* Links */
    a { text-decoration: none !important; }

    /* Responsive */
    @media (min-width: 640px) {
      .sm\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 p-6">
  <div class="max-w-2xl mx-auto bg-white shadow-md rounded-lg p-6 relative">

    <button type="button" class="absolute top-4 right-4 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-1 px-2 rounded" aria-label="メニュー" onclick="toggleMenu()">
      <svg aria-hidden="true" viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16"/>
        <path d="M4 12h16"/>
        <path d="M4 18h16"/>
      </svg>
    </button>
    <div id="menuPanel" class="absolute top-12 right-4 bg-white border border-gray-200 rounded shadow-md hidden">
      <a href="../index.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">トップへ戻る</a>
    </div>

    <h1 class="text-2xl font-bold mb-6 flex flex-wrap items-center gap-2">
      <span aria-hidden="true" class="mr-2">🛡️</span>
      <span>パスワードジェネレーター</span>
      <span class="relative inline-flex items-center group">
        <span class="inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-gray-600 bg-gray-200 rounded-full">?</span>
        <span class="absolute left-1/2 top-full mt-2 w-72 -translate-x-1/2 rounded-lg shadow-lg bg-gray-900 text-white text-xs leading-5 font-normal px-3 py-2 opacity-0 group-hover:opacity-100 transition pointer-events-none">
          選択した文字種と文字数でパスワードを生成します。英大文字または英小文字は必須で、生成結果は英字から始まります。目視で認識しづらい文字は除外した設計になっています。
        </span>
      </span>
    </h1>

    <h2 class="text-base font-semibold mb-2">文字種選択</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
      <label class="flex items-center gap-2">
        <input type="checkbox" id="useUpper" class="rounded border-gray-300" checked>
        <span>英大文字（A D E F H M N R T Y）</span>
      </label>
      <label class="flex items-center gap-2">
        <input type="checkbox" id="useLower" class="rounded border-gray-300" checked>
        <span>英小文字（a d e f h m n r t y）</span>
      </label>
      <label class="flex items-center gap-2">
        <input type="checkbox" id="useDigits" class="rounded border-gray-300" checked>
        <span>数字（0-9）</span>
      </label>
      <label class="flex items-center gap-2">
        <input type="checkbox" id="useSymbols" class="rounded border-gray-300" checked>
        <span>記号（@ # $）</span>
      </label>
    </div>
    <div class="flex flex-wrap items-center gap-2 text-sm text-gray-600 mb-4">
      <span>注意事項</span>
      <span class="relative inline-flex items-center group">
        <span class="inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-gray-600 bg-gray-200 rounded-full">?</span>
        <span class="absolute left-1/2 top-full mt-2 w-72 -translate-x-1/2 rounded-lg shadow-lg bg-gray-900 text-white text-xs leading-5 font-normal px-3 py-2 opacity-0 group-hover:opacity-100 transition pointer-events-none">
          英大文字または英小文字のいずれかがチェックされている必要があります。生成結果は英字から始まります。
        </span>
      </span>
    </div>

    <label class="block mb-2 font-semibold text-base">文字数:</label>
    <input type="number" id="lengthInput" min="1" value="8" class="border border-gray-300 rounded w-full p-2 mb-4">

    <button onclick="generatePassword()" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded mb-4">
      パスワード生成
    </button>

    <div class="relative">
      <code id="passwordOutput" class="bg-gray-100 p-3 block rounded overflow-x-auto whitespace-pre pr-10"></code>
      <button class="absolute top-2 right-2 bg-gray-200 px-2 py-1 rounded text-sm hover:bg-gray-300" onclick="copyToClipboard('passwordOutput')">📋</button>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-4 py-2 rounded shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none">
      コピーしました
    </div>
  </div>

  <script>
    const CHARSET = {
      upper: "ADEFHMNRTY",
      lower: "adefhmnrty",
      digits: "0123456789",
      symbols: "@#$"
    };

    function secureRandomInt(max) {
      const maxUint = 0xffffffff;
      const limit = Math.floor(maxUint / max) * max;
      const buffer = new Uint32Array(1);
      let value = 0;
      do {
        crypto.getRandomValues(buffer);
        value = buffer[0];
      } while (value >= limit);
      return value % max;
    }

    function pickAndRemove(arr) {
      const index = secureRandomInt(arr.length);
      return arr.splice(index, 1)[0];
    }

    function removeChar(arr, char) {
      const index = arr.indexOf(char);
      if (index !== -1) arr.splice(index, 1);
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = secureRandomInt(i + 1);
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function buildGroups() {
      return [
        { key: "upper", label: "英大文字", enabled: document.getElementById("useUpper").checked, chars: CHARSET.upper.split("") },
        { key: "lower", label: "英小文字", enabled: document.getElementById("useLower").checked, chars: CHARSET.lower.split("") },
        { key: "digits", label: "数字", enabled: document.getElementById("useDigits").checked, chars: CHARSET.digits.split("") },
        { key: "symbols", label: "記号", enabled: document.getElementById("useSymbols").checked, chars: CHARSET.symbols.split("") }
      ];
    }

    function generatePassword() {
      const length = Number(document.getElementById("lengthInput").value);
      if (!Number.isInteger(length) || length <= 0) {
        alert("文字数は1以上の整数で入力してください。");
        return;
      }

      const groups = buildGroups().filter(group => group.enabled);
      if (groups.length === 0) {
        alert("文字種を1つ以上選択してください。");
        return;
      }

      const letterGroups = groups.filter(group => group.key === "upper" || group.key === "lower");
      if (letterGroups.length === 0) {
        alert("英大文字または英小文字を選択してください。");
        return;
      }

      if (length < groups.length) {
        alert("選択した文字種の数より文字数が少ないため生成できません。");
        return;
      }

      const totalUnique = groups.reduce((sum, group) => sum + group.chars.length, 0);
      const allowDuplicates = length > totalUnique;

      const remainingByGroup = new Map();
      groups.forEach(group => {
        remainingByGroup.set(group.key, group.chars.slice());
      });
      const remainingAll = groups.flatMap(group => group.chars.slice());
      const allChars = groups.flatMap(group => group.chars.slice());

      const satisfied = new Set();
      const firstGroup = letterGroups[secureRandomInt(letterGroups.length)];
      const firstRemaining = remainingByGroup.get(firstGroup.key);
      let firstChar = "";
      if (firstRemaining.length > 0) {
        firstChar = pickAndRemove(firstRemaining);
        removeChar(remainingAll, firstChar);
      } else if (allowDuplicates) {
        firstChar = firstGroup.chars[secureRandomInt(firstGroup.chars.length)];
      } else {
        alert("英字の選択肢が不足しています。");
        return;
      }
      satisfied.add(firstGroup.key);

      const restChars = [];
      groups.forEach(group => {
        if (satisfied.has(group.key)) return;
        const remaining = remainingByGroup.get(group.key);
        if (remaining.length > 0) {
          const picked = pickAndRemove(remaining);
          removeChar(remainingAll, picked);
          restChars.push(picked);
        } else if (allowDuplicates) {
          restChars.push(group.chars[secureRandomInt(group.chars.length)]);
        } else {
          alert("選択した文字種の文字数が不足しています。");
          return;
        }
      });

      let remainingCount = length - 1 - restChars.length;
      while (remainingCount > 0) {
        if (remainingAll.length > 0) {
          restChars.push(pickAndRemove(remainingAll));
        } else if (allowDuplicates) {
          restChars.push(allChars[secureRandomInt(allChars.length)]);
        } else {
          break;
        }
        remainingCount--;
      }

      shuffleArray(restChars);
      document.getElementById("passwordOutput").textContent = firstChar + restChars.join("");
    }

    function copyToClipboard(id) {
      const text = document.getElementById(id).textContent;
      if (!text) return;
      const temp = document.createElement("textarea");
      temp.value = text;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
      showToast("コピーしました");
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.remove("opacity-0", "pointer-events-none");
      toast.classList.add("opacity-100");
      setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0", "pointer-events-none");
      }, 2000);
    }

    function toggleMenu() {
      const panel = document.getElementById("menuPanel");
      if (!panel) return;
      panel.classList.toggle("hidden");
    }
  </script>
</body>
</html>
