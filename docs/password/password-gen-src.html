<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>パスワードジェネレーター</title>
  <link rel="stylesheet" href="../../lht-cmn/css/components.css" />
  <link rel="stylesheet" href="src/password-gen/css/app.css" />
  <script src="../git/src/vendor/material-web-outlined-text-field.bundle.js"></script>
  <script src="../../lht-cmn/js/components.js" defer></script>
</head>
<body class="md-page">
  <svg aria-hidden="true" class="md-icon-sprite" width="0" height="0" viewBox="0 0 0 0" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <symbol id="md-icon-menu" viewBox="0 0 24 24">
        <path d="M4 6h16"/>
        <path d="M4 12h16"/>
        <path d="M4 18h16"/>
      </symbol>
      <symbol id="md-icon-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2"/>
        <rect x="4" y="4" width="11" height="11" rx="2"/>
      </symbol>
      <symbol id="md-icon-refresh" viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"/>
        <path d="M20 4v6h-6"/>
      </symbol>
    </defs>
  </svg>

  <div class="md-surface-card md-card">
    <lht-page-menu home-href="../index.html" home-label="トップへ戻る"></lht-page-menu>

    <h1 class="md-headline">
      <span aria-hidden="true" class="md-headline__icon">🛡️</span>
      <span>パスワードジェネレーター</span>
      <lht-help-tooltip label="パスワードジェネレーターの説明" wide>
        選択した文字種と文字数でパスワードを生成します。英大文字または英小文字は必須で、生成結果は英字から始まります。目視で認識しづらい文字は除外した設計になっています。
      </lht-help-tooltip>
    </h1>

    <h2 class="md-section-title">
      文字種選択
      <lht-help-tooltip label="文字種選択の説明" wide>
        英大文字または英小文字のいずれかがチェックされている必要があります。生成結果は英字から始まります。
      </lht-help-tooltip>
    </h2>

    <div class="md-grid md-grid-2" style="margin-bottom: 1rem;">
      <lht-switch-help switch-id="useUpper" label="英大文字（A D E F H M N R T Y）" checked></lht-switch-help>
      <lht-switch-help switch-id="useLower" label="英小文字（a d e f h m n r t y）" checked></lht-switch-help>
      <lht-switch-help switch-id="useDigits" label="数字（0-9）" checked></lht-switch-help>
      <lht-switch-help switch-id="useSymbols" label="記号（@ # $）" checked></lht-switch-help>
    </div>

    <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem;">
      <lht-text-field-help field-id="lengthInput" type="number" label="文字数" value="8" field-class="md-input--short"></lht-text-field-help>
    </div>

    <button type="button" onclick="generatePassword()" class="md-button">パスワード生成</button>
    <lht-command-block command-id="passwordOutput"></lht-command-block>

    <div id="toast" class="md-snackbar">コピーしました</div>
  </div>

  <script src="src/password-gen/js/main.js"></script>
</body>
</html>
