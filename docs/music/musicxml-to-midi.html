<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusicXML → MIDI 変換</title>
    
  <style>
:root {
      --md-danger: #b3261e;
      --md-sys-color-background: #f6f4f8;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-on-surface: #1c1b1f;
      --md-sys-color-on-surface-variant: #49454f;
      --md-sys-color-outline: #c8c5d0;
      --md-sys-color-primary: #6200ee;
      --md-sys-color-surface: #ffffff;
      --md-sys-color-surface-variant: #f4f1f7;
      --md-sys-color-tertiary-container: #f3e8fd;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif;
      background: var(--md-sys-color-background);
      color: var(--md-sys-color-on-surface);
    }

    .md-shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px;
    }

    .md-card {
      background: var(--md-sys-color-surface);
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid #ece7f3;
      padding: 24px;
      position: relative;
    }

    .md-headline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding-right: 2.5rem;
      margin: 0 0 1rem;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .md-headline__icon {
      margin-right: 0.4rem;
    }

    .md-section {
      margin-top: 1.2rem;
    }

    .md-section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0;
    }

    .md-title-info-row {
      display: inline-flex;
      align-items: center;
      gap: 0.1rem;
      margin-bottom: 0.75rem;
    }

    .md-label {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .md-required {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.15rem 0.4rem;
      border-radius: 999px;
      font-size: 0.54rem;
      font-weight: 600;
      background: #eceaf1;
      color: #49454f;
    }

    .md-textarea,
    .md-input,
    .md-file {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--md-sys-color-outline);
      background: var(--md-sys-color-surface);
      padding: 0.75rem;
      font-size: 0.95rem;
      color: var(--md-sys-color-on-surface);
      box-sizing: border-box;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .md-textarea {
      min-height: 15rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      line-height: 1.5;
    }

    .md-textarea--compact {
      min-height: 8rem;
    }

    .md-textarea:focus,
    .md-input:focus,
    .md-file:focus {
      outline: none;
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 0 3px rgba(98, 0, 238, 0.2);
    }

    .md-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.8rem;
    }

    .md-radio-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }

    .md-radio-option {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
    }

    .md-grid--defaults {
      margin-top: 0.8rem;
    }

    .md-disclosure {
      margin-bottom: 0.8rem;
      border: 1px solid #e5e0ec;
      border-radius: 12px;
      background: #faf8fc;
      padding: 0.7rem 0.85rem;
    }

    .md-disclosure-summary {
      cursor: pointer;
      font-weight: 600;
      color: #3d2e5a;
      list-style: none;
    }

    .md-disclosure-summary::-webkit-details-marker {
      display: none;
    }

    .md-disclosure-summary::before {
      content: "▸";
      display: inline-block;
      margin-right: 0.35rem;
      transition: transform 120ms ease;
    }

    .md-disclosure[open] .md-disclosure-summary::before {
      transform: rotate(90deg);
    }

    @media (min-width: 720px) {
      .md-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    .md-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 0.8rem;
    }

    .md-button {
      border-radius: 999px;
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: background 150ms ease;
      white-space: nowrap;
    }

    .md-button--primary {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      box-shadow: 0 3px 8px rgba(98, 0, 238, 0.28);
    }

    .md-button--primary:hover {
      background: #4f00c9;
    }

    .md-button--secondary {
      background: #e8f5f3;
      color: #15443e;
      box-shadow: 0 2px 6px rgba(3, 218, 198, 0.25);
    }

    .md-button:disabled {
      background: #e6e1ee;
      color: #9a94a7;
      cursor: not-allowed;
      box-shadow: none;
    }

    .md-preview {
      border: 1px solid #e5e0ec;
      border-radius: 12px;
      padding: 0.75rem;
      background: var(--md-sys-color-tertiary-container);
      font-size: 0.9rem;
      color: #3d2e5a;
      white-space: pre-wrap;
    }

    .md-code {
      display: block;
      padding: 0.75rem;
      border-radius: 12px;
      overflow-x: auto;
      white-space: pre;
      background: var(--md-sys-color-surface-variant);
      border: 1px solid #e5e0ec;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      min-height: 8rem;
    }

    .md-error {
      margin-top: 0.7rem;
      color: var(--md-danger);
      font-size: 0.92rem;
      white-space: pre-wrap;
    }

    .md-warning {
      margin-top: 0.7rem;
      color: #8a4f00;
      font-size: 0.9rem;
      white-space: pre-wrap;
      background: #fff3e0;
      border: 1px solid #ffcc80;
      border-radius: 10px;
      padding: 0.6rem 0.7rem;
    }

    .md-snackbar {
      position: fixed;
      left: 50%;
      bottom: 1.2rem;
      transform: translateX(-50%);
      background: #2b2831;
      color: #f7f4fb;
      padding: 0.65rem 0.95rem;
      border-radius: 999px;
      font-size: 0.86rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
      z-index: 120;
    }

    .md-visible {
      opacity: 1;
    }

    .md-hidden {
      display: none;
    }

    .md-menu-button {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 40px;
      height: 40px;
      border-radius: 20px;
      background: #f0edf5;
      border: none;
      cursor: pointer;
    }

    .md-menu-panel {
      position: absolute;
      top: 58px;
      right: 14px;
      background: #ffffff;
      border: 1px solid #ddd5ea;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      min-width: 160px;
      z-index: 100;
    }

    .md-menu-link {
      display: block;
      padding: 0.7rem 0.9rem;
      color: #342f3e;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .md-menu-link:hover {
      background: #f6f1fb;
    }

    .md-tooltip-group {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .md-info-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 9999px;
      background: transparent;
      color: #4a4458;
    }

    .md-info-icon {
      width: 18px;
      height: 18px;
    }

    .md-tooltip-content {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 0.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease;
      z-index: 50;
      width: 20rem;
      max-width: 90vw;
    }

    .md-tooltip-group:hover .md-tooltip-content,
    .md-tooltip-group:focus-within .md-tooltip-content {
      opacity: 1;
    }

    .md-tooltip {
      background: #2b2831;
      color: #f7f4fb;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.8125rem;
      line-height: 1.35;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <symbol id="md-icon-menu" viewBox="0 0 24 24">
        <path d="M4 7h16" />
        <path d="M4 12h16" />
        <path d="M4 17h16" />
      </symbol>
    </defs>
  </svg>

  <main class="md-shell">
    <section class="md-card">
      <button type="button" class="md-menu-button" aria-label="メニュー" onclick="toggleMenu()">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <use href="#md-icon-menu" xlink:href="#md-icon-menu"></use>
        </svg>
      </button>
      <div id="menuPanel" class="md-menu-panel md-hidden">
        <a href="../index.html" class="md-menu-link">トップへ戻る</a>
      </div>

      <h1 class="md-headline">
        <span aria-hidden="true" class="md-headline__icon">🥁</span>
        <span>MusicXML → MIDI 変換</span>
        <span class="md-tooltip-group">
          <span class="md-info-chip" tabindex="0" aria-label="このツールの説明">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
              <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
              <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
              <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
            </svg>
          </span>
          <span class="md-tooltip-content md-tooltip">MusicXMLをMIDIへ変換します。MVPとして先頭パートの単旋律を対象にし、MIDIを書き出します。</span>
        </span>
      </h1>

      <section class="md-section">
        <div class="md-title-info-row">
          <h2 class="md-section-title">MusicXML入力</h2>
          <span class="md-tooltip-group">
            <span class="md-info-chip" tabindex="0" aria-label="入力説明">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
                <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
                <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
                <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
              </svg>
            </span>
            <span class="md-tooltip-content md-tooltip">MusicXMLソースを入力するか `.musicxml` / `.xml` を読み込んでください。</span>
          </span>
        </div>

        <div class="md-radio-group" role="radiogroup" aria-label="入力方式">
          <label class="md-radio-option">
            <input id="inputModeFile" type="radio" name="inputMode" value="file" checked />
            <span>ファイル読込</span>
          </label>
          <label class="md-radio-option">
            <input id="inputModeSource" type="radio" name="inputMode" value="source" />
            <span>ソースコード入力</span>
          </label>
        </div>

        <div id="sourceInputBlock">
          <textarea id="xmlInput" class="md-textarea md-textarea--compact" rows="10" spellcheck="false"><?xml version="1.0" encoding="UTF-8"?>
<score-partwise version="3.1">
  <work><work-title>Simple Scale</work-title></work>
  <identification><creator type="composer">Unknown</creator></identification>
  <part-list>
    <score-part id="P1"><part-name>Music</part-name></score-part>
  </part-list>
  <part id="P1">
    <measure number="1">
      <attributes>
        <divisions>960</divisions>
        <key><fifths>0</fifths></key>
        <time><beats>4</beats><beat-type>4</beat-type></time>
      </attributes>
      <direction placement="above"><sound tempo="120"/></direction>
      <note><pitch><step>C</step><octave>4</octave></pitch><duration>960</duration><type>quarter</type></note>
      <note><pitch><step>D</step><octave>4</octave></pitch><duration>960</duration><type>quarter</type></note>
      <note><pitch><step>E</step><octave>4</octave></pitch><duration>960</duration><type>quarter</type></note>
      <note><rest/><duration>960</duration><type>quarter</type></note>
    </measure>
  </part>
</score-partwise></textarea>
        </div>

        <div id="fileInputBlock" class="md-hidden">
          <div class="md-actions">
            <button id="fileSelectBtn" class="md-button md-button--primary" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:0.35rem">
                <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <path d="M12 10v6" />
                <path d="M9.5 13.5 12 16l2.5-2.5" />
              </svg>
              <span>ファイルを選択</span>
            </button>
            <span id="fileNameText">未選択</span>
          </div>
          <input id="fileInput" class="md-file" type="file" accept=".musicxml,.xml,text/xml,application/xml" hidden />
        </div>
      </section>

      <section class="md-section">
        <div class="md-title-info-row">
          <h2 class="md-section-title">変換設定</h2>
          <span class="md-tooltip-group">
            <span class="md-info-chip" tabindex="0" aria-label="設定説明">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
                <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
                <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
                <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
              </svg>
            </span>
            <span class="md-tooltip-content md-tooltip">MusicXML内に値が無い場合の既定値です。テンポはBPMです。音色上書きを選ぶとMIDI Programを強制設定します。</span>
          </span>
        </div>

        <details class="md-disclosure">
          <summary class="md-disclosure-summary">詳細設定（既定タイトル / 既定作曲者 / 既定テンポ）</summary>
          <div class="md-grid md-grid--defaults">
            <div>
              <label class="md-label" for="defaultTitleInput">既定タイトル</label>
              <input id="defaultTitleInput" class="md-input" type="text" value="Untitled" />
            </div>
            <div>
              <label class="md-label" for="defaultComposerInput">既定作曲者</label>
              <input id="defaultComposerInput" class="md-input" type="text" value="Unknown" />
            </div>
            <div>
              <label class="md-label" for="defaultTempoInput">既定テンポ (BPM)</label>
              <input id="defaultTempoInput" class="md-input" type="number" min="20" max="300" step="1" value="120" />
            </div>
          </div>
        </details>
        <div class="md-grid">
          <div>
            <label class="md-label" for="instrumentOverrideSelect">音色上書き</label>
            <select id="instrumentOverrideSelect" class="md-input">
              <option value="">MusicXMLを使用</option>
              <option value="fm_piano_1">FM Piano 1 (Electric Piano 1)</option>
              <option value="fm_piano_2">FM Piano 2 (Electric Piano 2)</option>
            </select>
          </div>
          <div>
            <label class="md-label" for="synthWaveformSelect">内蔵シンセ波形</label>
            <select id="synthWaveformSelect" class="md-input">
              <option value="sine">sine (やわらかい音)</option>
              <option value="square">square (明るく硬い音)</option>
              <option value="triangle">triangle (中間の音)</option>
            </select>
          </div>
        </div>

        <div class="md-actions">
          <button id="convertBtn" class="md-button md-button--primary" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:0.35rem">
              <path d="M5 7h10" />
              <path d="M11 3l4 4-4 4" />
              <path d="M19 17H9" />
              <path d="M13 13l-4 4 4 4" />
            </svg>
            <span>変換</span>
          </button>
          <button id="downloadBtn" class="md-button md-button--secondary" type="button" disabled>
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:0.35rem">
              <path d="M12 4v9" />
              <path d="M8 10l4 4 4-4" />
              <path d="M5 18h14" />
            </svg>
            <span>MIDI保存</span>
          </button>
          <button id="playBtn" class="md-button md-button--secondary" type="button" disabled>
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="vertical-align:middle;margin-right:0.35rem">
              <path d="M8 5v14l11-7z" />
            </svg>
            <span>再生</span>
          </button>
          <button id="stopBtn" class="md-button md-button--secondary" type="button" disabled>
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="vertical-align:middle;margin-right:0.35rem">
              <rect x="7" y="7" width="10" height="10" rx="1.5"></rect>
            </svg>
            <span>停止</span>
          </button>
        </div>
        <p id="errorText" class="md-error md-hidden" role="alert"></p>
        <p id="warningText" class="md-warning md-hidden"></p>
      </section>

      <section class="md-section">
        <div class="md-title-info-row">
          <h2 class="md-section-title">簡易プレビュー</h2>
          <span class="md-tooltip-group">
            <span class="md-info-chip" tabindex="0" aria-label="プレビュー説明">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
                <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
                <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
                <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
              </svg>
            </span>
            <span class="md-tooltip-content md-tooltip">変換されたMIDIの要約情報です。</span>
          </span>
        </div>
        <div id="previewText" class="md-preview">未変換</div>
      </section>
    </section>
  </main>

  <div id="toast" class="md-snackbar md-hidden" role="status" aria-live="polite"></div>

                measureMaxTick = Math.max(measureMaxTick, cursorTick);
              }
            } else if (name === "backup") {
              const ticks = parseDurationTicks(child, divisions, measureNo, warnings, "backup");
              if (ticks > cursorTick) {
                warnings.push(
                  "part " + partName + " measure " + measureNo + ": backup が小節開始を越えるため補正しました。"
                );
                cursorTick = 0;
              } else {
                cursorTick -= ticks;
              }
            } else if (name === "forward") {
              const ticks = parseDurationTicks(child, divisions, measureNo, warnings, "forward");
              cursorTick += ticks;
              measureMaxTick = Math.max(measureMaxTick, cursorTick);
            }
          }

          if (measureMaxTick <= 0) {
            measureMaxTick = Math.max(
              1,
              Math.round((MIDI_TICKS_PER_QUARTER * 4 * meter.beats) / meter.beatType)
            );
          }
          timelineTick += measureMaxTick;
        }
      }

      if (noteCount === 0 && restCount === 0) {
        throw new Error("変換対象の note/rest が見つかりませんでした。");
      }

      return {
        meta: {
          title,
          composer,
          tempo,
          meter: globalMeter,
          partCount: partNodes.length,
          voiceCount: Object.keys(voiceTracksById).length,
          measureCount,
          noteCount,
          restCount
        },
        voiceTracksById,
        warnings,
        logLines
      };
    }

    function buildPartNameMap(root) {
      const map = {};
      const partList = firstDirectChild(root, "part-list");
      if (!partList) {
        return map;
      }
      for (const child of Array.from(partList.children)) {
        if (child.nodeName !== "score-part") {
          continue;
        }
        const id = child.getAttribute("id");
        if (!id) {
          continue;
        }
        const name = getChildText(child, "part-name");
        map[id] = name || id;
      }
      return map;
    }

    function buildPartPlaybackMap(root) {
      const map = {};
      const partList = firstDirectChild(root, "part-list");
      if (!partList) {
        return map;
      }
      for (const child of Array.from(partList.children)) {
        if (child.nodeName !== "score-part") {
          continue;
        }
        const id = child.getAttribute("id");
        if (!id) {
          continue;
        }
        const midiInstrument = firstDirectChild(child, "midi-instrument");
        if (!midiInstrument) {
          continue;
        }
        const channelText = getChildText(midiInstrument, "midi-channel");
        const programText = getChildText(midiInstrument, "midi-program");
        const channel = channelText ? Number.parseInt(channelText, 10) : null;
        // MusicXML midi-program is 1-based. midi-writer-js expects 0-based.
        const program = programText ? Number.parseInt(programText, 10) - 1 : null;
        map[id] = {
          channel: Number.isFinite(channel) ? channel : null,
          program: Number.isFinite(program) ? program : null
        };
      }
      return map;
    }

    function noteToEvent(noteNode, divisions, measureNo, warnings) {
      if (firstDirectChild(noteNode, "grace")) {
        warnings.push("measure " + measureNo + ": grace note はスキップしました。");
        return null;
      }
      if (firstDirectChild(noteNode, "chord")) {
        return { kind: "chord" };
      }

      const durationText = getChildText(noteNode, "duration");
      if (!durationText) {
        warnings.push("measure " + measureNo + ": duration が無い note をスキップしました。");
        return null;
      }
      const durationVal = Number.parseInt(durationText, 10);
      if (!Number.isFinite(durationVal) || durationVal <= 0) {
        warnings.push("measure " + measureNo + ": duration が不正な note をスキップしました。");
        return null;
      }

      const ticks = Math.max(1, Math.round((durationVal / divisions) * MIDI_TICKS_PER_QUARTER));
      const voice = getChildText(noteNode, "voice") || "1";
      if (firstDirectChild(noteNode, "rest")) {
        return { kind: "rest", ticks, voice };
      }

      const pitchNode = firstDirectChild(noteNode, "pitch");
      const step = getChildText(pitchNode, "step");
      const octaveText = getChildText(pitchNode, "octave");
      if (!step || !octaveText) {
        warnings.push("measure " + measureNo + ": pitch 情報が不完全な note をスキップしました。");
        return null;
      }
      const octave = Number.parseInt(octaveText, 10);
      if (!Number.isFinite(octave)) {
        warnings.push("measure " + measureNo + ": octave が不正な note をスキップしました。");
        return null;
      }

      const alterText = getChildText(pitchNode, "alter");
      const alter = alterText === "" ? 0 : Number.parseInt(alterText, 10);
      const tied = Boolean(firstDirectChild(noteNode, "tie") || firstDirectChild(firstDirectChild(noteNode, "notations"), "tied"));

      return {
        kind: "note",
        midiNumber: pitchToMidiNumber(step, Number.isFinite(alter) ? alter : 0, octave),
        ticks,
        voice,
        tied
      };
    }

    function parseDurationTicks(node, divisions, measureNo, warnings, elementName) {
      const durationText = getChildText(node, "duration");
      if (!durationText) {
        warnings.push("measure " + measureNo + ": " + elementName + " の duration が無いため 0 扱いにしました。");
        return 0;
      }
      const durationVal = Number.parseInt(durationText, 10);
      if (!Number.isFinite(durationVal) || durationVal < 0) {
        warnings.push("measure " + measureNo + ": " + elementName + " の duration が不正なため 0 扱いにしました。");
        return 0;
      }
      return Math.max(0, Math.round((durationVal / divisions) * MIDI_TICKS_PER_QUARTER));
    }

    function pitchToMidiNumber(step, alter, octave) {
      const s = String(step || "C").toUpperCase();
      const base = {
        C: 0,
        D: 2,
        E: 4,
        F: 5,
        G: 7,
        A: 9,
        B: 11
      };
      if (!Object.prototype.hasOwnProperty.call(base, s)) {
        return 60;
      }
      const semitone = base[s] + alter;
      return (octave + 1) * 12 + semitone;
    }

    function midiNumberToMidiWriterPitch(midiNumber) {
      const names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
      const n = Math.max(0, Math.min(127, Math.round(midiNumber)));
      const octave = Math.floor(n / 12) - 1;
      const note = names[n % 12];
      return note + String(octave);
    }

    function firstDirectChild(parent, tagName) {
      if (!parent) {
        return null;
      }
      for (const child of Array.from(parent.children)) {
        if (child.nodeName === tagName) {
          return child;
        }
      }
      return null;
    }

    function getChildText(parent, tagName) {
      const node = firstDirectChild(parent, tagName);
      return node ? node.textContent.trim() : "";
    }

    function textOrFallback(node, fallback) {
      if (!node) {
        return fallback;
      }
      const text = node.textContent ? node.textContent.trim() : "";
      return text || fallback;
    }

    function normalizeSource(rawText) {
      return musicXmlCommon.normalizeMusicXmlSource(rawText);
    }

    function clampTempo(value) {
      const num = Number.parseInt(String(value || ""), 10);
      if (!Number.isFinite(num)) {
        return 120;
      }
      return Math.min(300, Math.max(20, num));
    }

    function compareTrackIds(a, b) {
      const [aPart, aVoice] = String(a).split(":");
      const [bPart, bVoice] = String(b).split(":");
      if (aPart !== bPart) {
        return String(aPart).localeCompare(String(bPart));
      }
      const aNum = Number.parseInt(aVoice, 10);
      const bNum = Number.parseInt(bVoice, 10);
      const aIsNum = Number.isFinite(aNum);
      const bIsNum = Number.isFinite(bNum);
      if (aIsNum && bIsNum) {
        return aNum - bNum;
      }
      if (aIsNum) {
        return -1;
      }
      if (bIsNum) {
        return 1;
      }
      return String(aVoice).localeCompare(String(bVoice));
    }

    function parseInstrumentOverride(value) {
      if (value === "fm_piano_1") {
        return { key: value, program: 4 };
      }
      if (value === "fm_piano_2") {
        return { key: value, program: 5 };
      }
      return { key: "", program: null };
    }

    function resolveProgram(originalProgram, override) {
      if (override && Number.isFinite(override.program)) {
        return override.program;
      }
      return originalProgram;
    }

    function resolveChannel(originalChannel, override, trackIndex) {
      if (override && Number.isFinite(override.program)) {
        return defaultChannelForTrackIndex(trackIndex);
      }
      return normalizeMidiChannel(originalChannel, defaultChannelForPartIndex(trackIndex));
    }

    function instrumentOverrideLabel(override) {
      if (!override || !override.key) {
        return "MusicXML";
      }
      if (override.key === "fm_piano_1") {
        return "FM Piano 1";
      }
      if (override.key === "fm_piano_2") {
        return "FM Piano 2";
      }
      return "MusicXML";
    }

    function defaultChannelForPartIndex(partIndex) {
      const oneBased = (partIndex % 16) + 1;
      // Keep channel 10 free by default.
      if (oneBased === 10) {
        return 11;
      }
      return oneBased;
    }

    function defaultChannelForTrackIndex(trackIndex) {
      return defaultChannelForPartIndex(trackIndex);
    }

    function normalizeMidiChannel(channel, fallback) {
      if (Number.isFinite(channel) && channel >= 1 && channel <= 16) {
        return channel;
      }
      return fallback;
    }

    function normalizeMidiProgram(program) {
      if (!Number.isFinite(program)) {
        return null;
      }
      return Math.max(0, Math.min(127, Math.round(program)));
    }

    function buildSynthSchedule(tempo, voiceIds, voiceTracksById, instrumentOverride) {
      const events = [];
      for (let trackIndex = 0; trackIndex < voiceIds.length; trackIndex += 1) {
        const voiceId = voiceIds[trackIndex];
        const voiceTrack = voiceTracksById[voiceId];
        if (!voiceTrack || !Array.isArray(voiceTrack.events)) {
          continue;
        }
        const channel = resolveChannel(voiceTrack.channel, instrumentOverride, trackIndex);
        for (const event of voiceTrack.events) {
          if (!event || !Number.isFinite(event.midiNumber) || !Number.isFinite(event.start) || !Number.isFinite(event.ticks)) {
            continue;
          }
          events.push({
            midiNumber: Math.max(0, Math.min(127, Math.round(event.midiNumber))),
            start: Math.max(0, Math.round(event.start)),
            ticks: Math.max(1, Math.round(event.ticks)),
            channel
          });
        }
      }
      events.sort((a, b) => {
        if (a.start !== b.start) {
          return a.start - b.start;
        }
        return a.midiNumber - b.midiNumber;
      });
      return {
        tempo: clampTempo(tempo),
        events
      };
    }

    function resetOutput() {
      stopMidi(false);
      lastMidiBytes = null;
      lastSynthSchedule = null;
      previewText.textContent = "未変換";
      downloadBtn.disabled = true;
      playBtn.disabled = true;
      stopBtn.disabled = true;
    }

    function applyInputMode() {
      const sourceMode = inputModeSourceRadio.checked;
      sourceInputBlock.classList.toggle("md-hidden", !sourceMode);
      fileInputBlock.classList.toggle("md-hidden", sourceMode);
      if (sourceMode) {
        fileInput.value = "";
        updateFileName("");
      }
    }

    function downloadMidi() {
      if (!lastMidiBytes || lastMidiBytes.length === 0) {
        setError("先に変換してください。");
        return;
      }
      const blob = new Blob([lastMidiBytes], { type: "audio/midi" });
      downloadBlob(blob, "score.mid");
      showToast("MIDIを保存しました。");
    }

    function playMidi() {
      if (!lastSynthSchedule || lastSynthSchedule.events.length === 0) {
        setError("先に変換してください。");
        return;
      }
      const waveform = musicSynthCommon.normalizeWaveform(synthWaveformSelect.value);
      synthEngine.playSchedule(lastSynthSchedule, waveform, () => {
        stopBtn.disabled = true;
      }).then(() => {
        clearError();
        stopBtn.disabled = false;
        showToast("内蔵シンセ再生を開始しました。");
      }).catch((error) => {
        stopBtn.disabled = true;
        setError("内蔵シンセ再生に失敗しました: " + (error && error.message ? error.message : String(error)));
      });
    }

    function stopMidi(showMessage = true) {
      synthEngine.stop();
      stopBtn.disabled = true;
      if (showMessage) {
        showToast("内蔵シンセ再生を停止しました。");
      }
    }

    function setError(message) {
      errorText.textContent = message;
      errorText.classList.remove("md-hidden");
    }

    function clearError() {
      errorText.textContent = "";
      errorText.classList.add("md-hidden");
    }

    function clearWarning() {
      warningText.textContent = "";
      warningText.classList.add("md-hidden");
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove("md-hidden");
      toast.classList.add("md-visible");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toast.classList.remove("md-visible");
        toast.classList.add("md-hidden");
      }, 1400);
    }

    function toggleMenu() {
      menuPanel.classList.toggle("md-hidden");
    }

    function handleDocumentClick(event) {
      const menuButton = event.target.closest(".md-menu-button");
      if (menuButton) {
        return;
      }
      if (!event.target.closest("#menuPanel")) {
        menuPanel.classList.add("md-hidden");
      }
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function persistSettings() {
      const payload = {
        defaultTitle: defaultTitleInput.value,
        defaultComposer: defaultComposerInput.value,
        defaultTempo: defaultTempoInput.value,
        instrumentOverride: instrumentOverrideSelect.value,
        synthWaveform: synthWaveformSelect.value
      };
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(payload));
    }

    function restoreSettings() {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) {
        return;
      }
      try {
        const data = JSON.parse(raw);
        if (data && typeof data === "object") {
          if (typeof data.defaultTitle === "string") {
            defaultTitleInput.value = data.defaultTitle;
          }
          if (typeof data.defaultComposer === "string") {
            defaultComposerInput.value = data.defaultComposer;
          }
          if (typeof data.defaultTempo === "string" || typeof data.defaultTempo === "number") {
            defaultTempoInput.value = String(data.defaultTempo);
          }
          if (typeof data.instrumentOverride === "string") {
            instrumentOverrideSelect.value = data.instrumentOverride;
          }
          if (typeof data.synthWaveform === "string") {
            synthWaveformSelect.value = musicSynthCommon.normalizeWaveform(data.synthWaveform);
          }
        }
      } catch (_error) {
        // ignore broken localStorage
      }
    }
  </script>
</body>
</html>
