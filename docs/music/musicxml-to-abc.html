<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusicXML → ABC 変換</title>
    
  <style>
:root {
      --md-danger: #b3261e;
      --md-sys-color-background: #f6f4f8;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-on-surface: #1c1b1f;
      --md-sys-color-on-surface-variant: #49454f;
      --md-sys-color-outline: #c8c5d0;
      --md-sys-color-primary: #6200ee;
      --md-sys-color-surface: #ffffff;
      --md-sys-color-surface-variant: #f4f1f7;
      --md-sys-color-tertiary-container: #f3e8fd;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif;
      background: var(--md-sys-color-background);
      color: var(--md-sys-color-on-surface);
    }

    .md-shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px;
    }

    .md-card {
      background: var(--md-sys-color-surface);
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid #ece7f3;
      padding: 24px;
      position: relative;
    }

    .md-headline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding-right: 2.5rem;
      margin: 0 0 1rem;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .md-headline__icon {
      margin-right: 0.4rem;
    }

    .md-section {
      margin-top: 1.2rem;
    }

    .md-section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0;
    }

    .md-title-info-row {
      display: inline-flex;
      align-items: center;
      gap: 0.1rem;
      margin-bottom: 0.75rem;
    }

    .md-label {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .md-required {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.15rem 0.4rem;
      border-radius: 999px;
      font-size: 0.54rem;
      font-weight: 600;
      background: #eceaf1;
      color: #49454f;
    }

    .md-textarea,
    .md-input,
    .md-file,
    .md-select {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--md-sys-color-outline);
      background: var(--md-sys-color-surface);
      padding: 0.75rem;
      font-size: 0.95rem;
      color: var(--md-sys-color-on-surface);
      box-sizing: border-box;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .md-textarea {
      min-height: 15rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      line-height: 1.5;
    }

    .md-textarea:focus,
    .md-input:focus,
    .md-file:focus,
    .md-select:focus {
      outline: none;
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 0 3px rgba(98, 0, 238, 0.2);
    }

    .md-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.8rem;
    }

    @media (min-width: 720px) {
      .md-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    .md-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 0.8rem;
    }

    .md-button {
      border-radius: 999px;
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: background 150ms ease;
      white-space: nowrap;
    }

    .md-button--primary {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      box-shadow: 0 3px 8px rgba(98, 0, 238, 0.28);
    }

    .md-button--primary:hover {
      background: #4f00c9;
    }

    .md-button--secondary {
      background: #e8f5f3;
      color: #15443e;
      box-shadow: 0 2px 6px rgba(3, 218, 198, 0.25);
    }

    .md-button:disabled {
      background: #e6e1ee;
      color: #9a94a7;
      cursor: not-allowed;
      box-shadow: none;
    }

    .md-preview {
      border: 1px solid #e5e0ec;
      border-radius: 12px;
      padding: 0.75rem;
      background: var(--md-sys-color-tertiary-container);
      font-size: 0.9rem;
      color: #3d2e5a;
      white-space: pre-wrap;
    }

    .md-code-block {
      position: relative;
    }

    .md-code {
      display: block;
      padding: 0.75rem;
      padding-right: 2.5rem;
      border-radius: 12px;
      overflow-x: auto;
      white-space: pre;
      background: var(--md-sys-color-surface-variant);
      border: 1px solid #e5e0ec;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      min-height: 10rem;
    }

    .md-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f2fa;
      color: #3f3b46;
      border: none;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .md-copy-button {
      position: absolute;
      top: 0.4rem;
      right: 0.4rem;
    }

    .md-error {
      margin-top: 0.7rem;
      color: var(--md-danger);
      font-size: 0.92rem;
      white-space: pre-wrap;
    }

    .md-warning {
      margin-top: 0.7rem;
      color: #8a4f00;
      font-size: 0.9rem;
      white-space: pre-wrap;
      background: #fff3e0;
      border: 1px solid #ffcc80;
      border-radius: 10px;
      padding: 0.6rem 0.7rem;
    }

    .md-snackbar {
      position: fixed;
      left: 50%;
      bottom: 1.2rem;
      transform: translateX(-50%);
      background: #2b2831;
      color: #f7f4fb;
      padding: 0.65rem 0.95rem;
      border-radius: 999px;
      font-size: 0.86rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
      z-index: 120;
    }

    .md-visible {
      opacity: 1;
    }

    .md-hidden {
      display: none;
    }

    .md-menu-button {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 40px;
      height: 40px;
      border-radius: 20px;
      background: #f0edf5;
      border: none;
      cursor: pointer;
    }

    .md-menu-panel {
      position: absolute;
      top: 58px;
      right: 14px;
      background: #ffffff;
      border: 1px solid #ddd5ea;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      min-width: 160px;
      z-index: 100;
    }

    .md-menu-link {
      display: block;
      padding: 0.7rem 0.9rem;
      color: #342f3e;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .md-menu-link:hover {
      background: #f6f1fb;
    }

    .md-tooltip-group {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .md-info-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 9999px;
      background: transparent;
      color: #4a4458;
    }

    .md-info-icon {
      width: 18px;
      height: 18px;
    }

    .md-tooltip-content {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 0.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease;
      z-index: 50;
      width: 20rem;
      max-width: 90vw;
    }

    .md-tooltip-group:hover .md-tooltip-content,
    .md-tooltip-group:focus-within .md-tooltip-content {
      opacity: 1;
    }

    .md-tooltip {
      background: #2b2831;
      color: #f7f4fb;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.8125rem;
      line-height: 1.35;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <symbol id="md-icon-menu" viewBox="0 0 24 24">
        <path d="M4 7h16" />
        <path d="M4 12h16" />
        <path d="M4 17h16" />
      </symbol>
      <symbol id="md-icon-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2" />
        <rect x="4" y="4" width="11" height="11" rx="2" />
      </symbol>
    </defs>
  </svg>

  <main class="md-shell">
    <section class="md-card">
      <button type="button" class="md-menu-button" aria-label="メニュー" onclick="toggleMenu()">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <use href="#md-icon-menu" xlink:href="#md-icon-menu"></use>
        </svg>
      </button>
      <div id="menuPanel" class="md-menu-panel md-hidden">
        <a href="../index.html" class="md-menu-link">トップへ戻る</a>
      </div>

      <h1 class="md-headline">
        <span aria-hidden="true" class="md-headline__icon">🎼</span>
        <span>MusicXML → ABC 変換</span>
        <span class="md-tooltip-group">
          <span class="md-info-chip" tabindex="0" aria-label="このツールの説明">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
              <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
              <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
              <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
            </svg>
          </span>
          <span class="md-tooltip-content md-tooltip">MusicXMLをABC記法へ変換します。MVPとして単旋律と基本ヘッダ（T/M/L/K/C）を対象にしています。</span>
        </span>
      </h1>

      <section class="md-section">
        <div class="md-title-info-row">
          <h2 class="md-section-title">MusicXML入力</h2>
          <span class="md-tooltip-group">
            <span class="md-info-chip" tabindex="0" aria-label="入力説明">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
                <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
                <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
                <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
              </svg>
            </span>
            <span class="md-tooltip-content md-tooltip">MusicXMLソースを入力するか `.musicxml` / `.xml` を読み込んでください。</span>
          </span>
        </div>

        <label class="md-label" for="xmlInput">
          ソース<span class="md-required">Required</span>
        </label>
        <textarea id="xmlInput" class="md-textarea" spellcheck="false"><?xml version="1.0" encoding="UTF-8"?>
<score-partwise version="3.1">
  <work><work-title>Simple Scale</work-title></work>
  <identification><creator type="composer">Unknown</creator></identification>
  <part-list>
    <score-part id="P1"><part-name>Music</part-name></score-part>
  </part-list>
  <part id="P1">
    <measure number="1">
      <attributes>
        <divisions>960</divisions>
        <key><fifths>0</fifths></key>
        <time><beats>4</beats><beat-type>4</beat-type></time>
        <clef><sign>G</sign><line>2</line></clef>
      </attributes>
      <note><pitch><step>C</step><octave>4</octave></pitch><duration>960</duration><type>quarter</type></note>
      <note><pitch><step>D</step><octave>4</octave></pitch><duration>960</duration><type>quarter</type></note>
      <note><pitch><step>E</step><octave>4</octave></pitch><duration>960</duration><type>quarter</type></note>
      <note><pitch><step>F</step><octave>4</octave></pitch><duration>960</duration><type>quarter</type></note>
    </measure>
  </part>
</score-partwise></textarea>

        <label class="md-label" for="fileInput">ファイル読込</label>
        <input id="fileInput" class="md-file" type="file" accept=".musicxml,.xml,text/xml,application/xml" />
      </section>

      <section class="md-section">
        <div class="md-title-info-row">
          <h2 class="md-section-title">変換設定</h2>
          <span class="md-tooltip-group">
            <span class="md-info-chip" tabindex="0" aria-label="設定説明">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
                <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
                <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
                <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
              </svg>
            </span>
            <span class="md-tooltip-content md-tooltip">MusicXML内に値が無い場合の既定値を指定します。L はABC出力の基本音価です。</span>
          </span>
        </div>

        <div class="md-grid">
          <div>
            <label class="md-label" for="defaultTitleInput">既定タイトル</label>
            <input id="defaultTitleInput" class="md-input" type="text" value="Untitled" />
          </div>
          <div>
            <label class="md-label" for="defaultComposerInput">既定作曲者</label>
            <input id="defaultComposerInput" class="md-input" type="text" value="Unknown" />
          </div>
          <div>
            <label class="md-label" for="defaultLengthSelect">既定音価 (L:)</label>
            <select id="defaultLengthSelect" class="md-select">
              <option value="1/16">1/16</option>
              <option value="1/8" selected>1/8</option>
              <option value="1/4">1/4</option>
            </select>
          </div>
        </div>

        <div class="md-actions">
          <button id="convertBtn" class="md-button md-button--primary" type="button">変換</button>
          <button id="downloadBtn" class="md-button md-button--secondary" type="button" disabled>ABC保存</button>
        </div>
        <p id="errorText" class="md-error md-hidden" role="alert"></p>
        <p id="warningText" class="md-warning md-hidden"></p>
      </section>

      <section class="md-section">
        <div class="md-title-info-row">
          <h2 class="md-section-title">簡易プレビュー</h2>
          <span class="md-tooltip-group">
            <span class="md-info-chip" tabindex="0" aria-label="プレビュー説明">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
                <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
                <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
                <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
              </svg>
            </span>
            <span class="md-tooltip-content md-tooltip">生成したABCの要約情報です。詳細は下のABCテキストで確認してください。</span>
          </span>
        </div>
        <div id="previewText" class="md-preview">未変換</div>
      </section>

      <section class="md-section">
        <div class="md-title-info-row">
          <h2 class="md-section-title">ABCテキスト</h2>
          <span class="md-tooltip-group">
            <span class="md-info-chip" tabindex="0" aria-label="ABC説明">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
                <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
                <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
                <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
              </svg>
            </span>
            <span class="md-tooltip-content md-tooltip">生成されたABC記法です。コピー・保存して他ツールへ連携できます。</span>
          </span>
        </div>
        <div class="md-code-block">
          <code id="abcOutput" class="md-code"></code>
          <button class="md-copy-button md-icon-btn" aria-label="ABCをコピー" type="button" id="copyBtn">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <use href="#md-icon-copy" xlink:href="#md-icon-copy"></use>
            </svg>
          </button>
        </div>
      </section>
    </section>
  </main>

  <div id="toast" class="md-snackbar md-hidden" role="status" aria-live="polite"></div>

    
  <script>
const xmlInput = document.getElementById("xmlInput");
    const fileInput = document.getElementById("fileInput");
    const defaultTitleInput = document.getElementById("defaultTitleInput");
    const defaultComposerInput = document.getElementById("defaultComposerInput");
    const defaultLengthSelect = document.getElementById("defaultLengthSelect");
    const convertBtn = document.getElementById("convertBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const copyBtn = document.getElementById("copyBtn");
    const previewText = document.getElementById("previewText");
    const abcOutput = document.getElementById("abcOutput");
    const errorText = document.getElementById("errorText");
    const warningText = document.getElementById("warningText");
    const toast = document.getElementById("toast");
    const menuPanel = document.getElementById("menuPanel");

    const SETTINGS_KEY = "musicxml-to-abc-settings";

    let lastAbc = "";

    restoreSettings();

    convertBtn.addEventListener("click", convertMusicXml);
    downloadBtn.addEventListener("click", downloadAbc);
    copyBtn.addEventListener("click", copyAbc);
    fileInput.addEventListener("change", loadXmlFile);
    defaultTitleInput.addEventListener("change", persistSettings);
    defaultComposerInput.addEventListener("change", persistSettings);
    defaultLengthSelect.addEventListener("change", persistSettings);
    document.addEventListener("click", handleDocumentClick);

    convertMusicXml();

    function loadXmlFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) {
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        xmlInput.value = String(reader.result || "");
        showToast("MusicXMLを読み込みました。");
      };
      reader.onerror = () => {
        setError("ファイルの読み込みに失敗しました。");
      };
      reader.readAsText(file, "utf-8");
    }

    function convertMusicXml() {
      const source = normalizeSource(xmlInput.value);
      if (!source) {
        setError("MusicXMLソースを入力してください。");
        resetOutput();
        return;
      }

      clearError();
      clearWarning();

      try {
        const result = parseMusicXml(source, {
          defaultTitle: defaultTitleInput.value.trim() || "Untitled",
          defaultComposer: defaultComposerInput.value.trim() || "Unknown",
          defaultLength: parseFraction(defaultLengthSelect.value)
        });

        lastAbc = result.abc;
        abcOutput.textContent = result.abc;
        previewText.textContent = [
          "title: " + result.meta.title,
          "composer: " + result.meta.composer,
          "meter: " + result.meta.meter,
          "unit length: " + result.meta.defaultLengthText,
          "key: " + result.meta.key,
          "measures: " + result.meta.measureCount,
          "notes/rests: " + result.meta.noteCount
        ].join("\n");

        downloadBtn.disabled = false;

        if (result.warnings.length > 0) {
          warningText.textContent = "警告:\n" + result.warnings.join("\n");
          warningText.classList.remove("md-hidden");
        }

        showToast("ABCを生成しました。");
      } catch (error) {
        resetOutput();
        const message = error && error.message ? error.message : String(error);
        setError("変換に失敗しました: " + message);
      }
    }

    function parseMusicXml(source, settings) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(source, "application/xml");
      const parseErr = xmlDoc.querySelector("parsererror");
      if (parseErr) {
        throw new Error("XMLの構文解釈に失敗しました。");
      }

      const root = xmlDoc.documentElement;
      if (!root || root.nodeName !== "score-partwise") {
        throw new Error("score-partwise 形式のMusicXMLに対応しています。");
      }

      const warnings = [];
      const part = root.querySelector("part");
      if (!part) {
        throw new Error("part が見つかりません。");
      }

      const title = textOrFallback(
        root.querySelector("work > work-title") || root.querySelector("movement-title"),
        settings.defaultTitle
      );
      const composer = textOrFallback(
        root.querySelector('identification > creator[type="composer"]') || root.querySelector("identification > creator"),
        settings.defaultComposer
      );

      let divisions = 1;
      let meter = { beats: 4, beatType: 4 };
      let key = "C";
      let noteCount = 0;
      const measures = [];

      const measureNodes = Array.from(part.children).filter((node) => node.nodeType === 1 && node.nodeName === "measure");
      if (measureNodes.length === 0) {
        throw new Error("measure が見つかりません。");
      }

      let warnedBackup = false;
      let warnedForward = false;
      let warnedChord = false;
      let warnedTie = false;

      for (const measureNode of measureNodes) {
        const measureNo = measureNode.getAttribute("number") || String(measures.length + 1);
        const attrNode = measureNode.querySelector(":scope > attributes");
        if (attrNode) {
          const divText = getChildText(attrNode, "divisions");
          if (divText) {
            const divVal = Number.parseInt(divText, 10);
            if (Number.isFinite(divVal) && divVal > 0) {
              divisions = divVal;
            }
          }

          const beatsText = getChildText(attrNode.querySelector("time"), "beats");
          const beatTypeText = getChildText(attrNode.querySelector("time"), "beat-type");
          if (beatsText && beatTypeText) {
            const beatsVal = Number.parseInt(beatsText, 10);
            const beatTypeVal = Number.parseInt(beatTypeText, 10);
            if (beatsVal > 0 && beatTypeVal > 0) {
              meter = { beats: beatsVal, beatType: beatTypeVal };
            }
          }

          const fifthsText = getChildText(attrNode.querySelector("key"), "fifths");
          const modeText = getChildText(attrNode.querySelector("key"), "mode") || "major";
          if (fifthsText !== "") {
            const fifthsVal = Number.parseInt(fifthsText, 10);
            if (Number.isFinite(fifthsVal)) {
              key = keyFromFifths(fifthsVal, modeText);
            }
          }
        }

        const tokens = [];

        for (const child of Array.from(measureNode.children)) {
          const name = child.nodeName;
          if (name === "note") {
            const noteToken = noteToAbc(child, divisions, settings.defaultLength, warnings, measureNo);
            if (noteToken.skipped) {
              if (noteToken.reason === "chord" && !warnedChord) {
                warnings.push("和音（<chord/>）は先頭音のみ扱います。");
                warnedChord = true;
              }
              continue;
            }
            tokens.push(noteToken.token);
            if (noteToken.reason === "tie" && !warnedTie) {
              warnings.push("タイ/スラーは出力していません。");
              warnedTie = true;
            }
            noteCount += 1;
          } else if (name === "backup") {
            if (!warnedBackup) {
              warnings.push("backup 要素（複数声部）はMVPでは非対応です。");
              warnedBackup = true;
            }
          } else if (name === "forward") {
            if (!warnedForward) {
              warnings.push("forward 要素（複数声部）はMVPでは非対応です。");
              warnedForward = true;
            }
          }
        }

        if (tokens.length === 0) {
          tokens.push("z");
          warnings.push("measure " + measureNo + ": 要素が空のため休符 z を補完しました。");
        }

        measures.push(tokens.join(" "));
      }

      if (noteCount === 0) {
        throw new Error("変換対象の note/rest が見つかりませんでした。");
      }

      const meterText = meter.beats + "/" + meter.beatType;
      const defaultLengthText = settings.defaultLength.num + "/" + settings.defaultLength.den;
      const body = measures.join(" | ") + " |";
      const abcLines = [
        "X:1",
        "T:" + title,
        "C:" + composer,
        "M:" + meterText,
        "L:" + defaultLengthText,
        "K:" + key,
        body
      ];

      return {
        abc: abcLines.join("\n"),
        meta: {
          title,
          composer,
          meter: meterText,
          defaultLengthText,
          key,
          measureCount: measures.length,
          noteCount
        },
        warnings
      };
    }

    function noteToAbc(noteNode, divisions, defaultLength, warnings, measureNo) {
      if (noteNode.querySelector(":scope > grace")) {
        warnings.push("measure " + measureNo + ": grace note はスキップしました。");
        return { skipped: true, reason: "grace" };
      }
      if (noteNode.querySelector(":scope > chord")) {
        return { skipped: true, reason: "chord" };
      }

      const durationText = getChildText(noteNode, "duration");
      if (!durationText) {
        warnings.push("measure " + measureNo + ": duration が無い note をスキップしました。");
        return { skipped: true, reason: "duration" };
      }
      const durationVal = Number.parseInt(durationText, 10);
      if (!Number.isFinite(durationVal) || durationVal <= 0) {
        warnings.push("measure " + measureNo + ": duration が不正な note をスキップしました。");
        return { skipped: true, reason: "duration" };
      }

      const ratio = divideFractions(reduceFraction(durationVal, divisions * 4), defaultLength);
      const lengthToken = abcLengthToken(ratio);

      if (noteNode.querySelector(":scope > rest")) {
        return { skipped: false, token: "z" + lengthToken };
      }

      const step = getChildText(noteNode.querySelector(":scope > pitch"), "step");
      const octaveText = getChildText(noteNode.querySelector(":scope > pitch"), "octave");
      if (!step || !octaveText) {
        warnings.push("measure " + measureNo + ": pitch 情報が不完全な note をスキップしました。");
        return { skipped: true, reason: "pitch" };
      }

      const octave = Number.parseInt(octaveText, 10);
      if (!Number.isFinite(octave)) {
        warnings.push("measure " + measureNo + ": octave が不正な note をスキップしました。");
        return { skipped: true, reason: "octave" };
      }

      const alterText = getChildText(noteNode.querySelector(":scope > pitch"), "alter");
      const alter = alterText === "" ? 0 : Number.parseInt(alterText, 10);
      const accidental = accidentalFromAlter(Number.isFinite(alter) ? alter : 0);

      if (noteNode.querySelector(":scope > tie") || noteNode.querySelector(":scope > notations > tied")) {
        return {
          skipped: false,
          reason: "tie",
          token: accidental + abcPitch(step, octave) + lengthToken
        };
      }

      return {
        skipped: false,
        token: accidental + abcPitch(step, octave) + lengthToken
      };
    }

    function abcPitch(step, octave) {
      const upperStep = step.toUpperCase();
      if (!/^[A-G]$/.test(upperStep)) {
        return "C";
      }

      if (octave >= 5) {
        return upperStep.toLowerCase() + "'".repeat(octave - 5);
      }
      return upperStep + ",".repeat(Math.max(0, 4 - octave));
    }

    function accidentalFromAlter(alter) {
      if (alter === 0) {
        return "";
      }
      if (alter > 0) {
        return "^".repeat(Math.min(2, alter));
      }
      return "_".repeat(Math.min(2, Math.abs(alter)));
    }

    function abcLengthToken(ratio) {
      const reduced = reduceFraction(ratio.num, ratio.den);
      if (reduced.num === reduced.den) {
        return "";
      }
      if (reduced.den === 1) {
        return String(reduced.num);
      }
      if (reduced.num === 1 && reduced.den === 2) {
        return "/";
      }
      if (reduced.num === 1) {
        return "/" + reduced.den;
      }
      return reduced.num + "/" + reduced.den;
    }

    function keyFromFifths(fifths, mode) {
      const major = ["Cb", "Gb", "Db", "Ab", "Eb", "Bb", "F", "C", "G", "D", "A", "E", "B", "F#", "C#"];
      const minor = ["Abm", "Ebm", "Bbm", "Fm", "Cm", "Gm", "Dm", "Am", "Em", "Bm", "F#m", "C#m", "G#m", "D#m", "A#m"];
      const idx = fifths + 7;
      if (idx < 0 || idx >= major.length) {
        return "C";
      }
      const lowerMode = String(mode || "").toLowerCase();
      if (lowerMode === "minor") {
        return minor[idx];
      }
      return major[idx];
    }

    function getChildText(parent, tagName) {
      if (!parent) {
        return "";
      }
      const node = parent.querySelector(":scope > " + tagName);
      return node ? node.textContent.trim() : "";
    }

    function textOrFallback(node, fallback) {
      if (!node) {
        return fallback;
      }
      const text = node.textContent ? node.textContent.trim() : "";
      return text || fallback;
    }

    function parseFraction(text) {
      const m = String(text || "").match(/^\s*(\d+)\/(\d+)\s*$/);
      if (!m) {
        return { num: 1, den: 8 };
      }
      const num = Number.parseInt(m[1], 10);
      const den = Number.parseInt(m[2], 10);
      if (!num || !den) {
        return { num: 1, den: 8 };
      }
      return reduceFraction(num, den);
    }

    function divideFractions(a, b) {
      return reduceFraction(a.num * b.den, a.den * b.num);
    }

    function reduceFraction(num, den) {
      if (!Number.isFinite(num) || !Number.isFinite(den) || den === 0) {
        return { num: 1, den: 1 };
      }
      const sign = den < 0 ? -1 : 1;
      const n = num * sign;
      const d = den * sign;
      const g = gcd(Math.abs(n), Math.abs(d));
      return { num: n / g, den: d / g };
    }

    function gcd(a, b) {
      let x = a || 1;
      let y = b || 1;
      while (y !== 0) {
        const t = x % y;
        x = y;
        y = t;
      }
      return x || 1;
    }

    function normalizeSource(rawText) {
      if (!rawText) {
        return "";
      }

      const lines = rawText.split("\n");
      let first = 0;
      let last = lines.length - 1;

      while (first <= last && lines[first].trim() === "") {
        first += 1;
      }
      while (last >= first && lines[last].trim() === "") {
        last -= 1;
      }
      if (first > last) {
        return "";
      }

      const firstLine = lines[first].trim();
      const lastLine = lines[last].trim();
      const hasCodeFencePair = /^```.*$/.test(firstLine) && /^```\s*$/.test(lastLine);
      if (hasCodeFencePair) {
        return lines.slice(first + 1, last).join("\n").trim();
      }

      return lines.slice(first, last + 1).join("\n").trim();
    }

    function resetOutput() {
      lastAbc = "";
      abcOutput.textContent = "";
      previewText.textContent = "未変換";
      downloadBtn.disabled = true;
    }

    function downloadAbc() {
      if (!lastAbc) {
        setError("先に変換してください。");
        return;
      }
      const blob = new Blob([lastAbc], { type: "text/plain;charset=utf-8" });
      downloadBlob(blob, "score.abc");
      showToast("ABCを保存しました。");
    }

    function copyAbc() {
      if (!lastAbc) {
        setError("先に変換してください。");
        return;
      }
      navigator.clipboard.writeText(lastAbc).then(() => {
        clearError();
        showToast("ABCをコピーしました。");
      }).catch((error) => {
        setError("コピーに失敗しました: " + (error && error.message ? error.message : String(error)));
      });
    }

    function setError(message) {
      errorText.textContent = message;
      errorText.classList.remove("md-hidden");
    }

    function clearError() {
      errorText.textContent = "";
      errorText.classList.add("md-hidden");
    }

    function clearWarning() {
      warningText.textContent = "";
      warningText.classList.add("md-hidden");
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove("md-hidden");
      toast.classList.add("md-visible");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toast.classList.remove("md-visible");
        toast.classList.add("md-hidden");
      }, 1400);
    }

    function toggleMenu() {
      menuPanel.classList.toggle("md-hidden");
    }

    function handleDocumentClick(event) {
      const menuButton = event.target.closest(".md-menu-button");
      if (menuButton) {
        return;
      }
      if (!event.target.closest("#menuPanel")) {
        menuPanel.classList.add("md-hidden");
      }
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function persistSettings() {
      const payload = {
        defaultTitle: defaultTitleInput.value,
        defaultComposer: defaultComposerInput.value,
        defaultLength: defaultLengthSelect.value
      };
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(payload));
    }

    function restoreSettings() {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) {
        return;
      }
      try {
        const data = JSON.parse(raw);
        if (data && typeof data === "object") {
          if (typeof data.defaultTitle === "string") {
            defaultTitleInput.value = data.defaultTitle;
          }
          if (typeof data.defaultComposer === "string") {
            defaultComposerInput.value = data.defaultComposer;
          }
          if (typeof data.defaultLength === "string") {
            defaultLengthSelect.value = data.defaultLength;
          }
        }
      } catch (_error) {
        // ignore broken localStorage
      }
    }
  </script>
</body>
</html>
