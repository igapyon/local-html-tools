<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusicXML → MIDI 変換</title>
    <link rel="stylesheet" href="src/musicxml-to-midi/css/app.css" />
</head>
<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <symbol id="md-icon-menu" viewBox="0 0 24 24">
        <path d="M4 7h16" />
        <path d="M4 12h16" />
        <path d="M4 17h16" />
      </symbol>
    </defs>
  </svg>

  <main class="md-shell">
    <section class="md-card">
      <button type="button" class="md-menu-button" aria-label="メニュー" onclick="toggleMenu()">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <use href="#md-icon-menu" xlink:href="#md-icon-menu"></use>
        </svg>
      </button>
      <div id="menuPanel" class="md-menu-panel md-hidden">
        <a href="../index.html" class="md-menu-link">トップへ戻る</a>
      </div>

      <h1 class="md-headline">
        <span aria-hidden="true" class="md-headline__icon">🥁</span>
        <span>MusicXML → MIDI 変換</span>
        <span class="md-tooltip-group">
          <span class="md-info-chip" tabindex="0" aria-label="このツールの説明">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
              <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
              <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
              <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
            </svg>
          </span>
          <span class="md-tooltip-content md-tooltip">MusicXMLをMIDIへ変換します。MVPとして先頭パートの単旋律を対象にし、MIDIを書き出します。</span>
        </span>
      </h1>

      <section class="md-section">
        <div class="md-title-info-row">
          <h2 class="md-section-title">MusicXML入力</h2>
          <span class="md-tooltip-group">
            <span class="md-info-chip" tabindex="0" aria-label="入力説明">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
                <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
                <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
                <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
              </svg>
            </span>
            <span class="md-tooltip-content md-tooltip">MusicXMLソースを入力するか `.musicxml` / `.xml` を読み込んでください。</span>
          </span>
        </div>

        <div class="md-radio-group" role="radiogroup" aria-label="入力方式">
          <label class="md-radio-option">
            <input id="inputModeFile" type="radio" name="inputMode" value="file" checked />
            <span>ファイル読込</span>
          </label>
          <label class="md-radio-option">
            <input id="inputModeSource" type="radio" name="inputMode" value="source" />
            <span>ソースコード入力</span>
          </label>
        </div>

        <div id="sourceInputBlock">
          <textarea id="xmlInput" class="md-textarea md-textarea--compact" rows="10" spellcheck="false"><?xml version="1.0" encoding="UTF-8"?>
<score-partwise version="3.1">
  <work><work-title>Simple Scale</work-title></work>
  <identification><creator type="composer">Unknown</creator></identification>
  <part-list>
    <score-part id="P1"><part-name>Music</part-name></score-part>
  </part-list>
  <part id="P1">
    <measure number="1">
      <attributes>
        <divisions>960</divisions>
        <key><fifths>0</fifths></key>
        <time><beats>4</beats><beat-type>4</beat-type></time>
      </attributes>
      <direction placement="above"><sound tempo="120"/></direction>
      <note><pitch><step>C</step><octave>4</octave></pitch><duration>960</duration><type>quarter</type></note>
      <note><pitch><step>D</step><octave>4</octave></pitch><duration>960</duration><type>quarter</type></note>
      <note><pitch><step>E</step><octave>4</octave></pitch><duration>960</duration><type>quarter</type></note>
      <note><rest/><duration>960</duration><type>quarter</type></note>
    </measure>
  </part>
</score-partwise></textarea>
        </div>

        <div id="fileInputBlock" class="md-hidden">
          <div class="md-actions">
            <button id="fileSelectBtn" class="md-button md-button--primary" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:0.35rem">
                <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <path d="M12 10v6" />
                <path d="M9.5 13.5 12 16l2.5-2.5" />
              </svg>
              <span>ファイルを選択</span>
            </button>
            <span id="fileNameText">未選択</span>
          </div>
          <input id="fileInput" class="md-file" type="file" accept=".musicxml,.xml,text/xml,application/xml" hidden />
        </div>
      </section>

      <section class="md-section">
        <div class="md-title-info-row">
          <h2 class="md-section-title">変換設定</h2>
          <span class="md-tooltip-group">
            <span class="md-info-chip" tabindex="0" aria-label="設定説明">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
                <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
                <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
                <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
              </svg>
            </span>
            <span class="md-tooltip-content md-tooltip">MusicXML内に値が無い場合の既定値です。テンポはBPMです。音色上書きを選ぶとMIDI Programを強制設定します。</span>
          </span>
        </div>

        <details class="md-disclosure">
          <summary class="md-disclosure-summary">詳細設定（既定タイトル / 既定作曲者 / 既定テンポ）</summary>
          <div class="md-grid md-grid--defaults">
            <div>
              <label class="md-label" for="defaultTitleInput">既定タイトル</label>
              <input id="defaultTitleInput" class="md-input" type="text" value="Untitled" />
            </div>
            <div>
              <label class="md-label" for="defaultComposerInput">既定作曲者</label>
              <input id="defaultComposerInput" class="md-input" type="text" value="Unknown" />
            </div>
            <div>
              <label class="md-label" for="defaultTempoInput">既定テンポ (BPM)</label>
              <input id="defaultTempoInput" class="md-input" type="number" min="20" max="300" step="1" value="120" />
            </div>
          </div>
        </details>
        <div class="md-grid">
          <div>
            <label class="md-label" for="instrumentOverrideSelect">音色上書き</label>
            <select id="instrumentOverrideSelect" class="md-input">
              <option value="">MusicXMLを使用</option>
              <option value="fm_piano_1">FM Piano 1 (Electric Piano 1)</option>
              <option value="fm_piano_2">FM Piano 2 (Electric Piano 2)</option>
            </select>
          </div>
          <div>
            <label class="md-label" for="synthWaveformSelect">内蔵シンセ波形</label>
            <select id="synthWaveformSelect" class="md-input">
              <option value="sine">sine (やわらかい音)</option>
              <option value="square">square (明るく硬い音)</option>
              <option value="triangle">triangle (中間の音)</option>
            </select>
          </div>
        </div>

        <div class="md-actions">
          <button id="convertBtn" class="md-button md-button--primary" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:0.35rem">
              <path d="M5 7h10" />
              <path d="M11 3l4 4-4 4" />
              <path d="M19 17H9" />
              <path d="M13 13l-4 4 4 4" />
            </svg>
            <span>変換</span>
          </button>
          <button id="downloadBtn" class="md-button md-button--secondary" type="button" disabled>
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:0.35rem">
              <path d="M12 4v9" />
              <path d="M8 10l4 4 4-4" />
              <path d="M5 18h14" />
            </svg>
            <span>MIDI保存</span>
          </button>
          <button id="playBtn" class="md-button md-button--secondary" type="button" disabled>
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="vertical-align:middle;margin-right:0.35rem">
              <path d="M8 5v14l11-7z" />
            </svg>
            <span>再生</span>
          </button>
          <button id="stopBtn" class="md-button md-button--secondary" type="button" disabled>
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="vertical-align:middle;margin-right:0.35rem">
              <rect x="7" y="7" width="10" height="10" rx="1.5"></rect>
            </svg>
            <span>停止</span>
          </button>
        </div>
        <p id="errorText" class="md-error md-hidden" role="alert"></p>
        <p id="warningText" class="md-warning md-hidden"></p>
      </section>

      <section class="md-section">
        <div class="md-title-info-row">
          <h2 class="md-section-title">簡易プレビュー</h2>
          <span class="md-tooltip-group">
            <span class="md-info-chip" tabindex="0" aria-label="プレビュー説明">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="md-info-icon" fill="none">
                <circle cx="12" cy="12" r="9" fill="#cbbcf0"></circle>
                <rect x="11" y="10" width="2" height="7" rx="1" fill="#ffffff"></rect>
                <circle cx="12" cy="7.5" r="1" fill="#ffffff"></circle>
              </svg>
            </span>
            <span class="md-tooltip-content md-tooltip">変換されたMIDIの要約情報です。</span>
          </span>
        </div>
        <div id="previewText" class="md-preview">未変換</div>
      </section>
    </section>
  </main>

  <div id="toast" class="md-snackbar md-hidden" role="status" aria-live="polite"></div>

    <script src="src/musicxml-to-midi/js/midi-writer.js"></script>
  <script src="src/musicxml-to-midi/js/main.js"></script>
</body>
</html>
